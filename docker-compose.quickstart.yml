# kontra local cluster (ADR 0047). Two files and `docker compose up -d --wait`.
#
#   gh api repos/medmahmoudi26/kontra/contents/docker-compose.quickstart.yml \
#     -H "Accept: application/vnd.github.raw" > docker-compose.yml
#   gh api repos/medmahmoudi26/kontra/contents/.env.quickstart \
#     -H "Accept: application/vnd.github.raw" > .env
#   mkdir -p workspace
#   docker compose up -d --wait
#   docker compose logs workspace-init | grep -A4 'console login'
#
# Postgres, Temporal, SeaweedFS, Redis, the registry, and the kontra processes are separate
# services. The appliance (`kontra up` as one process) is not a supported install path.
#
# ── THE DOCKER SOCKET ──────────────────────────────────────────────────────────────────────────
#
# `orchestrator-infra` and `workspace-watch` mount `/var/run/docker.sock`. A local Fleet's Warden
# containers (created by Pulumi `dockerFleet`) mount it too. That is host-level Docker authority:
# anything with the socket can start privileged containers. Acceptable for a single-operator
# laptop. Not tenant isolation. Do not expose this stack as a shared service.
#
# ── LOOPBACK IS THE SECURITY CONTROL ───────────────────────────────────────────────────────────
#
# Every published port binds `${KONTRA_BIND}`, default `127.0.0.1`. A published Docker port is
# DNATed in PREROUTING and accepted in FORWARD — a host firewall does not protect it. Do not
# change KONTRA_BIND to 0.0.0.0 to "make it work from another machine".

name: ${COMPOSE_PROJECT_NAME:-kontra}

x-workspace: &workspace ${KONTRA_WORKSPACE:-${PWD}/workspace}

x-orchestrator-env: &orchestrator-env
  KONTRA_HOME: /var/lib/kontra
  KONTRA_ADDRESS: temporal:7233
  KONTRA_NAMESPACE: ${KONTRA_NAMESPACE:-default}
  KONTRA_S3_ENDPOINT: http://seaweed-s3:8333
  KONTRA_S3_BUCKET: kontra
  KONTRA_S3_REGION: us-east-1
  KONTRA_S3_ACCESS_KEY: kontra
  KONTRA_S3_SECRET_KEY: kontra
  KONTRA_REDIS_HOST: redis:6379
  KONTRA_REGISTRY: registry:5000
  KONTRA_ORCHESTRATOR_URL: http://orchestrator-api:8088
  KONTRA_DUCKLAKE_CATALOG: postgres:dbname=kontra_ducklake host=postgres user=kontra password=kontra
  KONTRA_MATERIALIZATION_DB: postgres://kontra:kontra@postgres:5432/kontra_ducklake
  KONTRA_WORKSPACE: *workspace
  KONTRA_IMAGE: ${KONTRA_IMAGE:-ghcr.io/medmahmoudi26/kontra:latest}
  KONTRA_HOST_IMAGE: ${KONTRA_HOST_IMAGE:-ghcr.io/medmahmoudi26/kontra-host:1}
  KONTRA_TRUST_REGISTRIES: registry:5000
  KONTRA_TRUST_UNSIGNED: registry:5000

x-kontra-home: &kontra-home
  - kontra-home:/var/lib/kontra
  - ${KONTRA_WORKSPACE:-${PWD}/workspace}:${KONTRA_WORKSPACE:-${PWD}/workspace}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kontra
      POSTGRES_PASSWORD: kontra
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontra"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: kontra
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U kontra -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='kontra_ducklake'" | grep -q 1 \
          || psql -h postgres -U kontra -d postgres -c "CREATE DATABASE kontra_ducklake"
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: kontra
      POSTGRES_PWD: kontra
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_KV_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  registry:
    image: registry:2
    restart: unless-stopped
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_REGISTRY_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweed-master:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: "master -ip=seaweed-master -port=9333 -mdir=/data"
    volumes:
      - seaweed-master:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweed-volume:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    depends_on:
      seaweed-master:
        condition: service_healthy
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -port=8080 -dir=/data -max=100"
    volumes:
      - seaweed-volume:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweed-filer:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    depends_on:
      seaweed-master:
        condition: service_healthy
      seaweed-volume:
        condition: service_healthy
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer -port=8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8888/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweed-s3:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    depends_on:
      seaweed-filer:
        condition: service_healthy
    command: "s3 -filer=seaweed-filer:8888 -port=8333 -ip.bind=0.0.0.0"
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8333/ >/dev/null || wget -q -O- http://127.0.0.1:8333/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweed-bucket:
    image: chrislusf/seaweedfs:3.80
    depends_on:
      seaweed-master:
        condition: service_healthy
      seaweed-s3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 's3.bucket.create -name kontra' | weed shell -master=seaweed-master:9333 || true
    restart: "no"

  workspace-init:
    image: ${KONTRA_IMAGE:-ghcr.io/medmahmoudi26/kontra:latest}
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      KONTRA_HOME: /var/lib/kontra
      KONTRA_WORKSPACE: *workspace
      KONTRA_NAMESPACE: ${KONTRA_NAMESPACE:-default}
    volumes: *kontra-home
    command: ["kontra", "workspace", "seed"]
    restart: "no"

  orchestrator-api:
    image: ${KONTRA_ORCHESTRATOR_IMAGE:-ghcr.io/medmahmoudi26/kontra-orchestrator:latest}
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweed-bucket:
        condition: service_completed_successfully
      registry:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
    environment:
      <<: *orchestrator-env
      KONTRA_ORCHESTRATOR_ROLES: api
    volumes:
      - kontra-home:/var/lib/kontra:ro
      - ${KONTRA_WORKSPACE:-${PWD}/workspace}:${KONTRA_WORKSPACE:-${PWD}/workspace}:ro
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_API_PORT:-8088}:8088"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8088/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  orchestrator-materializer:
    image: ${KONTRA_ORCHESTRATOR_IMAGE:-ghcr.io/medmahmoudi26/kontra-orchestrator:latest}
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      seaweed-bucket:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
    environment:
      <<: *orchestrator-env
      KONTRA_ORCHESTRATOR_ROLES: materializer
    volumes:
      - kontra-home:/var/lib/kontra:ro
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5

  orchestrator-infra:
    image: ${KONTRA_ORCHESTRATOR_IMAGE:-ghcr.io/medmahmoudi26/kontra-orchestrator:latest}
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
    environment:
      <<: *orchestrator-env
      KONTRA_ORCHESTRATOR_ROLES: infra
      KONTRA_INFRA_QUEUE: kontra-infra
      KONTRA_PULUMI_STATE_DIR: /data/pulumi-state
      KONTRA_PULUMI_WORK_DIR: /data/pulumi
      # Local-only default. A value you set in .env wins. `down -v` destroys this state.
      PULUMI_CONFIG_PASSPHRASE: ${PULUMI_CONFIG_PASSPHRASE:-local-dev}
      DIGITALOCEAN_TOKEN: ${DIGITALOCEAN_TOKEN:-}
      KONTRA_CLOUD_CREDENTIAL: ${KONTRA_CLOUD_CREDENTIAL:-}
    volumes:
      - kontra-home:/var/lib/kontra:ro
      - pulumi-state:/data
      # Host-level Docker authority — see the file header.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5

  orchestrator-probe:
    image: ${KONTRA_HOST_IMAGE:-ghcr.io/medmahmoudi26/kontra-host:1}
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      seaweed-bucket:
        condition: service_completed_successfully
      orchestrator-api:
        condition: service_healthy
    environment:
      KONTRA_ADDRESS: temporal:7233
      KONTRA_S3_ENDPOINT: http://seaweed-s3:8333
      KONTRA_S3_BUCKET: kontra
      KONTRA_ORCHESTRATOR_URL: http://orchestrator-api:8088
      KONTRA_PROBE_QUEUE: ${KONTRA_PROBE_QUEUE:-kontra-probe}
    command: ["python3", "-m", "kontra.probe"]
    healthcheck:
      test: ["CMD", "python3", "-c", "raise SystemExit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5

  workspace-watch:
    image: ${KONTRA_IMAGE:-ghcr.io/medmahmoudi26/kontra:latest}
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      orchestrator-api:
        condition: service_healthy
      registry:
        condition: service_healthy
    environment:
      KONTRA_HOME: /var/lib/kontra
      KONTRA_WORKSPACE: *workspace
      KONTRA_ORCHESTRATOR_URL: http://orchestrator-api:8088
      KONTRA_REGISTRY: registry:5000
      KONTRA_HOST_IMAGE: ${KONTRA_HOST_IMAGE:-ghcr.io/medmahmoudi26/kontra-host:1}
      KONTRA_SKIP_INIT: "1"
    volumes:
      - kontra-home:/var/lib/kontra
      - ${KONTRA_WORKSPACE:-${PWD}/workspace}:${KONTRA_WORKSPACE:-${PWD}/workspace}
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["kontra", "workspace", "watch"]

  cli:
    image: ${KONTRA_IMAGE:-ghcr.io/medmahmoudi26/kontra:latest}
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      orchestrator-api:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      <<: *orchestrator-env
      KONTRA_SKIP_INIT: "1"
      KONTRA_SDK_ROOT: /opt/kontra
      KONTRA_ADDRESS: temporal:7233
    volumes:
      - kontra-home:/var/lib/kontra
      - ${KONTRA_WORKSPACE:-${PWD}/workspace}:${KONTRA_WORKSPACE:-${PWD}/workspace}
    command: ["sleep", "infinity"]

networks:
  default:
    name: kontra

volumes:
  postgres-data:
  redis-data:
  registry-data:
  seaweed-master:
  seaweed-volume:
  kontra-home:
  pulumi-state:
    # `docker compose down` keeps this. `down -v` destroys Pulumi dockerFleet state AND Datasets.
    # Named so an operator has to type the destructive flag.
