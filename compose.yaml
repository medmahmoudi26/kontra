# The team gate on one host (D43, D168): the gate built from this repository's Dockerfile, terminating TLS itself
# (no proxy in front, as on a VPS), temporalio/server 1.32.1 with its dynamic configuration and two one-shot
# temporalio/admin-tools jobs (the schema, the kontra namespace), and Postgres 16. Only the gate's public listener is
# published, and its metrics on loopback; Temporal and Postgres are reachable on the compose network only
# (spec/relay.md §14.4).
#
# Two configurations, chosen with KONTRA_CONFIG (each file says what to edit):
#   - deploy/compose/kontra.yaml (the default): TLS from a certificate you provide, in deploy/compose/tls/;
#   - deploy/compose/kontra.vps.yaml: built-in ACME (TLS-ALPN-01, D82) for a fresh VPS with a DNS name and no
#     certificate yet (D281). Publish it on port 443 (KONTRA_PORT=443): the CA validates there. The certificate
#     and the ACME account key stay in the named volume acme, mounted at /var/lib/kontra-gate (the image creates that
#     directory owned by the gate's uid, 65532, so a new volume is writable).
#
#   docker compose up -d --build --wait
#   docker compose exec gate kontra-gate enroll -f /etc/kontra/kontra.yaml --api-key me     # an API key, once
#   docker compose exec gate kontra-gate enroll -f /etc/kontra/kontra.yaml hello            # a node's token
#   kontra connect --gate https://<public_url host> --enroll <token> --serve a2a:hello=http://127.0.0.1:9999
#   docker compose down            # -v also drops the databases and the ACME cache
#
# Settings, from the environment or an .env file beside this one:
#   KONTRA_LISTEN_ADDR, KONTRA_PORT   where the public listener is published (default every address, IPv4 and IPv6,
#                                    port 8443; 443 for ACME); an address restricts it (127.0.0.1, or [::1])
#   KONTRA_METRICS_PORT              the metrics listener, on 127.0.0.1 (default 9090)
#   KONTRA_CONFIG                    the configuration file (default deploy/compose/kontra.yaml)
#   KONTRA_TLS_DIR, KONTRA_SIGNING_DIR   the certificate's and the signing key's directories (default
#                                    deploy/compose/tls and deploy/compose/signing), mounted read-only
#   KONTRA_DB_PASSWORD, TEMPORAL_DB_PASSWORD, POSTGRES_PASSWORD   the database roles' passwords, read when the
#                                    Postgres volume is first initialised (kontra's is also in the configuration)
#
# The healthcheck dials the gate's own listener with public_url's host as the TLS server name (-f): built-in ACME
# refuses a handshake without one. The pentest (test/pentest, M3 WP-10) runs this file with compose.pentest.yaml under
# the project m3pentest; test/vps runs the ACME variant (KONTRA_KIT_TESTS=1).

# The gate's settings, shared by gate-migrate and gate. The image is built by the gate service alone (D313).
x-gate: &gate
  image: kontra-gate:m4
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - ${KONTRA_CONFIG:-./deploy/compose/kontra.yaml}:/etc/kontra/kontra.yaml:ro
    - ${KONTRA_TLS_DIR:-./deploy/compose/tls}:/etc/kontra/tls:ro
    - ${KONTRA_SIGNING_DIR:-./deploy/compose/signing}:/etc/kontra/signing:ro
    - acme:/var/lib/kontra-gate # built-in ACME's cache (tls.acme.cache_dir); unused with a provided certificate

x-temporal-env: &temporal-env
  DB: postgres12
  DB_PORT: "5432"
  POSTGRES_SEEDS: postgres
  POSTGRES_USER: temporal
  POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}

services:
  postgres:
    image: postgres:16-alpine # D43: Temporal supports 13-16, Cloud runs 16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      KONTRA_DB_PASSWORD: ${KONTRA_DB_PASSWORD:-kontra}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/compose/postgres-init.sh:/docker-entrypoint-initdb.d/kontra.sh:ro
    healthcheck:
      # Over TCP, as the gate and Temporal connect: on a fresh volume the image runs the init scripts on a server that
      # listens on its Unix socket only, and a check over the socket passes up to a second before TCP is served.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U kontra -d kontra"]
      interval: 2s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  # One-shot: Temporal's two databases and their schemas, brought to the server's version (idempotent).
  temporal-schema:
    image: temporalio/admin-tools:1.32.1
    environment:
      <<: *temporal-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        sql() { temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 -u temporal --pw "$$POSTGRES_PWD" "$$@"; }
        schema() {
          { sql --db temporal create-database 2>/dev/null || true; } &&
          { sql --db temporal_visibility create-database 2>/dev/null || true; } &&
          { sql --db temporal setup-schema -v 0.0 2>/dev/null || true; } &&
          sql --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned &&
          { sql --db temporal_visibility setup-schema -v 0.0 2>/dev/null || true; } &&
          sql --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned
        }
        # A bounded retry (every step is idempotent): a database that refuses connections for a moment after its
        # healthcheck passed does not fail the first start.
        n=0
        until schema; do
          n=$$((n+1)); [ "$$n" -lt 30 ] || { echo "the Temporal schema could not be set up"; exit 1; }; sleep 2
        done
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  temporal:
    image: temporalio/server:1.32.1
    environment:
      <<: *temporal-env
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig/kontra.yaml
    volumes:
      - ./deploy/compose/dynamicconfig.yaml:/etc/temporal/dynamicconfig/kontra.yaml:ro
    depends_on:
      temporal-schema: { condition: service_completed_successfully }
    restart: unless-stopped

  # One-shot: the gate's namespace (temporal.namespace, spec §14.1), once the frontend answers.
  temporal-namespace:
    image: temporalio/admin-tools:1.32.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        n=0
        until temporal operator cluster health --address temporal:7233 >/dev/null 2>&1; do
          n=$$((n+1)); [ "$$n" -lt 180 ] || { echo "temporal did not answer"; exit 1; }; sleep 1
        done
        temporal operator namespace describe --namespace kontra --address temporal:7233 >/dev/null 2>&1 ||
          temporal operator namespace create --namespace kontra --retention 72h --address temporal:7233
    depends_on:
      temporal: { condition: service_started }
    restart: "no"

  # One-shot: the gate's own schema (kontra-gate migrate, D28), before any replica serves. migrate waits up to a minute
  # for a database that refuses connections (one still starting) before it gives up. It runs the image the gate service
  # builds and builds none itself (D313); compose builds every image before it creates any container. Run alone, it
  # needs that image first: docker compose build gate && docker compose run --rm gate-migrate.
  gate-migrate:
    <<: *gate
    command: ["migrate", "-f", "/etc/kontra/kontra.yaml", "up"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  gate:
    <<: *gate
    # The one service that builds kontra-gate:m4; gate-migrate runs the image it builds (D313). Two services building
    # one tag race on Docker 29's containerd image store (a fresh Ubuntu 24.04's docker.io, compose 2.40): the second
    # export fails with image "docker.io/library/kontra-gate:m4": already exists (the M4 VPS gate run, 31 Oct).
    build:
      context: .
      args: { VERSION: m4 }
    command: ["serve", "-f", "/etc/kontra/kontra.yaml"]
    ports:
      - "${KONTRA_LISTEN_ADDR:+${KONTRA_LISTEN_ADDR:-}:}${KONTRA_PORT:-8443}:8443"
      - "127.0.0.1:${KONTRA_METRICS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "/usr/local/bin/kontra-gate", "health", "--url", "https://127.0.0.1:8443/healthz",
             "-f", "/etc/kontra/kontra.yaml"]
      interval: 3s
      timeout: 6s
      retries: 60
      start_period: 5s
    depends_on:
      gate-migrate: { condition: service_completed_successfully }
      temporal-namespace: { condition: service_completed_successfully }
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres: {}
  acme: {}
