name: publish

# WHAT A TAG SHIPS (ADR 0052 §3, issues 10 and 16).
#
# Two artifact kinds move on the ONE tag ADR 0038 already defines, and there is no second version
# axis: the per-platform `kontra` binaries on the GitHub release, and the control plane's own
# container images at `ghcr.io/<owner>`. `kontra up` is supposed to be seconds; today the documented
# install runs `make image` plus three hand-typed `docker build`s first (README.md:49-53), which is
# the difference between seconds and minutes and the whole reason this file exists.
#
# ── THE TWO HALVES FAIL INDEPENDENTLY, AND THE RELEASE IS ORDERED LAST ──────────────────────────
#
# Issue 16's last acceptance criterion is "a release that publishes a binary without its matching
# images fails". That is a statement about ORDER, not about a check: `gh release create` is the very
# last thing this workflow does, and it is downstream of the image push, the digest pin and the
# anonymous-pull probe. A workflow that created the release first and pushed images afterwards would
# pass every test in this file and still leave a published binary whose `kontra up` cannot pull.
#
# The reverse exposure is accepted deliberately: image tags can exist for a version that never got a
# release. An image tag nothing references is inert; a release referencing images that do not exist
# is the failure an operator hits on their first install.
#
# ── EVERY REFERENCE THIS WORKFLOW PUBLISHES IS A DIGEST ─────────────────────────────────────────
#
# `images.json` and `images.env` on the release name every image as `repo@sha256:…`, never as a tag.
# `control/orchestrator/src/infra/CONTEXT.md:228` is the reason it matters for the third-party half:
# "a reference with no host is Docker Hub, whose hundred manifest reads an hour are per *address*,
# not per account". Eight anonymous Docker Hub pulls per install, from a public quickstart, behind
# corporate NAT or on a shared CI runner, is a rate limit somebody else's install spends. So the eight
# images `docker-compose.yml` names are mirrored to the same registry as ours and pinned.
#
# `latest` is pushed by nothing here. A floating tag in a registry is a thing an install can resolve
# by accident, and what this install resolves is a digest.
#
# ── IT OVERLAPS `release.yml`, ON PURPOSE, AND THAT IS TEMPORARY ────────────────────────────────
#
# `release.yml` still triggers on `v*` and still creates the release and pushes
# `ghcr.io/<owner>/kontra:<version>` and `:latest` from `Dockerfile.appliance`. It could not simply be
# edited out of the way: `cli/version_test.go:112` reads `.github/workflows/release.yml` by name and
# `t.Fatalf`s if it is missing or empty, and `cli/appliance/bundle/pins_test.go:362` reads it too.
# Deleting or renaming it breaks a test. Issue 08 removes the appliance and takes that job with it.
#
# Until then, two consequences, both stated rather than discovered:
#
#   * The GitHub release may already exist by the time this workflow reaches it. The publish step is
#     therefore create-or-upload rather than `gh release create` alone, which would abort with
#     "release already exists" and throw away the signatures — the one artifact `release.yml` does
#     not produce.
#   * Both workflows push `<registry>/kontra:<version>`. Whichever lands second wins the TAG. It
#     cannot change what a DIGEST names, and the install resolves digests, so the collision is
#     survivable rather than silent. `release.yml` also moves `:latest`; nothing here does.
#
#   * And it doubles the four native builds on every tag, including two billable macOS runners at ten
#     linux minutes per minute (appliance.yml:59-64). That cost is real and ends with issue 08.
#
# ── `- platform:` IS SAFE IN THIS FILE AND WOULD NOT BE IN THE OTHER TWO ────────────────────────
#
# `cli/appliance/bundle/pins_test.go:362-388` regex-scans `^\s*-\s*platform:\s*(\S+)$` out of exactly
# two filenames — `.github/workflows/appliance.yml` and `.github/workflows/release.yml` — and errors
# on a platform missing from `Platforms()` AND on an extra one. This file is neither of those names,
# so its matrix is unconstrained by that test. The matrix below is still the same four, because
# `cli/appliance/bundle/pins.go:146-153` is the one list, and the completeness check in `release`
# derives from the matrix for the same reason release.yml:155-161 gives: a hard-coded four beside a
# matrix of four is how a platform gets added in one place and silently never released.

on:
  push:
    tags: ["v*"]
  # THE ESCAPE HATCH, AND WHY IT IS A VERSION INPUT RATHER THAN A DRY-RUN FLAG.
  #
  # `git tag` in this repository returns zero tags and `release.yml` has never run once
  # (release-please.yml:5-8). Every path below — the keyless certificate chain, the GHCR push, the
  # skopeo mirror, the anonymous pull — is unexercised until a tag exists, and a first tag is a bad
  # place to find out. `install-appliance.sh:25-33` invented `KONTRA_BASE_URL` for exactly this
  # problem and said why: "this file can be run before it is published… That is how it is tested, and
  # the test is the reason the variable is here rather than a convenience."
  #
  # A dispatch really does push to ghcr.io — a dry run that pushed nothing would prove nothing about
  # the half of this file that is a registry. What it cannot do is create a GitHub release, because
  # there is no tag to hang one on. So name the version `0.0.0-test1` and a test cannot be mistaken
  # for a release: it collides with no tag, and the release step skips itself.
  workflow_dispatch:
    inputs:
      version:
        description: "version to build and publish, no leading v (use 0.0.0-testN — this DOES push to ghcr.io)"
        required: true

# NEVER CANCEL A PUBLISH IN FLIGHT. `cancel-in-progress: true` — which `appliance.yml:51-53` uses,
# correctly, for a workflow that only computes digests — would here stop a run between the
# `kontra-orchestrator` push and the `kontra-host` push and leave the registry holding a version that
# is three-quarters shipped. Two tags in flight queue instead.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # plan — the version, the registry, and the names, computed ONCE and before anything expensive.
  #
  # IT IS A JOB RATHER THAN A STEP BECAUSE THE DRIFT CHECK BELONGS IN FRONT OF THE COST. The image
  # names are derived from the install rather than typed here, and a name this workflow does not know
  # how to build has to fail in twenty seconds, not after four native binary builds and two arm64
  # container builds have already been paid for.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  plan:
    name: version and names
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      registry: ${{ steps.v.outputs.registry }}
      kontra_images: ${{ steps.names.outputs.kontra_images }}
      compose_vars: ${{ steps.names.outputs.compose_vars }}
      mirror: ${{ steps.names.outputs.mirror }}
    steps:
      - uses: actions/checkout@v4

      # ONE NUMBER, AND IT IS THE TAG WITH ITS `v` OFF.
      #
      # `cli/release.go:314-330` would derive this itself from `git describe`, and `release.yml`
      # lets it. This passes it explicitly because the derivation needs `fetch-depth: 0` on four
      # runners to be right, and when it is wrong it is not an error — it is a release named
      # `kontra_ad8871a-dirty_linux_amd64.tar.gz`, which is a name nobody can report a bug against.
      #
      # The tarball name is bare (`cli/release.go:222`) and the git tag keeps its `v`, which is why
      # `install-appliance.sh:89` has a `bare=${version#v}` in it. Both spellings are outputs here so
      # that nothing downstream strips a prefix a second time.
      - name: the version
        id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            tag=""
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          case "$version" in
            ""|*[!0-9A-Za-z.+-]*)
              echo "::error::refusing to publish version '$version' — it is empty or has a character no image tag accepts"
              exit 1
              ;;
          esac
          # GHCR repository paths are lowercase-only; the owner is not.
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "registry=$registry"
          } >> "$GITHUB_OUTPUT"
          echo "publishing $version to $registry (tag: '${tag:-none, dispatch}')"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      # ── THE FOUR NAMES COME FROM THE INSTALL, NOT FROM THIS FILE ─────────────────────────────
      #
      # Three of them are `docker-compose.yml`'s own `${KONTRA_*_IMAGE:-<default>}` defaults — the
      # thing an install actually resolves — and the fourth is `cli/deploy.go`'s `workerBaseImage`
      # constant, because compose never names it. Reading both means a fifth kontra-owned service
      # appearing in compose is published on the next tag instead of being the one image the install
      # still has to build by hand.
      #
      # THE HAND-WRITTEN HALF IS THE name→Dockerfile TABLE IN `images` BELOW, and it is the only
      # hand-written half. A derived name that table does not know is a hard failure there, named as
      # such, rather than a loop that quietly iterates over three of four.
      - name: the image names, derived
        id: names
        run: |
          set -euo pipefail

          # `${KONTRA_IMAGE:-ghcr.io/medmahmoudi26/kontra:dev}` → `kontra=KONTRA_IMAGE`.
          #
          # COMPOSE DECIDES THE NAME. THIS WORKFLOW DECIDES THE REGISTRY AND THE TAG. The `:-` default
          # carries all three, and only the middle one is read here — which is why retagging or
          # re-homing an image is not a change to this job, and renaming one is.
          #
          # THE SECOND `sed` IS LOAD-BEARING and was added when compose's defaults stopped being bare
          # local tags. The quickstart is `curl docker-compose.yml && docker compose up -d` with no
          # `.env`, so every default in that file has to be a reference a stranger's Docker can
          # actually resolve — `ghcr.io/<owner>/<name>:dev`, not `kontra-orchestrator:latest`. But
          # `[^:}]+` above has no `:` to stop at inside `ghcr.io/owner/name`, so it captures the whole
          # path and `$2` became `ghcr.io/medmahmoudi26/kontra-orchestrator`. The `case` in the
          # `images` job matches bare names, so all five would have fallen through to its `*)` arm and
          # failed the build with "an image this workflow does not know how to build" — naming a
          # registry path, which is the least actionable form of that error.
          #
          # It strips an optional leading path, so a bare name still passes through unchanged and a
          # checkout that has not moved to qualified defaults derives exactly what it did before.
          #
          # NEWLINE-SEPARATED UNTIL THE OUTPUT, then joined with spaces once. A job output cannot hold
          # a newline, and getting the entries back apart by leaving `$var` unquoted for the shell to
          # split is the thing that works until one of these names contains a glob character.
          compose_pairs=$(grep -hoE '\$\{KONTRA_[A-Z_]*IMAGE:-[^}]+\}' docker-compose.yml \
            | sed -E 's/^\$\{(KONTRA_[A-Z_]*IMAGE):-([^:}]+)(:[^}]*)?\}$/\2=\1/' \
            | sed -E 's#^([^=]*/)?([^/=]+)=#\2=#' \
            | sort -u)

          # `const workerBaseImage = "kontra-worker-base:1"` — cli/deploy.go:89.
          worker_base=$(grep -oE 'workerBaseImage = "[^"]+"' cli/deploy.go \
            | sed -E 's/.*"([^"]+)".*/\1/' | cut -d: -f1)

          names=$(
            { printf '%s\n' "$compose_pairs" | sed -E 's/=.*//'; printf '%s\n' "$worker_base"; } \
            | grep . | sort -u
          )

          # VACUITY GUARD. Every derivation above is a grep, and a grep that stops matching returns
          # zero lines and exit 1 under `pipefail` only if it is the last command in the pipe — it is
          # not. So the count is asserted: four is what `make image` plus the README's three
          # hand-typed `docker build`s produce today (README.md:49-53, Makefile:139-149).
          count=$(printf '%s\n' "$names" | grep -c . || true)
          if [ "$count" -lt 4 ]; then
            echo "::error::derived only $count kontra-owned image names ($names) — expected at least 4."
            echo "::error::docker-compose.yml's \${KONTRA_*_IMAGE:-…} defaults or cli/deploy.go's workerBaseImage moved."
            exit 1
          fi

          # ── THE MIRROR LIST: every `image:` in compose that is NOT one of ours ─────────────────
          #
          # An `image:` line with no `${…}` in it is a third-party reference the install pulls
          # anonymously. Three shapes are handled rather than assumed away:
          #
          #   already at our registry  skipped — mirroring a mirror is a loop
          #   already carrying @sha256 skipped — it is pinned, there is nothing left to pin
          #   no tag at all            REFUSED — an untagged reference means `:latest`, and silently
          #                            mirroring somebody's moving tag is the exact trap this job is
          #                            here to close
          registry="${{ steps.v.outputs.registry }}"
          mirror=""
          while read -r ref; do
            [ -n "$ref" ] || continue
            case "$ref" in
              "$registry"/*|ghcr.io/*) continue ;;
              *@*) continue ;;
            esac
            base="${ref##*/}"
            case "$base" in
              *:*) ;;
              *)
                echo "::error::docker-compose.yml names '$ref' with no tag — that is :latest, and it will not be mirrored blind"
                exit 1
                ;;
            esac
            mirror="${mirror}${ref}"$'\n'
          done < <(grep -hoE '^[[:space:]]+image:[[:space:]]+[^$[:space:]]+' docker-compose.yml \
                   | awk '{print $2}' | sort -u)

          mirror=$(printf '%s' "$mirror" | grep . | sort -u)
          mcount=$(printf '%s\n' "$mirror" | grep -c . || true)
          if [ "$mcount" -lt 1 ]; then
            echo "::error::no third-party images derived from docker-compose.yml — the grep stopped matching"
            exit 1
          fi

          {
            echo "kontra_images=$(printf '%s' "$names" | tr '\n' ' ')"
            echo "compose_vars=$(printf '%s' "$compose_pairs" | tr '\n' ' ')"
            echo "mirror=$(printf '%s' "$mirror" | tr '\n' ' ')"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### what this tag publishes"
            echo
            echo "| kontra-owned ($count) |"
            echo "| --- |"
            for n in $names; do echo "| \`$n\` |"; done
            echo
            echo "| mirrored from Docker Hub ($mcount) |"
            echo "| --- |"
            for m in $mirror; do echo "| \`$m\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # binaries — four platforms, each built and RUN on the machine it is for.
  #
  # The same argument release.yml:3-15 makes, unchanged: an artifact users download should have been
  # executed by the machine that made it. `appliance.yml`'s `cross` job proves the cross-build is
  # byte-identical, so a single linux runner could produce all four — but a linux runner
  # cross-building a macOS release can only look at headers, and "does this binary execute here at
  # all" is the one question that matters to somebody who just ran curl | sh.
  #
  # RUNNER AVAILABILITY IS A CONSTRAINT, NOT A DETAIL (appliance.yml:59-64). `ubuntu-24.04-arm` is
  # free for public repositories and billable for private ones; macOS is billable everywhere at ten
  # linux minutes per minute.
  #
  # ── AN UNAVAILABLE LABEL DOES NOT FAIL. IT QUEUES, AND IT QUEUES FOREVER. ───────────────────────
  #
  # This comment used to say a label the repository cannot use "fails with `no runner matching the
  # labels`, which is the right failure". MEASURED, on the first dispatch this workflow ever had:
  # that is not what happens. `darwin/amd64` asked for `macos-13` — a runner image GitHub has retired
  # — and the job sat at `status: queued` with `steps: []` for eighteen minutes, until it was
  # cancelled. There is no error, no annotation and nothing in the log, because the job never
  # started. It would have burned the full `timeout-minutes` and then failed with a timeout, which
  # names the symptom and not the cause.
  #
  # And it took the whole publish with it: `images` needed this job, so four container images that
  # have no macOS dependency at all were blocked behind a macOS runner that was never coming. The
  # mirror finished, the three other binaries finished, and the thing an install actually pulls did
  # not get built.
  #
  # `macos-13` -> `macos-15-intel`, WHICH RESOLVES. Measured on the second dispatch: the job started
  # within thirty seconds and ran eighteen steps, so the Intel label is live and the retired one was
  # the whole cause.
  #
  # ── AND A 20-MINUTE CAP WAS THE WRONG ANSWER TO IT. ────────────────────────────────────────────
  #
  # The first attempt at this set `timeout-minutes` to 20 for the macOS legs, reasoning that twenty
  # minutes is "far more than a CGO_ENABLED=0 Go build needs". That was measured wrong on the next
  # run: `darwin/amd64` was still building at 20:00 and the cap CANCELLED IT — and because
  # `images` needed the whole matrix, the four container images were skipped again. A cap aimed at a
  # job that never starts also caps the job that is merely slow, and it cannot tell them apart.
  #
  # The Intel runner is the long pole by a wide margin: `darwin/arm64` on `macos-14` finished in ~3.5
  # minutes and `darwin/amd64` had not finished in 20. Both do the same work — checkout, the console
  # checkout, `pnpm install`, the SPA build, the bundle, then the release and its smoke run.
  #
  # So the cap goes back to 60 for every platform, and the decoupling moves to where it belongs: see
  # `images` below, which no longer lets a macOS result decide whether container images get built.
  # A bad label now costs an hour of the RELEASE half and nothing of the install half.
  #
  # The native-build rule is untouched. All four are built and RUN on the machine they are for —
  # `cli/release.go:28-32` is explicit that cross-building works and that CI does it natively anyway,
  # because "a cross-built artifact nobody has ever executed is a claim".
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  binaries:
    name: ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/amd64
            runner: macos-15-intel
          - platform: darwin/arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # Not for `git describe` — `plan` computes the version and it is passed in below. It is for
          # `debug.ReadBuildInfo`'s `vcs.revision` (cli/internal/buildinfo/buildinfo.go:49-56), which
          # is what a non-release build reports and what makes a wrong `-X` visible.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/handler/go.mod
          cache-dependency-path: cli/go.sum

      # ── THE SPA, WHICH IS THE ONE THING THE RELEASE DOES NOT BUILD ITSELF ────────────────────
      #
      # These six steps are release.yml:58-95 verbatim in shape, and the duplication is deliberate
      # rather than factored: that file is on its way out with issue 08 and a composite action used
      # by one workflow is indirection bought with nothing.
      #
      # `kontra release` archives a vite output; producing it is the console's own toolchain with its
      # own lockfile, and folding a browser bundler into the thing whose whole claim is that it needs
      # nothing but Go is not a trade worth making. It is another repository since ADR 0038, and the
      # `_sibling/` nesting is not decoration: kontra-console resolves `@kontra/core` as
      # `link:../kontra/core`, so it needs a directory named `kontra` beside it.
      #
      # NO TOKEN. kontra-console was private and this step needed `secrets.KONTRA_CONSOLE_TOKEN` —
      # read access to another repository, which the built-in GITHUB_TOKEN does not grant. It went
      # PUBLIC on 2026-09-26, so an anonymous checkout resolves and the secret is one fewer thing an
      # operator has to be told about. If it is ever made private again this fails with a 404 on a
      # repository that exists (ci.yml records that reading) — not with anything that says "token".
      - name: check out the console
        uses: actions/checkout@v4
        with:
          repository: medmahmoudi26/kontra-console
          path: _sibling/kontra-console
      - name: put this checkout where `link:../kontra/shared/core` expects it
        run: ln -sfn "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/_sibling/kontra"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: build @kontra/core (the console links it out of this checkout)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kontra/core run build
      - name: build the SPA
        working-directory: _sibling/kontra-console
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: point the release at the console's dist
        run: echo "KONTRA_CONSOLE_DIST=$GITHUB_WORKSPACE/_sibling/kontra-console/dist" >> "$GITHUB_ENV"

      - name: release this platform
        working-directory: cli
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          go run . release --repo .. --platform "$PLATFORM" --version "$VERSION" --out "$RUNNER_TEMP/release"

      # ── `kontra version` MUST ANSWER THE TAG, AND THIS IS NOT A TAUTOLOGY ───────────────────
      #
      # The version reaches the binary through the linker and nowhere else: `version` is `""` in the
      # source (buildinfo.go:31) and `-X …buildinfo.version=` is added by `cli/release.go:167-170`.
      # `-X` ON AN UNKNOWN SYMBOL IS NOT AN ERROR — the linker ignores it, the build succeeds, and
      # every release forever reports `dev (abc123)`. buildinfo.go:78-84 says so and says why its own
      # test builds a real binary instead of asserting on a string.
      #
      # So the comparison is exact rather than a grep, and it is made on the binary UNPACKED FROM THE
      # TARBALL a user downloads, on the platform it was built for. `kontra version` prints the bare
      # version and nothing else (cli/main.go:272), so anything other than equality is a finding.
      - name: run the released binary out of its own tarball
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/check"
          tar -xzf "$RUNNER_TEMP"/release/kontra_*.tar.gz -C "$RUNNER_TEMP/check"
          cd "$RUNNER_TEMP/check"
          # 2>&1 because `usage()` writes to STDERR on purpose — piped stdout is for JSONL output —
          # so `| head` on stdout alone would print nothing and check nothing.
          ./kontra help 2>&1 | head -3
          ls -la bundles
          ./kontra bundle verify bundles/kontra-orchestrator-*.tar.gz
          got=$(./kontra version)
          if [ "$got" != "$VERSION" ]; then
            echo "::error::the released binary calls itself '$got', not '$VERSION'."
            echo "::error::the -X in cli/release.go:167-170 did not reach cli/internal/buildinfo.version — a wrong symbol path is silently ignored by the linker."
            exit 1
          fi
          echo "kontra version == $got"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ strategy.job-index }}
          path: ${{ runner.temp }}/release/kontra_*.tar.gz
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # images — the four kontra-owned images, one arch per runner, NATIVELY.
  #
  # NO QEMU, AND THAT IS THE WHOLE REASON THIS IS A MATRIX. `release.yml:212` sets up
  # `docker/setup-qemu-action` and cross-builds arm64 on an amd64 runner, which is fine for
  # `Dockerfile.appliance`: it unpacks a tarball and apt-installs. It is not fine for the other
  # three. `Dockerfile.orchestrator` runs `pnpm install --frozen-lockfile`, three `pulumi plugin
  # install`s and two `pnpm run build`s; `Dockerfile.workerbase` compiles the Go handler. Emulated,
  # those are the difference between minutes and an hour of an emulated CPU. `ubuntu-24.04-arm` runs
  # them at native speed, and `appliance.yml`/`release.yml` already depend on that label existing.
  #
  # PER-ARCH TAGS ONLY HERE. `<version>-amd64` and `<version>-arm64` are pushed by this job; the
  # manifest list over them is `manifests` below, because neither runner can write it alone.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  images:
    name: images ${{ matrix.arch }}
    needs: [plan, binaries]
    # A macOS RESULT MUST NOT DECIDE WHETHER CONTAINER IMAGES GET BUILT, and twice it did.
    #
    # `needs: [plan, binaries]` with the default `if` means every leg of that matrix must SUCCEED, so
    # a macOS runner that was never allocated (`macos-13`, retired) and then one that was cancelled by
    # too short a cap both skipped this job — and with it `manifests`, `pin` and `pull`. Two dispatches
    # published eight mirrored third-party images and zero kontra-owned ones, for a reason that had
    # nothing to do with any of them.
    #
    # These builds consume `kontra_<version>_linux_<arch>.tar.gz` and nothing else: `Dockerfile.
    # appliance` takes the linux tarball as a `--build-arg` and the other three take no tarball at
    # all. A darwin artifact is not an input here, so a darwin failure is not a reason to stop.
    #
    # `needs` IS KEPT, so this still WAITS for the matrix and the linux artifacts exist before the
    # download. What changes is only that a non-success is no longer fatal. `plan` is still required
    # explicitly — it computes the version, the registry and the image names, and without it there is
    # nothing to build. If the LINUX legs are what failed, the `ls` in the build step below fails
    # loudly on a missing tarball, which is the honest place for that error.
    #
    # NOT `always()`: that would run this after somebody cancels the run. `!cancelled()` keeps a
    # cancel meaning cancel.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # `build/release/` AND NOT ANYWHERE ELSE. `.dockerignore:20` ignores `build/`, and
      # `.dockerignore:29-30` re-admits exactly `!build/release/*.tar.gz` — the comment above it
      # records the day those two rules met and `COPY` answered "file not found in build context".
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: build/release

      - uses: docker/setup-buildx-action@v3

      # NO PAT AND NO REPOSITORY SECRET. A workflow pushing to GHCR under the same owner as the
      # repository authenticates with the token GitHub already gave the job; `packages: write` above
      # is the entire grant. `github.actor` is the user or bot that pushed the tag, which is who the
      # push is attributed to.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # ── THE ONE HAND-WRITTEN TABLE IN THIS FILE, AND ITS DRIFT GUARD ─────────────────────────
      #
      # `plan` derived WHICH images the install references. Only a Dockerfile knows HOW to build one,
      # and that mapping cannot be derived from anything — so it is written here, once, and a name
      # `plan` derived that this case statement does not recognise EXITS NON-ZERO. The alternative is
      # a loop that skips what it does not know, publishes three images, and reports success.
      #
      # ORDER IS LOAD-BEARING: `kontra` FIRST. `Dockerfile.orchestrator:2-3` is
      # `ARG SPA_IMAGE=kontra:latest` / `FROM ${SPA_IMAGE} AS spa-src` — the orchestrator image takes
      # the console bytes, the CLI binary, the duckdb CLI and the pinned Python packages out of the
      # appliance image rather than installing a second copy of any of them (Dockerfile.orchestrator:
      # 54-84 argues that at length: a second `pip install` would be unpinned in two images and the
      # drift is a worker dialling a queue nobody else agrees on). So the README's build order is
      # mandatory, and it is mandatory here.
      #
      # `--build-arg TARBALL=` IS PER-ARCH. Handing `Dockerfile.appliance` a tarball for the other
      # architecture produces an image that pulls fine and `exec format error`s on first run. The
      # Dockerfile takes the path as an arg (Dockerfile.appliance:51-55) precisely so this cannot be
      # a fixed name that quietly keeps shipping last month's binary.
      - name: build and push, this architecture
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.plan.outputs.version }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
          NAMES: ${{ needs.plan.outputs.kontra_images }}
        run: |
          set -euo pipefail

          tarball=$(ls build/release/kontra_"$VERSION"_linux_"$ARCH".tar.gz)
          echo "==> $ARCH from $tarball"

          spa_image="$REGISTRY/kontra:$VERSION-$ARCH"

          build_one() {
            name="$1"; shift
            ref="$REGISTRY/$name:$VERSION-$ARCH"
            echo "==> $ref"
            docker buildx build --platform "linux/$ARCH" -t "$ref" --push "$@" .
          }

          # kontra first; see above.
          build_one kontra \
            -f control/images/Dockerfile.appliance \
            --build-arg TARBALL="$tarball"

          for name in $NAMES; do
            case "$name" in
              kontra)
                continue  # done above, and it has to be
                ;;
              kontra-orchestrator)
                build_one "$name" \
                  -f control/images/Dockerfile.orchestrator \
                  --build-arg SPA_IMAGE="$spa_image"
                ;;
              kontra-host)
                build_one "$name" -f control/images/Dockerfile.pyworker
                ;;
              kontra-worker-base)
                build_one "$name" -f control/images/Dockerfile.workerbase
                ;;
              # The shipper and its parser, baked rather than bind-mounted. It appears in this table
              # because compose stopped naming `python:3.12-alpine` and started naming
              # `${KONTRA_LOGSHIP_IMAGE:-…}`, which also moves it off the `mirror` list above — the
              # derivation in `plan` sorts that out on its own, and this is the hand-written half it
              # cannot derive. See control/images/Dockerfile.logship for why logline.py could not
              # take the `configs:` treatment postgres-init.sh got.
              kontra-logship)
                build_one "$name" -f control/images/Dockerfile.logship
                ;;
              *)
                echo "::error::the install references a kontra-owned image '$name' that this workflow does not know how to build."
                echo "::error::add it to the case statement in .github/workflows/publish.yml, beside a Dockerfile under control/images/."
                echo "::error::it was derived from docker-compose.yml's \${KONTRA_*_IMAGE:-…} defaults or cli/deploy.go's workerBaseImage."
                exit 1
                ;;
            esac
          done

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # manifests — one multi-arch list per image, and a keyless signature over each list digest.
  #
  # `docker buildx imagetools create` is the right tool here and the wrong one in `mirror` below, for
  # one reason: its sources have to already be in the destination registry. Here they are — `images`
  # pushed both per-arch tags to this same repository — so the list is assembled by reference and no
  # layer moves.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  manifests:
    name: manifest lists and signatures
    needs: [plan, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # KEYLESS SIGSTORE, AND THIS LINE IS THE WHOLE OF THE CREDENTIAL. `id-token: write` lets the
      # job ask GitHub for a short-lived OIDC token; Fulcio exchanges it for a certificate that
      # expires in ten minutes. There is no key in this repository, none in CI, and nothing to
      # rotate — which is issue 10's last criterion, met structurally rather than by policy.
      id-token: write
    steps:
      # `imagetools` reads and writes the registry rather than building anything, so it needs no
      # `docker-container` builder — but it is a buildx subcommand and buildx wants A builder to
      # exist. Setting one up is four seconds against a failure mode that reads as an imagetools bug.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # THE INSTALLER VERIFIES WHAT IT DOWNLOADS, which is the property `install.sh:175-181`'s buf
      # step does not have and this repository has written down twice as a mistake not to copy
      # (release.yml:13-15, cli/release.go:22-26): `/releases/latest/download/` with no version and
      # no checksum. `cosign-release` is deliberately not pinned here — the action's default for a
      # given major IS pinned, and a cosign version invented in this file without being run would
      # fail on the first tag, which is worse than tracking the installer's own default.
      - uses: sigstore/cosign-installer@v3
      - run: cosign version

      - name: create the lists and record their digests
        id: digests
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
          NAMES: ${{ needs.plan.outputs.kontra_images }}
        run: |
          set -euo pipefail
          : > digests-kontra.tsv
          for name in $NAMES; do
            repo="$REGISTRY/$name"
            docker buildx imagetools create -t "$repo:$VERSION" \
              "$repo:$VERSION-amd64" "$repo:$VERSION-arm64"

            # THE DIGEST OF THE LIST, NOT OF A PLATFORM UNDER IT. `.Manifest.Digest` is the
            # descriptor buildx just pushed. A digest-shaped assertion follows because an empty
            # `--format` result is not an error: it would produce the reference `repo@`, which fails
            # much later and much less clearly.
            digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$repo:$VERSION")
            case "$digest" in
              sha256:*) ;;
              *)
                echo "::error::imagetools reported '$digest' as the manifest digest of $repo:$VERSION"
                exit 1
                ;;
            esac
            printf '%s\t%s@%s\n' "$name" "$repo" "$digest" >> digests-kontra.tsv
          done
          cat digests-kontra.tsv

      # ── SIGNED AT THE DIGEST, WHICH IS THE ONLY THING WORTH SIGNING ─────────────────────────
      #
      # `cosign sign repo:tag` resolves the tag and signs the digest it found, which means the
      # signature is over bytes chosen by whatever the tag pointed at a moment ago. The Warden pulls
      # a PINNED reference (ADR 0039, cli/internal/trustpolicy) so the digest is what it will ask
      # about, and it is what is handed to cosign here.
      #
      # THE IDENTITY IS DERIVED FROM `GITHUB_WORKFLOW_REF`, NOT TYPED. The SAN in a GitHub Actions
      # Fulcio certificate is `https://github.com/<owner>/<repo>/.github/workflows/<file>@<ref>`,
      # which is exactly `https://github.com/$GITHUB_WORKFLOW_REF`. Deriving it means renaming this
      # file cannot leave a verification pinned to a workflow that no longer exists — and a
      # `--certificate-identity` that has drifted is not an error, it is a verify that accepts
      # whatever the OIDC provider vouched for (trustpolicy.go:63, :424 make the same point).
      #
      # AND IT CARRIES THE REF, WHICH IS A FACT ABOUT THE WARDEN'S SIDE AND NOT ABOUT THIS FILE.
      # `@refs/tags/v0.1.0` is in the identity, so a Machine configured with an exact
      # `KONTRA_TRUST_IDENTITY` (trustpolicy.go:524) pins ONE release. The stable form is
      # `--certificate-identity-regexp`, which `newCosignVerifier` does not offer today. The exact
      # string is printed to the job summary so an operator has the value to paste rather than a
      # shape to reconstruct.
      - name: sign each list, keyless
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          issuer="https://token.actions.githubusercontent.com"
          # THE TSV IS READ ON FD 3, NOT ON STDIN. A `while read` loop over stdin shares that stdin
          # with everything it calls, so one command inside that reads a line drains the rest of the
          # file — the loop then signs the first image, exits 0, and reports four of four done.
          # `cosign --yes` does not read stdin today; this loop does not depend on that staying true.
          while IFS=$'\t' read -r name ref <&3; do
            echo "==> signing $name"
            cosign sign --yes "$ref"
          done 3< digests-kontra.tsv

          # ── AND VERIFIED, IN THIS RUN, AGAINST THE IDENTITY IT WAS SIGNED WITH ───────────────
          #
          # ADR 0039's consequences say the keyless path — "certificate chain, Rekor, SAN matching"
          # — is "unproven end to end" because cosign is not on the development machine. This loop is
          # the thing that proves it, and it proves it where it can be seen failing. A signature
          # nobody has verified is a file, and `trustpolicy_test.go`'s first assertion exists because
          # a verification that cannot run and passes anyway is `watchdog.sh`.
          verified=0
          while IFS=$'\t' read -r name ref <&3; do
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$ref" > /dev/null
            verified=$((verified + 1))
            echo "verified $name"
          done 3< digests-kontra.tsv
          # A LOOP OVER AN EMPTY FILE REPORTS SUCCESS BY HAVING HAD NO WORK TO DO — the shape
          # install-appliance.sh:185-188 guards against. The count is the guard.
          expected=$(grep -c . digests-kontra.tsv)
          if [ "$verified" -ne "$expected" ] || [ "$verified" -lt 4 ]; then
            echo "::error::verified $verified of $expected signatures (expected at least 4)"
            exit 1
          fi

          {
            echo "### signing identity"
            echo
            echo "A Machine's trust policy needs both (cli/internal/trustpolicy):"
            echo
            echo '```'
            echo "KONTRA_TRUST_IDENTITY=$identity"
            echo "KONTRA_TRUST_ISSUER=$issuer"
            echo '```'
            echo
            echo "The identity carries this tag's ref, so it changes every release."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-kontra
          path: digests-kontra.tsv
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # mirror — the eight third-party images, copied whole, recorded by digest.
  #
  # WHY NOT `docker pull` + `docker tag` + `docker push`. That is the obvious three lines and it is
  # wrong in a way nobody notices until an arm64 install: `docker pull postgres:16-alpine` on an
  # amd64 runner resolves the manifest LIST to one platform, and pushing it publishes a
  # single-architecture image under a name every arch will resolve. The failure is
  # `exec format error` on somebody else's laptop.
  #
  # WHY NOT `docker buildx imagetools create`. Its sources must already exist in the registry the new
  # manifest is created in. These are on Docker Hub and the target is ghcr.io.
  #
  # SO: `skopeo copy --all`, which copies every manifest in the list. It is apt-installable on the
  # runner image, and if it is not there the job REFUSES rather than falling back on one of the two
  # wrong options above.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  mirror:
    name: mirror Docker Hub
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: skopeo, or nothing
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          skopeo --version

      # `--password-stdin` rather than a flag: an argument is visible in `ps` to everything else on
      # the runner, and this is the same token the whole job holds.
      - name: log in to ghcr
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | skopeo login --username "${{ github.actor }}" --password-stdin ghcr.io

      # THE TARGET PATH IS A MECHANICAL TRANSFORM OF THE SOURCE, not a table of renames. Strip the
      # implicit `docker.io/`, add the implicit `library/` that a single-segment name carries, and
      # prefix `mirror/`. One rule means "which upstream is this" is answerable from the mirrored
      # reference alone — and there is no second list of eight names to drift out of date.
      #
      # THE MIRRORED TAG IS THE UPSTREAM TAG, DELIBERATELY. It is not what anything resolves: the
      # digest recorded below is. Keeping the tag makes the mirror readable by a human comparing it
      # to `docker-compose.yml`, and it makes a re-run of this job idempotent instead of accumulating
      # a tag per release for bytes that never changed.
      - name: copy, all architectures, and record the digest
        shell: bash
        env:
          REGISTRY: ${{ needs.plan.outputs.registry }}
          MIRROR: ${{ needs.plan.outputs.mirror }}
        run: |
          set -euo pipefail
          : > digests-mirror.tsv
          for ref in $MIRROR; do
            name="${ref%:*}"
            tag="${ref##*:}"
            case "$name" in
              */*) path="$name" ;;
              *)   path="library/$name" ;;
            esac
            dst="$REGISTRY/mirror/$path:$tag"
            echo "==> docker.io/$path:$tag -> $dst"
            skopeo copy --all "docker://docker.io/$path:$tag" "docker://$dst"

            # THE DIGEST IS THE HASH OF THE MANIFEST BYTES, and it is computed rather than read out
            # of a field. `skopeo inspect` without `--raw` resolves a manifest list to ONE platform
            # and reports that platform's digest, which would pin the mirror to whatever
            # architecture this runner happens to be. `--raw | sha256sum` is the definition.
            digest=$(skopeo inspect --raw "docker://$dst" | sha256sum | awk '{print "sha256:"$1}')
            case "$digest" in
              sha256:????????????????????????????????????????????????????????????????) ;;
              *)
                echo "::error::computed '$digest' as the manifest digest of $dst"
                exit 1
                ;;
            esac
            printf '%s\t%s\n' "$ref" "$REGISTRY/mirror/$path@$digest" >> digests-mirror.tsv
          done
          cat digests-mirror.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: digests-mirror
          path: digests-mirror.tsv
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # pin — the two digest lists become the two files an install reads.
  #
  # `images.json` is for issue 03's Pulumi program, which needs the whole set including the mirror.
  # `images.env` is for `docker compose`, which needs nothing new to consume it: the variables are
  # the ones `docker-compose.yml` already interpolates, so an install is
  # `cat images.env >> .env` and no code changes hands.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  pin:
    name: images.json and images.env
    needs: [plan, manifests, mirror]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - name: assemble, and refuse anything that is not a digest
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
          COMPOSE_VARS: ${{ needs.plan.outputs.compose_vars }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys

          # A REFERENCE IS PINNED OR IT DOES NOT GO IN THIS FILE. The whole worth of both outputs is
          # that nothing in them can be repointed after the release exists; one tag slipping through
          # would make that false while every other line still looked right.
          PINNED = re.compile(r"^[a-z0-9.\-]+(?::\d+)?/[a-z0-9._\-/]+@sha256:[0-9a-f]{64}$")

          def read(path):
              out = {}
              with open(path) as fh:
                  for line in fh:
                      line = line.rstrip("\n")
                      if not line:
                          continue
                      key, ref = line.split("\t", 1)
                      if not PINNED.match(ref):
                          sys.exit(f"::error::{path}: '{ref}' is not a digest-pinned reference")
                      if key in out:
                          sys.exit(f"::error::{path}: '{key}' appears twice")
                      out[key] = ref
              if not out:
                  sys.exit(f"::error::{path} is empty — a job reported success and published nothing")
              return out

          kontra = read("digests/digests-kontra.tsv")
          mirror = read("digests/digests-mirror.tsv")

          version, tag = os.environ["VERSION"], os.environ["TAG"]
          doc = {
              "version": version,
              "tag": tag,
              "commit": os.environ["GITHUB_SHA"],
              "registry": os.environ["REGISTRY"],
              "workflow": os.environ["GITHUB_WORKFLOW_REF"],
              "kontra": kontra,
              "mirror": mirror,
          }
          with open("images.json", "w") as fh:
              json.dump(doc, fh, indent=2, sort_keys=True)
              fh.write("\n")

          # `name=VAR` pairs, derived by `plan` from compose's own `${KONTRA_*_IMAGE:-…}` defaults.
          # An image with no variable is not an error here — `kontra-worker-base` has none, because
          # `cli/deploy.go:89` hard-codes it — but it IS a line in the file saying so, because an
          # install that silently builds one of four images is the failure this whole workflow is
          # about.
          var_for = dict(
              pair.split("=", 1) for pair in os.environ["COMPOSE_VARS"].split() if "=" in pair
          )
          lines = [
              f"# generated by {os.environ['GITHUB_WORKFLOW_REF']} for {tag or version}",
              "#",
              "# Append to the .env beside docker-compose.yml. Every reference is a digest: these",
              "# lines cannot be repointed, and `docker compose pull` will fetch exactly these bytes.",
              "#",
              "# KONTRA_PULL_POLICY is already `missing` in .env.quickstart and in compose's own",
              "# defaults — it moved there when the install stopped being a clone. It is restated",
              "# below anyway, because an operator appending this file to a .env they wrote before",
              "# that change still has `never` in it, and `never` with published images means compose",
              "# refuses to fetch what it does not already have.",
              "",
          ]
          for name in sorted(kontra):
              var = var_for.get(name)
              if var:
                  lines.append(f"{var}={kontra[name]}")
              else:
                  lines.append(
                      f"# {name} has no compose variable — cli/deploy.go:89 hard-codes"
                      f" the tag, so this digest is not consumable yet:"
                  )
                  lines.append(f"#   {kontra[name]}")
          lines += ["KONTRA_PULL_POLICY=missing", ""]

          # THE MIRROR IS LISTED AND COMMENTED OUT, WHICH IS THE HONEST SHAPE. docker-compose.yml
          # names its eight third-party images literally (`image: postgres:16-alpine`, line 168) with
          # no `${…}` to override, so there is nothing an .env can do with these digests today —
          # issue 03's Pulumi program is what consumes them. Writing them here as live variables
          # would be eight lines that look like they are doing something and are not, which is the
          # shape trustpolicy.go:561-568 refuses for the same reason.
          lines += [
              "# The mirrored third-party images. NOT variables: docker-compose.yml names these",
              "# literally, so pinning them needs the Pulumi program (issue 03) or an edit to compose.",
          ]
          for src in sorted(mirror):
              lines.append(f"#   {src:52s} {mirror[src]}")
          lines.append("")

          with open("images.env", "w") as fh:
              fh.write("\n".join(lines))

          print(json.dumps(doc, indent=2, sort_keys=True))
          print(open("images.env").read())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pins
          path: |
            images.json
            images.env
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # pull — the check that catches the one manual step, from a client that cannot authenticate.
  #
  # GHCR PACKAGES ARE PRIVATE ON FIRST PUSH and do not inherit repository visibility until they are
  # linked. Everything above succeeds; `kontra up` then fails for everyone who is not the owner.
  # Issue 16 is explicit that this must be caught rather than assumed away, so it gates the release:
  # on the first tag this job FAILS, a human makes each package public once, and re-running the
  # failed jobs produces the release. That is a worse first tag and a better every-tag-after.
  #
  # `--no-creds` RATHER THAN `docker logout`. A logout leaves a client that would use a credential if
  # it found one, on a runner that has one in the environment; `--no-creds` sends none, by
  # construction. The same move `cli/trustpolicy_test.go:28-32` describes: make the helper
  # structurally incapable of the thing you are asserting it does not do.
  #
  # AND IT RE-COMPUTES THE DIGEST rather than asking whether the manifest is readable. "The registry
  # answered" and "the registry answered with the bytes we published" are different facts, and only
  # the second one is worth gating a release on.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  pull:
    name: anonymous pull
    # `pin` and NOT `plan`: everything this job needs is inside `images.json`, which is the point —
    # the probe reads the published file, the way an installer will, rather than re-deriving the
    # references from the same inputs that produced them.
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pins
          path: .

      - name: skopeo, or nothing
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          skopeo --version

      - name: every published reference resolves with no credential
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          refs=$(python3 -c '
          import json
          d = json.load(open("images.json"))
          for group in ("kontra", "mirror"):
              for ref in d[group].values():
                  print(ref)
          ')
          [ -n "$refs" ] || { echo "::error::images.json listed no references"; exit 1; }

          private=""
          checked=0
          for ref in $refs; do
            want="${ref##*@}"
            if ! got=$(skopeo inspect --no-creds --raw "docker://$ref" 2>/dev/null | sha256sum | awk '{print "sha256:"$1}'); then
              echo "::warning::anonymous read of $ref FAILED"
              private="$private ${ref%@*}"
              continue
            fi
            if [ "$got" != "$want" ]; then
              echo "::error::$ref answered a manifest whose digest is $got"
              exit 1
            fi
            checked=$((checked + 1))
            echo "ok  $ref"
          done

          if [ -n "$private" ]; then
            echo "::error::these packages are not anonymously readable — GHCR packages are PRIVATE on first push:"
            for p in $private; do
              # `ghcr.io/<owner>/mirror/library/postgres` is ONE package named `mirror/library/postgres`,
              # and GitHub's settings URL percent-encodes the slashes in a package name. Printing the
              # raw name gives a 404 on the page that fixes the error, which is the least helpful
              # possible way to report a manual step.
              pkg=$(printf '%s' "${p#*/*/}" | sed 's|/|%2F|g')
              echo "::error::  $p  ->  https://github.com/users/$OWNER/packages/container/$pkg/settings"
            done
            echo "::error::Make each one public (Danger Zone -> Change visibility), then re-run the failed jobs."
            echo "::error::Nothing has been released: the release job is downstream of this one."
            exit 1
          fi

          # A LOOP OVER AN EMPTY LIST REPORTS SUCCESS BY HAVING HAD NO WORK TO DO — the shape
          # install-appliance.sh:133-137 and :185-188 both guard against.
          [ "$checked" -ge 5 ] || { echo "::error::checked only $checked references — images.json is too small to be a whole release"; exit 1; }
          echo "$checked references pull anonymously and match their recorded digests"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # release — SHA256SUMS, the keyless signatures, and the one thing that makes all of it downloadable.
  #
  # LAST, AND DOWNSTREAM OF `pull`. See the header: this ordering IS issue 16's "a release that
  # publishes a binary without its matching images fails".
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  release:
    name: the release
    needs: [plan, binaries, pin, pull]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: pins
          path: release

      # ONE SHA256SUMS ACROSS ALL FOUR, written here rather than by each runner, because four files
      # each containing one line is not a thing `sha256sum -c` can be pointed at — and the whole
      # point of publishing digests is that checking them is one command. `kontra release` writes one
      # per invocation covering the platforms IT built (cli/release.go:242-262); this is the union.
      - name: the digests
        working-directory: release
        run: |
          set -euo pipefail
          ls -la
          sha256sum kontra_*.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      # A PARTIAL RELEASE IS WORSE THAN A FAILED ONE: the platforms that are there install fine, and
      # the ones that are not fail at curl with a 404 and no explanation.
      #
      # THE LIST COMES OUT OF THIS FILE'S OWN MATRIX. Same argument as release.yml:155-161 — a
      # hard-coded four beside a matrix of four is exactly the drift that lets a platform be added in
      # one place and silently never released, and `Platforms()` in cli/appliance already has a test
      # holding the matrix to it, so deriving from the matrix inherits that check for free.
      - name: a release ships every platform the matrix builds
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          seen=0
          while read -r platform; do
            seen=$((seen + 1))
            slug=$(echo "$platform" | tr / _)
            ls release/kontra_*_"$slug".tar.gz >/dev/null 2>&1 || missing="$missing $platform"
          done < <(grep -oE '^\s+- platform: \S+' .github/workflows/publish.yml | awk '{print $3}')
          # THE GREP IS A CHECK THAT CAN PASS VACUOUSLY. Rename the matrix key and it matches
          # nothing, the loop runs zero times, `missing` stays empty and a one-platform release
          # passes. So the count is asserted against the four of
          # `cli/appliance/bundle/pins.go:146-153`.
          [ "$seen" -eq 4 ] || { echo "::error::read $seen platforms out of this workflow's matrix, expected 4"; exit 1; }
          if [ -n "$missing" ]; then
            echo "::error::the release is missing:$missing"
            exit 1
          fi
          echo "every platform in the matrix has a release file"

      - uses: sigstore/cosign-installer@v3
      - run: cosign version

      # ── A SIGNATURE PER TARBALL, AND ONE OVER THE SET ────────────────────────────────────────
      #
      # BOTH, AND THEY ARE NOT REDUNDANT. A per-tarball bundle lets `get.sh` verify the one file it
      # downloaded without fetching the other three — which is the whole shape of a one-line
      # installer. The signature over SHA256SUMS is what makes the SET attestable: a release with a
      # platform removed has a valid signature on every file that remains, and only the signed
      # manifest of four names notices.
      #
      # `--bundle` RATHER THAN `--output-signature`/`--output-certificate`. A bundle carries the
      # signature, the Fulcio certificate and the Rekor inclusion proof in one file, so verifying is
      # one argument and not three files a user has to fetch in the right combination.
      #
      # AND WHAT A SIGNATURE PROVES IS BOUNDED. ADR 0039 says it plainly and it is worth repeating
      # where the signing happens: it says these bytes were signed by this workload identity. A
      # signed backdoor verifies.
      - name: sign every artifact, keyless, then verify it
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          issuer="https://token.actions.githubusercontent.com"

          signed=0
          for f in kontra_*.tar.gz SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            signed=$((signed + 1))
          done
          [ "$signed" -eq 5 ] || { echo "::error::signed $signed artifacts, expected 4 tarballs + SHA256SUMS"; exit 1; }

          # VERIFIED HERE, IN THIS RUN. ADR 0039's consequences record that the keyless path is
          # "unproven end to end" on the development machine. It is proven on this runner or the
          # release does not happen.
          for f in kontra_*.tar.gz SHA256SUMS; do
            cosign verify-blob \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              --bundle "$f.sigstore.json" "$f"
          done

          # AND A NEGATIVE CONTROL, because "verify returned 0" and "verify checks anything" are
          # different facts, and a bundle checked against the wrong bytes is the cheapest way to tell
          # them apart. Same rule as cli/trustpolicy_test.go: every positive carries its refusal.
          echo tampered > tampered.bin
          if cosign verify-blob \
               --certificate-identity "$identity" \
               --certificate-oidc-issuer "$issuer" \
               --bundle SHA256SUMS.sigstore.json tampered.bin 2>/dev/null; then
            echo "::error::verify-blob accepted SHA256SUMS' signature over different bytes — it is checking nothing"
            exit 1
          fi
          rm -f tampered.bin
          echo "$signed artifacts signed and verified; a tampered payload was refused"

          {
            echo "### verifying a download"
            echo
            echo '```sh'
            echo "cosign verify-blob \\"
            echo "  --certificate-identity '$identity' \\"
            echo "  --certificate-oidc-issuer '$issuer' \\"
            echo "  --bundle kontra_${VERSION}_linux_amd64.tar.gz.sigstore.json \\"
            echo "  kontra_${VERSION}_linux_amd64.tar.gz"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ needs.plan.outputs.version }}

      # ── CREATE OR UPLOAD, BECAUSE `release.yml` MAY HAVE GOT HERE FIRST ─────────────────────
      #
      # See the header. Both workflows trigger on `v*` and `release.yml` cannot be edited without
      # breaking `cli/version_test.go:112`. `gh release create` alone would abort with "release
      # already exists" and drop the signatures on the floor — the one artifact the other workflow
      # does not produce. `--clobber` overwrites an asset of the same name, which is correct: the
      # tarballs are the same build of the same tag either way.
      #
      # `--verify-tag` on the create path. Without it, `gh` will happily create a release against a
      # tag that does not exist, which on a `workflow_dispatch` run would invent a `v0.0.0-test1` tag
      # in the repository as a side effect of a test.
      #
      # DISPATCH RUNS SKIP THIS STEP ENTIRELY. There is no tag, so there is nothing to attach a
      # release to; everything above it — the build, the images, the mirror, the signatures, the
      # anonymous pull — has already run.
      - name: publish
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          assets=(kontra_*.tar.gz kontra_*.tar.gz.sigstore.json SHA256SUMS SHA256SUMS.sigstore.json images.json images.env)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists (release.yml is still live — issue 08); uploading into it"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --verify-tag --generate-notes "${assets[@]}"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
