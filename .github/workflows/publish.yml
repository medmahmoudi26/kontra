name: publish

# WHAT A TAG SHIPS (ADR 0052 §3, issues 10 and 16).
#
# This workflow publishes the control plane's own container images at `ghcr.io/<owner>`, on the ONE
# tag ADR 0038 already defines. The install is supposed to be seconds; the alternative is `make
# image` plus three hand-typed `docker build`s first, which is the difference between seconds and
# minutes and the whole reason this file exists.
#
# ── IMAGES, AND ONE JOB THAT IS NOT ─────────────────────────────────────────────────────────────
#
# Every job but `binaries` publishes container images and attaches nothing to the GitHub release.
# release-please creates the tag and the release; `binaries` runs GoReleaser (`.goreleaser.yaml`),
# which appends the `kontra` CLI archives, `SHA256SUMS` and the keyless signature over it to that
# release. That closes the gap ADR 0063 named — a tagged release with no downloadable binary. There
# is no `kontra-warden` to publish beside it, as this paragraph once said: the Warden is a subcommand
# of the same binary.
#
# ── EVERY REFERENCE THIS WORKFLOW PUBLISHES IS A DIGEST ─────────────────────────────────────────
#
# `images.json` and `images.env` on the release name every image as `repo@sha256:…`, never as a tag.
# THE THIRD-PARTY HALF IS NOT MIRRORED, AND THAT IS A REVERSAL. `control/orchestrator/src/infra/
# CONTEXT.md:228` makes a real argument for mirroring — "a reference with no host is Docker Hub, whose
# hundred manifest reads an hour are per *address*, not per account" — and eight anonymous pulls per
# install, behind corporate NAT or on a shared runner, do spend a budget shared with strangers.
#
# A `mirror` job acted on it and published eight `mirror/…` packages that NOTHING RESOLVED, because
# `docker-compose.yml` names the eight literally with no `${…}` to override. Zero consumers, measured
# after `0.0.0-test9`. It is gone; `plan` carries the full reasoning and what would have to land first
# for it to come back. Windmill pulls `postgres:18` from Docker Hub at far higher install volume.
#
# `latest` is pushed by nothing here. A floating tag in a registry is a thing an install can resolve
# by accident, and what this install resolves is a digest.
#
# ONE WORKFLOW PER TAG. Nothing else triggers on `v*`, so nothing races this file for the image tag
# and no tag pays for the native builds twice. `:latest` is pushed by nothing: a floating tag is a
# thing an install can resolve by accident, and what this install resolves is a digest.

on:
  push:
    tags: ["v*"]
  # THE ESCAPE HATCH, AND WHY IT IS A VERSION INPUT RATHER THAN A DRY-RUN FLAG.
  #
  # `git tag` in this repository returns zero tags (release-please.yml:5-8). Every path below — the
  # keyless certificate chain, the GHCR push, the anonymous pull — is unexercised until a tag
  # exists, and a first tag is a bad place to find that out.
  #
  # A dispatch really does push to ghcr.io — a dry run that pushed nothing would prove nothing about
  # the half of this file that is a registry. What it cannot do is create a GitHub release, because
  # there is no tag to hang one on. So name the version `0.0.0-test1` and a test cannot be mistaken
  # for a release: it collides with no tag, and the release step skips itself.
  workflow_dispatch:
    inputs:
      version:
        description: "version to build and publish, no leading v (use 0.0.0-testN — this DOES push to ghcr.io)"
        required: true

# NEVER CANCEL A PUBLISH IN FLIGHT. `cancel-in-progress: true`, which is correct for a workflow
# that only computes digests, would here stop a run between the
# `kontra-orchestrator` push and the `kontra-host` push and leave the registry holding a version that
# is three-quarters shipped. Two tags in flight queue instead.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # plan — the version, the registry, and the names, computed ONCE and before anything expensive.
  #
  # IT IS A JOB RATHER THAN A STEP BECAUSE THE DRIFT CHECK BELONGS IN FRONT OF THE COST. The image
  # names are derived from the install rather than typed here, and a name this workflow does not know
  # how to build has to fail in twenty seconds, not after four native binary builds and two arm64
  # container builds have already been paid for.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  plan:
    name: version and names
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      registry: ${{ steps.v.outputs.registry }}
      kontra_images: ${{ steps.names.outputs.kontra_images }}
      compose_vars: ${{ steps.names.outputs.compose_vars }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # ONE NUMBER, AND IT IS THE TAG WITH ITS `v` OFF.
      #
      # PASSED EXPLICITLY RATHER THAN DERIVED. A `git describe` derivation needs `fetch-depth: 0`
      # to be right, and when it is wrong it is not an error — it is an artifact named
      # `kontra_ad8871a-dirty_…`, which is a name nobody can report a bug against.
      #
      # The git tag keeps its `v` and every other spelling is bare. Both are outputs here so that
      # nothing downstream strips a prefix a second time.
      - name: the version
        id: v
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            tag=""
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          case "$version" in
            ""|*[!0-9A-Za-z.+-]*)
              echo "::error::refusing to publish version '$version' — it is empty or has a character no image tag accepts"
              exit 1
              ;;
          esac
          # GHCR repository paths are lowercase-only; the owner is not.
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "registry=$registry"
          } >> "$GITHUB_OUTPUT"
          echo "publishing $version to $registry (tag: '${tag:-none, dispatch}')"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      # ── THE NAMES COME FROM THE INSTALL, NOT FROM THIS FILE ──────────────────────────────────
      #
      # They are `docker-compose.yml`'s own `${KONTRA_*_IMAGE:-<default>}` defaults — the thing an
      # install actually resolves. Deriving them means a new kontra-owned service appearing in
      # compose is published on the next tag instead of being the one image the install still has to
      # build by hand.
      #
      # THE HAND-WRITTEN HALF IS THE name→Dockerfile TABLE IN `images` BELOW, and it is the only
      # hand-written half. A derived name that table does not know is a hard failure there, named as
      # such, rather than a loop that quietly iterates over three of four.
      - name: the image names, derived
        id: names
        run: |
          set -euo pipefail

          # `${KONTRA_IMAGE:-ghcr.io/medmahmoudi26/kontra:dev}` → `kontra=KONTRA_IMAGE`.
          #
          # COMPOSE DECIDES THE NAME. THIS WORKFLOW DECIDES THE REGISTRY AND THE TAG. The `:-` default
          # carries all three, and only the middle one is read here — which is why retagging or
          # re-homing an image is not a change to this job, and renaming one is.
          #
          # THE SECOND `sed` IS LOAD-BEARING and was added when compose's defaults stopped being bare
          # local tags. The quickstart is `curl docker-compose.yml && docker compose up -d` with no
          # `.env`, so every default in that file has to be a reference a stranger's Docker can
          # actually resolve — `ghcr.io/<owner>/<name>:dev`, not `kontra-orchestrator:latest`. But
          # `[^:}]+` above has no `:` to stop at inside `ghcr.io/owner/name`, so it captures the whole
          # path and `$2` became `ghcr.io/medmahmoudi26/kontra-orchestrator`. The `case` in the
          # `images` job matches bare names, so all five would have fallen through to its `*)` arm and
          # failed the build with "an image this workflow does not know how to build" — naming a
          # registry path, which is the least actionable form of that error.
          #
          # It strips an optional leading path, so a bare name still passes through unchanged and a
          # checkout that has not moved to qualified defaults derives exactly what it did before.
          #
          # NEWLINE-SEPARATED UNTIL THE OUTPUT, then joined with spaces once. A job output cannot hold
          # a newline, and getting the entries back apart by leaving `$var` unquoted for the shell to
          # split is the thing that works until one of these names contains a glob character.
          compose_pairs=$(grep -hoE '\$\{KONTRA_[A-Z_]*IMAGE:-[^}]+\}' docker-compose.yml \
            | sed -E 's/^\$\{(KONTRA_[A-Z_]*IMAGE):-([^:}]+)(:[^}]*)?\}$/\2=\1/' \
            | sed -E 's#^([^=]*/)?([^/=]+)=#\2=#' \
            | sort -u)

          # COMPOSE IS THE WHOLE DERIVATION. Every image this install references is named in the
          # compose file, so there is one source for the list and no second place to keep in step.
          names=$(printf '%s\n' "$compose_pairs" | sed -E 's/=.*//' | grep . | sort -u)

          # SHAPE GUARD, WHICH CATCHES THIS WHATEVER THE SOURCE. The anchor above fixes the one
          # derivation that went wrong; this refuses anything that is not a legal image name from
          # EITHER derivation, so the next stray match fails here with the offending string rather
          # than four jobs later in a `case` statement. An OCI repository name component is lowercase
          # alphanumerics with `.`, `_` and `-` separators — an ellipsis is none of those.
          bad=$(printf '%s\n' "$names" | grep -vE '^[a-z0-9]+([._-][a-z0-9]+)*$' || true)
          if [ -n "$bad" ]; then
            echo "::error::derived something that is not an image name: $(printf '%s' "$bad" | tr '\n' ' ')"
            echo "::error::one of the two greps above matched text it should not have — a comment, or prose quoting the pattern."
            echo "::error::all derived names were: $(printf '%s' "$names" | tr '\n' ' ')"
            exit 1
          fi

          # VACUITY GUARD. Every derivation above is a grep, and a grep that stops matching returns
          # zero lines and exit 1 under `pipefail` only if it is the last command in the pipe — it is
          # not. So the count is asserted. It is a FLOOR and not an equality, which is why it could not
          # catch the ellipsis: six names passed a `-lt 4` check as happily as five.
          count=$(printf '%s\n' "$names" | grep -c . || true)
          if [ "$count" -lt 4 ]; then
            echo "::error::derived only $count kontra-owned image names ($names) — expected at least 4."
            echo "::error::docker-compose.yml's \${KONTRA_*_IMAGE:-…} defaults moved."
            exit 1
          fi

          # ── THERE IS NO MIRROR LIST ANY MORE, AND THAT IS THE POINT ───────────────────────────
          #
          # This job used to derive every third-party `image:` out of compose so a `mirror` job could
          # copy them to `ghcr.io/<owner>/mirror/…`, against Docker Hub's anonymous rate limit: "a
          # reference with no host is Docker Hub, whose hundred manifest reads an hour are per *address*,
          # not per account", so eight pulls per install spend a budget shared with strangers.
          #
          # THE REASONING WAS FINE AND THE WIRING NEVER HAPPENED. `docker-compose.yml` names
          # `postgres:16-alpine` and the other seven literally, with no `${…}` to override, so nothing
          # could ever resolve a mirrored copy. The job's own comment admitted it — "there is nothing an
          # .env can do with these digests today" — and the `0.0.0-test9` publish duly created eight
          # packages with zero consumers. Publishing what nothing resolves is the same shape as the five
          # blank variables `.env.quickstart` deleted: a knob that looks like a knob and is not.
          #
          # Windmill pulls `postgres:18` from Docker Hub at far higher install volume. So the mirror
          # returns only on evidence of a real rate limit, and when it does the missing half comes
          # FIRST: a `${…}` per third-party service in compose, so the copies are reachable before they
          # exist.
          {
            echo "kontra_images=$(printf '%s' "$names" | tr '\n' ' ')"
            echo "compose_vars=$(printf '%s' "$compose_pairs" | tr '\n' ' ')"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### what this tag publishes"
            echo
            echo "| kontra-owned ($count) |"
            echo "| --- |"
            for n in $names; do echo "| \`$n\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # images — the four kontra-owned images, one arch per runner, NATIVELY.
  #
  # NO QEMU, AND THAT IS THE WHOLE REASON THIS IS A MATRIX. Cross-building arm64 on an amd64 runner
  # under `docker/setup-qemu-action` is the difference between minutes and an hour of an emulated
  # CPU for every image here: `Dockerfile.selfcontained` runs both pnpm installs, the SPA build and
  # the Go build; `Dockerfile.orchestrator` runs `pnpm install --frozen-lockfile`, three `pulumi
  # plugin install`s and two `pnpm run build`s. `ubuntu-24.04-arm` runs them at native speed.
  #
  # PER-ARCH TAGS ONLY HERE. `<version>-amd64` and `<version>-arm64` are pushed by this job; the
  # manifest list over them is `manifests` below, because neither runner can write it alone.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  images:
    name: images ${{ matrix.arch }}
    needs: [plan]
    # A macOS RESULT MUST NOT DECIDE WHETHER CONTAINER IMAGES GET BUILT, and twice it did.
    #
    # Depending on a four-platform host-build matrix with the default `if` meant every leg had to
    # SUCCEED: a macOS runner that was never allocated (`macos-13`, retired) and then one that was
    # cancelled by too short a cap each skipped this job — and with it `manifests`, `pin` and `pull`.
    # Two dispatches published zero kontra-owned images for a reason that had nothing to do with any
    # of them. Nothing here consumes a host artifact now, so there is no such edge left to sever.
    #
    # `plan` is still required
    # explicitly — it computes the version, the registry and the image names, and without it there is
    # nothing to build. If the LINUX legs are what failed, the `ls` in the build step below fails
    # loudly on a missing tarball, which is the honest place for that error.
    #
    # NOT `always()`: that would run this after somebody cancels the run. `!cancelled()` keeps a
    # cancel meaning cancel.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # THE CONSOLE, AS A SIBLING, BECAUSE THE BUILD CONTEXT IS THE PARENT DIRECTORY.
      # `Dockerfile.selfcontained` resolves `@kontra/core` as `link:../kontra/shared/core` — a
      # filesystem path, not a published package — so both checkouts must be visible to ONE build
      # and both directory names are load-bearing. Two `path:` checkouts and not a symlink: docker
      # does not follow a context symlink that leaves the context.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _sibling/kontra
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: medmahmoudi26/kontra-console
          path: _sibling/kontra-console
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # NO PAT AND NO REPOSITORY SECRET. A workflow pushing to GHCR under the same owner as the
      # repository authenticates with the token GitHub already gave the job; `packages: write` above
      # is the entire grant. `github.actor` is the user or bot that pushed the tag, which is who the
      # push is attributed to.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # ── THE ONE HAND-WRITTEN TABLE IN THIS FILE, AND ITS DRIFT GUARD ─────────────────────────
      #
      # `plan` derived WHICH images the install references. Only a Dockerfile knows HOW to build one,
      # and that mapping cannot be derived from anything — so it is written here, once, and a name
      # `plan` derived that this case statement does not recognise EXITS NON-ZERO. The alternative is
      # a loop that skips what it does not know, publishes three images, and reports success.
      #
      # ORDER IS LOAD-BEARING: `kontra` FIRST. `Dockerfile.orchestrator:2-3` is
      # `ARG SPA_IMAGE=kontra:latest` / `FROM ${SPA_IMAGE} AS spa-src` — the orchestrator image takes
      # the console bytes, the CLI binary, the duckdb CLI and the pinned Python packages out of the
      # `kontra` image rather than installing a second copy of any of them (Dockerfile.orchestrator:
      # 54-84 argues that at length: a second `pip install` would be unpinned in two images and the
      # drift is a worker dialling a queue nobody else agrees on). So the README's build order is
      # mandatory, and it is mandatory here.
      #
      # `kontra` IS BUILT FROM SOURCE, IN DOCKER (`Dockerfile.selfcontained`) — the same path
      # `make image` takes, so the image and a local build are the same recipe. Nothing here unpacks
      # a prebuilt tarball, which is what removes the hazard an arch-wrong one carried: it pulled
      # fine and `exec format error`ed on first run.
      - name: build and push, this architecture
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.plan.outputs.version }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
          NAMES: ${{ needs.plan.outputs.kontra_images }}
        run: |
          set -euo pipefail

          spa_image="$REGISTRY/kontra:$VERSION-$ARCH"

          # ── `denied: permission_denied: read_package`, AND THE TWO ANSWERS THAT WERE WRONG ─────────
          #
          # `0.0.0-test3` through `-test5` all failed here with
          #
          #     ERROR: failed to push ghcr.io/medmahmoudi26/kontra:<version>-amd64:
          #            denied: permission_denied: read_package
          #
          # Two plausible causes were tried and each was DISPROVED by the next run, which is why they
          # are written down rather than quietly deleted:
          #
          #   1. buildx's default attestations. The export is an OCI INDEX over an image manifest plus
          #      an `attestation manifest`, and pushing an index makes the registry resolve its
          #      children. `--provenance=false --sbom=false` changed nothing — `-test4` failed
          #      identically.
          #   2. the repository's token ceiling. `actions/permissions/workflow` really did report
          #      `default_workflow_permissions: "read"`, and a `permissions:` block can only narrow a
          #      ceiling, never raise it. Raising it to `write` changed nothing — `-test5` failed
          #      identically.
          #
          # THE CAUSE IS THAT ONE PACKAGE ALREADY EXISTED. Probed against the registry with a real
          # credential, where `NAME_UNKNOWN` and `DENIED` finally separate:
          #
          #     medmahmoudi26/kontra                DENIED        <- exists, not accessible to this repo
          #     medmahmoudi26/kontra-orchestrator   NAME_UNKNOWN
          #     medmahmoudi26/kontra-host           NAME_UNKNOWN
          #     medmahmoudi26/kontra-logship        NAME_UNKNOWN
          #
          # A GHCR package created outside Actions carries its own ACL and is linked to no repository,
          # so a repo-scoped `GITHUB_TOKEN` cannot read it however wide the ceiling is. The fix is in
          # the package's own settings — "Manage Actions access", add this repository with the Write
          # role — and it cannot be done from a workflow or from the REST API for a user-namespace
          # package. It is a one-time human step, like the visibility flip the `pull` job below
          # already documents.
          #
          # WHY IT TOOK THE OTHER FOUR DOWN WITH IT: `kontra` is built FIRST and outside the loop
          # (see the ORDER note above — the orchestrator image takes its SPA from it), so four images
          # that would have been created without trouble were never attempted.
          #
          # ANONYMOUS PULL, INCIDENTALLY, IS NOT A PROBLEM ON THIS ACCOUNT. The eight mirrored images
          # answered an unauthenticated `tags/list` with HTTP 200 the moment they were pushed, so new
          # packages here are created PUBLIC rather than private.
          #
          # THE FLAGS STAY, ON THEIR OWN MERITS, having been cleared of fixing anything. The header
          # says "PER-ARCH TAGS ONLY HERE … the manifest list over them is `manifests` below". An
          # attestation index at `<version>-<arch>` is a manifest list where the design calls for a
          # single-platform image, which would leave `manifests` building a list whose members are
          # themselves lists. Nothing is lost that anything here reads: `manifests` signs every list
          # keyless with cosign and `pin` records digests into `images.json`/`images.env`.
          # THE CONTEXT IS AN ARGUMENT because `kontra` needs the parent directory (the console is a
          # sibling) and every other image needs this checkout. A single `.` was correct only while
          # `kontra` came out of a tarball.
          build_one() {
            name="$1"; ctx="$2"; shift 2
            ref="$REGISTRY/$name:$VERSION-$ARCH"
            echo "==> $ref"
            docker buildx build --platform "linux/$ARCH" \
              --provenance=false --sbom=false \
              -t "$ref" --push "$@" "$ctx"
          }

          # kontra first; see above.
          build_one kontra _sibling \
            -f _sibling/kontra/control/images/Dockerfile.selfcontained \
            --build-arg VERSION="$VERSION"

          for name in $NAMES; do
            case "$name" in
              kontra)
                continue  # done above, and it has to be
                ;;
              kontra-orchestrator)
                build_one "$name" . \
                  -f control/images/Dockerfile.orchestrator \
                  --build-arg SPA_IMAGE="$spa_image"
                ;;
              # The shipper and its parser, baked rather than bind-mounted. It appears in this table
              # because compose stopped naming `python:3.12-alpine` and started naming
              # `${KONTRA_LOGSHIP_IMAGE:-…}`, so `plan` derives it as one of ours; this is the
              # hand-written half that derivation cannot supply. See control/images/Dockerfile.logship for why logline.py could not
              # take the `configs:` treatment postgres-init.sh got.
              kontra-logship)
                build_one "$name" . -f control/images/Dockerfile.logship
                ;;
              # Arrow Flight SQL over the DuckLake. It has been derived by `plan` since compose started
              # naming `${KONTRA_PORTER_IMAGE:-…}` and has never had an arm here, so the `*)` below was
              # already waiting to fail the next tag — a release break nobody had tripped because
              # nobody had tagged since. It is also why `control/pulumi/Pulumi.yaml` cannot declare
              # porter: an install may not depend on an image that is never published.
              kontra-porter)
                build_one "$name" . -f control/images/Dockerfile.porter
                ;;
              *)
                echo "::error::the install references a kontra-owned image '$name' that this workflow does not know how to build."
                echo "::error::add it to the case statement in .github/workflows/publish.yml, beside a Dockerfile under control/images/."
                echo "::error::it was derived from docker-compose.yml's \${KONTRA_*_IMAGE:-…} defaults."
                exit 1
                ;;
            esac
          done

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # manifests — one multi-arch list per image, and a keyless signature over each list digest.
  #
  # `docker buildx imagetools create` is the right tool here for one reason, and it is the reason a
  # cross-registry copy needs something else: its sources have to already be in the destination
  # registry. Here they are — `images`
  # pushed both per-arch tags to this same repository — so the list is assembled by reference and no
  # layer moves.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  manifests:
    name: manifest lists and signatures
    needs: [plan, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # KEYLESS SIGSTORE, AND THIS LINE IS THE WHOLE OF THE CREDENTIAL. `id-token: write` lets the
      # job ask GitHub for a short-lived OIDC token; Fulcio exchanges it for a certificate that
      # expires in ten minutes. There is no key in this repository, none in CI, and nothing to
      # rotate — which is issue 10's last criterion, met structurally rather than by policy.
      id-token: write
    steps:
      # `imagetools` reads and writes the registry rather than building anything, so it needs no
      # `docker-container` builder — but it is a buildx subcommand and buildx wants A builder to
      # exist. Setting one up is four seconds against a failure mode that reads as an imagetools bug.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # THE INSTALLER VERIFIES WHAT IT DOWNLOADS, which is the property `scripts/dev-setup.sh`'s buf
      # step does not have and this repository has written down as a mistake not to copy:
      # `/releases/latest/download/` with no version and no checksum. `cosign-release` is deliberately not pinned here — the action's default for a
      # given major IS pinned, and a cosign version invented in this file without being run would
      # fail on the first tag, which is worse than tracking the installer's own default.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: cosign version

      - name: create the lists and record their digests
        id: digests
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
          NAMES: ${{ needs.plan.outputs.kontra_images }}
        run: |
          set -euo pipefail
          : > digests-kontra.tsv
          for name in $NAMES; do
            repo="$REGISTRY/$name"
            docker buildx imagetools create -t "$repo:$VERSION" \
              "$repo:$VERSION-amd64" "$repo:$VERSION-arm64"

            # THE DIGEST OF THE LIST, NOT OF A PLATFORM UNDER IT. `.Manifest.Digest` is the
            # descriptor buildx just pushed. A digest-shaped assertion follows because an empty
            # `--format` result is not an error: it would produce the reference `repo@`, which fails
            # much later and much less clearly.
            digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$repo:$VERSION")
            case "$digest" in
              sha256:*) ;;
              *)
                echo "::error::imagetools reported '$digest' as the manifest digest of $repo:$VERSION"
                exit 1
                ;;
            esac
            printf '%s\t%s@%s\n' "$name" "$repo" "$digest" >> digests-kontra.tsv
          done
          cat digests-kontra.tsv

      # ── SIGNED AT THE DIGEST, WHICH IS THE ONLY THING WORTH SIGNING ─────────────────────────
      #
      # `cosign sign repo:tag` resolves the tag and signs the digest it found, which means the
      # signature is over bytes chosen by whatever the tag pointed at a moment ago. The Warden pulls
      # a PINNED reference (ADR 0039, cli/internal/trustpolicy) so the digest is what it will ask
      # about, and it is what is handed to cosign here.
      #
      # THE IDENTITY IS DERIVED FROM `GITHUB_WORKFLOW_REF`, NOT TYPED. The SAN in a GitHub Actions
      # Fulcio certificate is `https://github.com/<owner>/<repo>/.github/workflows/<file>@<ref>`,
      # which is exactly `https://github.com/$GITHUB_WORKFLOW_REF`. Deriving it means renaming this
      # file cannot leave a verification pinned to a workflow that no longer exists — and a
      # `--certificate-identity` that has drifted is not an error, it is a verify that accepts
      # whatever the OIDC provider vouched for (trustpolicy.go:63, :424 make the same point).
      #
      # AND IT CARRIES THE REF, WHICH IS A FACT ABOUT THE WARDEN'S SIDE AND NOT ABOUT THIS FILE.
      # `@refs/tags/v0.1.0` is in the identity, so a Machine configured with an exact
      # `KONTRA_TRUST_IDENTITY` (trustpolicy.go:524) pins ONE release. The stable form is
      # `--certificate-identity-regexp`, which `newCosignVerifier` does not offer today. The exact
      # string is printed to the job summary so an operator has the value to paste rather than a
      # shape to reconstruct.
      - name: sign each list, keyless
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          issuer="https://token.actions.githubusercontent.com"
          # THE TSV IS READ ON FD 3, NOT ON STDIN. A `while read` loop over stdin shares that stdin
          # with everything it calls, so one command inside that reads a line drains the rest of the
          # file — the loop then signs the first image, exits 0, and reports four of four done.
          # `cosign --yes` does not read stdin today; this loop does not depend on that staying true.
          while IFS=$'\t' read -r name ref <&3; do
            echo "==> signing $name"
            cosign sign --yes "$ref"
          done 3< digests-kontra.tsv

          # ── AND VERIFIED, IN THIS RUN, AGAINST THE IDENTITY IT WAS SIGNED WITH ───────────────
          #
          # ADR 0039's consequences say the keyless path — "certificate chain, Rekor, SAN matching"
          # — is "unproven end to end" because cosign is not on the development machine. This loop is
          # the thing that proves it, and it proves it where it can be seen failing. A signature
          # nobody has verified is a file, and `trustpolicy_test.go`'s first assertion exists because
          # a verification that cannot run and passes anyway is `watchdog.sh`.
          verified=0
          while IFS=$'\t' read -r name ref <&3; do
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$issuer" \
              "$ref" > /dev/null
            verified=$((verified + 1))
            echo "verified $name"
          done 3< digests-kontra.tsv
          # A LOOP OVER AN EMPTY FILE REPORTS SUCCESS BY HAVING HAD NO WORK TO DO. The count is the
          # guard: zero iterations has to fail, not pass quietly.
          expected=$(grep -c . digests-kontra.tsv)
          if [ "$verified" -ne "$expected" ] || [ "$verified" -lt 4 ]; then
            echo "::error::verified $verified of $expected signatures (expected at least 4)"
            exit 1
          fi

          {
            echo "### signing identity"
            echo
            echo "A Machine's trust policy needs both (cli/internal/trustpolicy):"
            echo
            echo '```'
            echo "KONTRA_TRUST_IDENTITY=$identity"
            echo "KONTRA_TRUST_ISSUER=$issuer"
            echo '```'
            echo
            echo "The identity carries this tag's ref, so it changes every release."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-kontra
          path: digests-kontra.tsv
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # pin — the two digest lists become the two files an install reads.
  #
  # `images.json` is for issue 03's Pulumi program, which needs the whole kontra-owned set.
  # `images.env` is for `docker compose`, which needs nothing new to consume it: the variables are
  # the ones `docker-compose.yml` already interpolates, so an install is
  # `cat images.env >> .env` and no code changes hands.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  pin:
    name: images.json and images.env
    needs: [plan, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - name: assemble, and refuse anything that is not a digest
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          REGISTRY: ${{ needs.plan.outputs.registry }}
          COMPOSE_VARS: ${{ needs.plan.outputs.compose_vars }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys

          # A REFERENCE IS PINNED OR IT DOES NOT GO IN THIS FILE. The whole worth of both outputs is
          # that nothing in them can be repointed after the release exists; one tag slipping through
          # would make that false while every other line still looked right.
          PINNED = re.compile(r"^[a-z0-9.\-]+(?::\d+)?/[a-z0-9._\-/]+@sha256:[0-9a-f]{64}$")

          def read(path):
              out = {}
              with open(path) as fh:
                  for line in fh:
                      line = line.rstrip("\n")
                      if not line:
                          continue
                      key, ref = line.split("\t", 1)
                      if not PINNED.match(ref):
                          sys.exit(f"::error::{path}: '{ref}' is not a digest-pinned reference")
                      if key in out:
                          sys.exit(f"::error::{path}: '{key}' appears twice")
                      out[key] = ref
              if not out:
                  sys.exit(f"::error::{path} is empty — a job reported success and published nothing")
              return out

          kontra = read("digests/digests-kontra.tsv")

          version, tag = os.environ["VERSION"], os.environ["TAG"]
          doc = {
              "version": version,
              "tag": tag,
              "commit": os.environ["GITHUB_SHA"],
              "registry": os.environ["REGISTRY"],
              "workflow": os.environ["GITHUB_WORKFLOW_REF"],
              "kontra": kontra,
          }
          with open("images.json", "w") as fh:
              json.dump(doc, fh, indent=2, sort_keys=True)
              fh.write("\n")

          # `name=VAR` pairs, derived by `plan` from compose's own `${KONTRA_*_IMAGE:-…}` defaults.
          # An image with no variable is not an error here, but it IS a line in the file saying so,
          # because an install that silently builds some of its images is the failure this whole
          # workflow is about.
          var_for = dict(
              pair.split("=", 1) for pair in os.environ["COMPOSE_VARS"].split() if "=" in pair
          )
          lines = [
              f"# generated by {os.environ['GITHUB_WORKFLOW_REF']} for {tag or version}",
              "#",
              "# Append to the .env beside docker-compose.yml. Every reference is a digest: these",
              "# lines cannot be repointed, and `docker compose pull` will fetch exactly these bytes.",
              "#",
              "# KONTRA_PULL_POLICY is already `missing` in .env.quickstart and in compose's own",
              "# defaults — it moved there when the install stopped being a clone. It is restated",
              "# below anyway, because an operator appending this file to a .env they wrote before",
              "# that change still has `never` in it, and `never` with published images means compose",
              "# refuses to fetch what it does not already have.",
              "",
          ]
          for name in sorted(kontra):
              var = var_for.get(name)
              if var:
                  lines.append(f"{var}={kontra[name]}")
              else:
                  lines.append(
                      f"# {name} has no compose variable — cli/deploy.go:89 hard-codes"
                      f" the tag, so this digest is not consumable yet:"
                  )
                  lines.append(f"#   {kontra[name]}")
          lines += ["KONTRA_PULL_POLICY=missing", ""]

          # NO THIRD-PARTY SECTION. It used to list the eight mirrored images as comments, which was
          # the honest shape for copies nothing could resolve — and the honest thing now is not to make
          # the copies. `docker-compose.yml` names the eight literally from Docker Hub, and `plan` says
          # why the mirror is gone rather than fixed.
          with open("images.env", "w") as fh:
              fh.write("\n".join(lines))

          print(json.dumps(doc, indent=2, sort_keys=True))
          print(open("images.env").read())
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pins
          path: |
            images.json
            images.env
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # pull — the check that catches the one manual step, from a client that cannot authenticate.
  #
  # GHCR PACKAGES ARE PRIVATE ON FIRST PUSH and do not inherit repository visibility until they are
  # linked. Everything above succeeds; `kontra up` then fails for everyone who is not the owner.
  # Issue 16 is explicit that this must be caught rather than assumed away, so it gates the release:
  # on the first tag this job FAILS, a human makes each package public once, and re-running the
  # failed jobs produces the release. That is a worse first tag and a better every-tag-after.
  #
  # `--no-creds` RATHER THAN `docker logout`. A logout leaves a client that would use a credential if
  # it found one, on a runner that has one in the environment; `--no-creds` sends none, by
  # construction. The same move `cli/trustpolicy_test.go:28-32` describes: make the helper
  # structurally incapable of the thing you are asserting it does not do.
  #
  # AND IT RE-COMPUTES THE DIGEST rather than asking whether the manifest is readable. "The registry
  # answered" and "the registry answered with the bytes we published" are different facts, and only
  # the second one is worth gating a release on.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  pull:
    name: anonymous pull
    # `pin` and NOT `plan`: everything this job needs is inside `images.json`, which is the point —
    # the probe reads the published file, the way an installer will, rather than re-deriving the
    # references from the same inputs that produced them.
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pins
          path: .

      - name: skopeo, or nothing
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          skopeo --version

      - name: every published reference resolves with no credential
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          refs=$(python3 -c '
          import json
          d = json.load(open("images.json"))
          for ref in d["kontra"].values():
              print(ref)
          ')
          [ -n "$refs" ] || { echo "::error::images.json listed no references"; exit 1; }

          private=""
          checked=0
          for ref in $refs; do
            want="${ref##*@}"
            if ! got=$(skopeo inspect --no-creds --raw "docker://$ref" 2>/dev/null | sha256sum | awk '{print "sha256:"$1}'); then
              echo "::warning::anonymous read of $ref FAILED"
              private="$private ${ref%@*}"
              continue
            fi
            if [ "$got" != "$want" ]; then
              echo "::error::$ref answered a manifest whose digest is $got"
              exit 1
            fi
            checked=$((checked + 1))
            echo "ok  $ref"
          done

          if [ -n "$private" ]; then
            # NOT "GHCR packages are PRIVATE on first push", WHICH IS WHAT THIS SAID AND IS NOT TRUE
            # HERE. Measured on `0.0.0-test9`: twelve of the thirteen references pulled anonymously the
            # moment they were pushed, including four kontra images created by that very run. What
            # fails this gate in practice is a package that ALREADY EXISTED and is private — its
            # visibility predates the workflow and a push does not change it. Saying "private on first
            # push" sends an operator looking for a setting on twelve packages that are already fine.
            echo "::error::these packages are not anonymously readable, so a stranger's install cannot pull them:"
            for p in $private; do
              # A PACKAGE NAME CAN CONTAIN SLASHES and GitHub's settings URL percent-encodes them;
              # printing the raw name gives a 404 on the very page that fixes the error, which is the
              # least helpful possible way to report a manual step. Nothing this workflow publishes has
              # a slash in its name today — the `mirror/library/postgres` shape that needed this went
              # with the mirror job — so the encoding is precautionary rather than exercised.
              pkg=$(printf '%s' "${p#*/*/}" | sed 's|/|%2F|g')
              echo "::error::  $p  ->  https://github.com/users/$OWNER/packages/container/$pkg/settings"
            done
            echo "::error::Make each one public (Danger Zone -> Change visibility), then re-run the failed jobs."
            echo "::error::Nothing has been released: the release job is downstream of this one."
            exit 1
          fi

          # A LOOP OVER AN EMPTY LIST REPORTS SUCCESS BY HAVING HAD NO WORK TO DO.
          # FIVE IS NOW THE EXACT COUNT, NOT A FLOOR WITH ROOM UNDER IT. Before the mirror job went it
          # was five owned plus eight copies, so `-ge 5` had thirteen references to be satisfied by and
          # could have passed while every kontra image was missing. It is the whole set now, which makes
          # the check tight: one image failing to publish fails here.
          [ "$checked" -ge 5 ] || { echo "::error::checked only $checked references — images.json is too small to be a whole release"; exit 1; }
          echo "$checked references pull anonymously and match their recorded digests"

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # binaries — the `kontra` CLI for linux and darwin, amd64 and arm64, appended to the release.
  #
  # ON A `v*` TAG REF AND NOWHERE ELSE. That is the tag push, and it is also a dispatch run AGAINST the
  # tag — the recovery `release-please.yml` documents for a tag pushed with the default token, which
  # starts no workflow. A dispatch on a branch, the `0.0.0-testN` case, has no tag for GoReleaser to
  # release and skips this job: the registry half is what those runs are for, and `ci.yml`'s
  # `goreleaser` job is what exercises this half before a tag exists.
  #
  # NO `needs:`, IN EITHER DIRECTION. It reads nothing the image jobs write and they read nothing it
  # writes, so a `needs:` would only let an arm64 container build decide whether a CLI ships — the
  # coupling `images` already had to have removed once, when a macOS leg decided whether images were
  # built at all.
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  binaries:
    name: kontra CLI binaries
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # The release's assets, and nothing else: GoReleaser finds the release release-please created by
      # its tag and uploads to it (`release.mode: append` in .goreleaser.yaml keeps its notes).
      contents: write
      # Keyless cosign over SHA256SUMS — the same credential `manifests` signs the images with.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # GoReleaser reads the tag, the previous tag and the commit time from git; its documented
          # requirement is full history, and a shallow clone makes it warn that tags may be wrong.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod
          # NO RESTORED BUILD CACHE IN A JOB THAT SIGNS WHAT IT BUILDS. A tag run restores cache entries
          # written by runs on the default branch, so anything able to write one there chooses objects
          # this job links into a signed binary. zizmor's `cache-poisoning` audit flags exactly this
          # shape. The price is a cold module download and compile, once per release.
          cache: false

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: cosign version

      # GORELEASER PINNED TO A RELEASE, NOT `~> v2`. The action's default floats to the newest v2,
      # which means the tool that builds and signs a release could change between two tags with no
      # commit here. v2.18.3 is the version `.goreleaser.yaml` was checked and snapshot-built with.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # ── AND VERIFIED, IN THIS RUN, AGAINST THE IDENTITY IT WAS SIGNED WITH ───────────────────────
      #
      # `manifests` does this for the images for the reason it gives there: a signature nobody has
      # verified is a file. The archives are then checked against the list, and the linux/amd64 binary
      # — this runner's own platform — is asked its version, because `-X` naming a symbol that moved is
      # silent and the only proof the version reached the binary is the binary.
      #
      # AFTER THE UPLOAD, NOT BEFORE IT, AND THAT IS A LIMIT OF THE TOOL. GoReleaser signs and publishes
      # in one pipeline with no stop between them (splitting it is a GoReleaser Pro feature). A failure
      # here therefore means the release already carries assets that do not check out: the job goes
      # red, and they have to be deleted from the release page by hand. Late and loud, not quiet.
      - name: the signature, the archives and the version, verified
        shell: bash
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          issuer="https://token.actions.githubusercontent.com"

          cosign verify-blob \
            --new-bundle-format \
            --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            dist/SHA256SUMS
          ( cd dist && sha256sum --strict -c SHA256SUMS )

          # FOUR, EXACTLY: linux and darwin, amd64 and arm64. A floor would pass with a platform
          # missing, which is the one way this list goes wrong without anything else failing.
          count=$(grep -c . dist/SHA256SUMS)
          if [ "$count" -ne 4 ]; then
            echo "::error::SHA256SUMS names $count files, expected 4 (linux/darwin x amd64/arm64):"
            cat dist/SHA256SUMS
            exit 1
          fi

          want="${GITHUB_REF_NAME#v}"
          unpacked="$(mktemp -d)"
          tar -xzf "dist/kontra_${want}_linux_amd64.tar.gz" -C "$unpacked" kontra
          got="$("$unpacked/kontra" version)"
          if [ "$got" != "$want" ]; then
            echo "::error::the released linux/amd64 binary reports '$got' and the tag says '$want' — the -X symbol in .goreleaser.yaml no longer matches cli/internal/buildinfo"
            exit 1
          fi
          echo "kontra $got: signature, $count archives and the linux/amd64 version verified"

          {
            echo "### kontra CLI"
            echo
            echo "Verify a download (the identity carries this tag's ref, so it changes every release):"
            echo
            echo '```'
            echo "cosign verify-blob --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity '$identity' \\"
            echo "  --certificate-oidc-issuer '$issuer' \\"
            echo "  SHA256SUMS"
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
