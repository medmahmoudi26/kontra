name: ci

# READ-ONLY, DECLARED RATHER THAN INHERITED.
#
# The repository's Actions setting is the CEILING for every workflow token, and `publish.yml`
# needs it raised to `write` so it can push container images — a workflow's `permissions:` block
# can only narrow that ceiling, never raise it, which is why a declared `packages: write` was
# being refused as `read_package`. Raising it would otherwise hand a write-scoped token to every
# job in this file that declares nothing, so this file declares.
#
# Nothing here needs write. The only two token uses are `buf-setup-action`'s `github_token`,
# which exists to avoid anonymous rate limits on plugin downloads, and the public checkout of
# `kontra-console`. Both are reads.
permissions:
  contents: read

# Four seams, four independent jobs:
#   python  — install the sdk/python seam, ruff + non-e2e pytest, incl. the codec corpus
#   ts      — orchestrator pnpm install + vitest (incl. the TS conformance test)
#   go      — the four modules under the root go.work, then the standalone example modules
#   proto   — `make proto-check` (buf lint + buf breaking against the fork point) + stub drift
#   docker  — the README's clone+build install: local images, `up -d`, and the assertions
#             a stranger cannot make for us (it comes up healthy, it prints a login, a recreate
#             does not rotate it, every port is on loopback)
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: sdk/python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Editable install of the sdk/python seam (distribution `kontra-sdk`,
      # package `kontra`) with dev (pytest) + seaweed (boto3) extras, plus ruff.
      - name: Install the sdk/python seam
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './sdk/python[dev,seaweed]'
          python -m pip install ruff

      # The repo-root `tests/` suite covers the EXAMPLE actors as well as the SDK, and an
      # example imports its own third-party deps at module scope — so pytest cannot even
      # COLLECT those modules without them. They are deliberately not SDK extras (an actor's
      # dependencies live in its own image; see sdk/python/pyproject.toml), so they are
      # installed here instead, pinned to the same ranges the actor Dockerfiles use.
      # Only pure-Python, CI-cheap deps belong on this line: crawl4ai/Playwright are NOT
      # installed, which is why the tests that need a browser carry the `e2e` marker.
      - name: Install example-actor test dependencies
        run: python -m pip install 'simhash>=2.1,<3'

      # Lint is advisory for now (no ruff config committed yet) — surface findings
      # without failing the gate. Remove `|| true` once a ruff config lands.
      - name: ruff check
        run: ruff check sdk/python runtime/python shared/conformance tests || true

      # Fast suite: everything except the e2e marker (which boots a Temporal server).
      - name: pytest (non-e2e)
        run: pytest -m 'not e2e'

      # THERE IS NO `pytest (example actors)` STEP, and the Makefile says why at the place the
      # target used to be: `test-examples`, `test-examples-python` and `test-examples-go` MOVED TO
      # kontra-actors (ADR 0038), because there are no actors in this repository to run them
      # against. `testdata/fixtureactor` is a fixture, exercised by `tests/test_fixture_actor_e2e.py`
      # and by `scripts/parity-gate.sh`, not by a suite of its own.
      #
      # The move took the target and left this step calling it, so the job has been failing with
      # `make: *** No rule to make target 'test-examples-python'` ever since — a gate that reports
      # red for the absence of the thing it was asked to run. The reason the step existed is still
      # sound (the ADR 0028 migration left two example suites broken for a week because nothing ran
      # them), which is exactly why it is kontra-actors' CI that has to carry it, not a step here
      # that cannot.

  ts:
    name: orchestrator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control/orchestrator
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 22+: the orchestrator uses node:sqlite (catalog/graphs store) — 20 lacks it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # A PYTHON THAT CAN `import kontra`, because part of this suite runs one.
      #
      # `actorControl.test.ts`'s "the generated file, run by Python" block executes the caller this
      # repo GENERATES against the real SDK — the only check that the generated source is not merely
      # well-typed but actually runnable. It resolves an interpreter through `KONTRA_PYTHON`, then the
      # repo venv, then bare `python3`, and it THROWS when none of them can import the SDK rather than
      # skipping: a check that cannot run is not a check that passed. That is the right call, and it
      # means this Node job owes it an interpreter — six tests failed here on
      # `ModuleNotFoundError: No module named 'temporalio'` while passing on every developer machine,
      # where the SDK is always installed.
      #
      # `working-directory` is overridden to the repo root: the editable install path is relative to
      # it, and this job otherwise runs inside `orchestrator/`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install the Python SDK (the generated-caller check executes it)
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './sdk/python[dev]'

      # tsc --noEmit: the type gate. It is what enforces that the committed generated
      # boundary types (_gen) stay compatible with how the interpreter uses them, and
      # that the entry.contract.ts congruence guard holds.
      - name: typecheck (tsc --noEmit)
        run: pnpm run typecheck

      # vitest run over src/**/*.test.ts — includes src/codec/conformance.test.ts,
      # the TS peer of the byte-compatible claim-check codec gate.
      - name: vitest (incl. TS conformance test)
        run: pnpm test

  # THE CONSOLE'S SUITE MOVED TO kontra-console (ADR 0038).
  #
  # There was a `web` job here running ~1100 tests, and it was added because their absence let two
  # real UI regressions ride a fully green branch in August 2026 — `workflowSource.ts` stopped
  # recognising a promoted Dataset as a write, and the Workflows page under-reported a workflow's
  # outputs, while every gated suite stayed green. That job is now kontra-console's own CI, where
  # the source is.
  #
  # It needed a step this repository can no longer provide: `pnpm install` in `backend/`, because
  # the SPA typechecked through `@core/*` path aliases into the ORCHESTRATOR'S OWN dependency graph
  # — `@temporalio/client`, `@opentelemetry/*` — and failed here on eight `TS2307`s no developer
  # could reproduce. ADR 0041 replaced the aliases with a dependency on `@kontra/core`, which is a
  # bounded surface rather than the whole server.
  #
  # THAT IS NOT YET THE SAME AS SELF-CONTAINED. `@kontra/core` is unpublished, so kontra-console
  # depends on it as `link:../kontra/core` and its CI checks THIS repository out as a sibling to
  # build the package. That checkout goes away when the package is published to npm, and not before.

  go:
    name: handler + cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/handler/go.mod
          cache-dependency-path: |
            runtime/handler/go.sum
            cli/go.sum
            sdk/go/go.sum
            runtime/go/go.sum

      # FOUR modules under the root go.work; `go test ./...` doesn't cross module
      # boundaries, so run each seam explicitly.
      #
      # The Go SDK was absent from both this job and go.work until 2026-08-14, so the entire
      # thing — including its arm of the codec and blobkey conformance corpora, which exist
      # precisely to catch cross-SDK drift — had never run in CI. Two of those corpora are
      # two-sided by design: a Python-only run asserts half a contract.
      #
      # sdk/go RUNS FIRST AND ON ITS OWN, which is not cosmetic: its arrow_test.go asks
      # `go list -deps ./...` whether the author surface reaches the runtime, and the answer is a
      # property of THIS module's graph. Running it here, before the runtime is built, is also the
      # cheapest possible statement of the split — if sdk/go needed runtime/go, this step could not
      # resolve its own imports.
      # ── `-count=1` IS NOT PARANOIA, IT IS THE ONLY WAY THE CORPORA ARE CHECKED AT ALL ───────────
      #
      # `go test` caches results and invalidates the cache when a file the test READ changes — but
      # only for files inside the module. Every conformance corpus lives in `shared/conformance/`,
      # which is outside all four of these modules, so a corpus edit does not invalidate anything:
      # the next run answers `ok (cached)` for a contract it never re-executed.
      #
      # MEASURED: `shared/conformance/checkpoint.json` was mutated to an expectation no
      # implementation satisfies. The Python and TypeScript halves failed. `go test ./...` answered
      # `ok (cached)`; `go test -count=1` failed immediately. A corpus is the one kind of test input
      # where a stale pass is indistinguishable from agreement, which is the whole reason these
      # files exist.
      - name: sdk/go (build + vet + test, incl. the sdk -> runtime arrow)
        working-directory: sdk/go
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...

      - name: runtime/go (build + vet + test)
        working-directory: runtime/go
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...

      - name: handler (build + vet + test)
        working-directory: runtime/handler
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...

      - name: cli (build + vet + test)
        working-directory: cli
        # `-timeout 30m`, AND IT IS NOT PADDING. MEASURED on the development box: this package's
        # tests take 610s, and `go test` defaults to a 600-second panic timeout — so the plain
        # command fails here with `panic: test timed out after 10m0s`, naming whichever test was
        # merely UNLUCKY ENOUGH to be running at the deadline rather than anything slow. It is the
        # appliance tests that cost it: each boots a real Temporal server and hydrates bundles.
        #
        # A runner is not this box, so the honest statement is that the margin was ten seconds and
        # the default is not a budget anyone chose. If this starts timing out at 30m, something is
        # hanging — that is a real failure and the number should not move again.
        run: |
          go build ./...
          go vet ./...
          go test -count=1 -timeout 30m ./...

      # THE SEVEN-STANDALONE-MODULES GATE MOVED TO kontra-actors, IT DID NOT GO AWAY.
      #
      # It existed for a reason worth repeating where it used to live: a Go actor is a module an
      # author COPIES, so it carries its own go.mod and reaches the SDK through a `replace` — which
      # made the surface a new author starts from the only surface with no gate. That was not
      # hypothetical: the ADR 0028 migration left two Python actors on the old one-arg call and the
      # branch stayed green for a week because nothing ran them.
      #
      # ADR 0038 moved every actor to kontra-actors, so the gate lives in that repository's own CI
      # (`GOWORK=off`, `GOTOOLCHAIN=auto`, one `cd` per module — all three load-bearing, see the
      # note in this repo's Makefile). What remains here is `testdata/fixtureactor`, which the
      # parity gate and the build-actor job below both use, and which is not a Go module.

  build-actor:
    # THE CI TEMPLATES, EXERCISED. `.github/actions/build-actor/action.yml` and
    # `.gitlab/kontra-build-actor.yml` are shipped surface — somebody's pipeline runs those exact
    # strings — and nothing joins them to `kontra build`'s flag set but matching literals.
    # `cli/build_test.go` catches a flag that stopped existing; only running them catches a step
    # that stopped working.
    #
    # AGAINST A LOCAL registry:2 AND NOTHING ELSE. ADR 0036 makes the destination the customer's
    # registry, and this job must never authenticate to one: it publishes to a service container on
    # loopback, which is also the `localhost:5000` single-box case the ADR keeps.
    #
    # The GitLab half is not a GitLab runner and is not pretended to be one. What is asserted is
    # that its three commands work — the same claim the composite action makes — because the value
    # of both files is the command line, not the YAML dialect.
    name: build-actor (the CI templates)
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/handler/go.mod
          cache-dependency-path: |
            runtime/handler/go.sum
            cli/go.sum

      - name: install kontra
        run: go build -o /usr/local/bin/kontra ./cli

      - name: the GitHub Action, against the local registry
        id: built
        uses: ./.github/actions/build-actor
        with:
          actor: testdata/fixtureactor
          push: localhost:5000/bundles/fixtureactor

      # THE OUTPUT IS THE CONTRACT. An action whose steps all exit 0 and whose outputs are empty is
      # the shape of a wrapper that silently stopped parsing what it wraps — the reason `--json`
      # exists at all rather than a `sed` over the human output.
      - name: the digest reached the outputs
        env:
          DIGEST: ${{ steps.built.outputs.digest }}
          PINNED: ${{ steps.built.outputs.pinned }}
          PLACEABLE: ${{ steps.built.outputs.placeable }}
        run: |
          set -euo pipefail
          echo "digest=$DIGEST pinned=$PINNED placeable=$PLACEABLE"
          case "$DIGEST" in sha256:*) ;; *) echo "the action produced no manifest digest"; exit 1;; esac
          test "$PLACEABLE" = "true"
          # …and the registry really holds what the action says it pushed.
          curl -sf -o /dev/null -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "http://localhost:5000/v2/bundles/fixtureactor/manifests/${DIGEST}"

      - name: the GitLab template's commands, run as written
        env:
          KONTRA_ACTOR: testdata/fixtureactor
          KONTRA_PUSH: localhost:5000/bundles/fixtureactor-gitlab
        run: |
          set -euo pipefail
          # Extracted from the template rather than retyped, so a change there is a change here.
          python3 - <<'PY' > /tmp/gitlab-script.sh
          import yaml
          job = yaml.safe_load(open('.gitlab/kontra-build-actor.yml'))['.kontra-build-actor']
          print('\n'.join(job['script']))
          PY
          test -s /tmp/gitlab-script.sh
          KONTRA_REGISTRY_PASSWORD='' bash /tmp/gitlab-script.sh
          test -s kontra-artifact.json
          python3 -c "import json;d=json.load(open('kontra-artifact.json'));assert d['digest'].startswith('sha256:'),d"

  proto:
    name: proto-envelope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # THE GATE READS ITS BASELINE OUT OF THIS CLONE, so the clone has to contain one:
          # fetch-depth: 0 brings every branch down as a remote-tracking ref AND the history
          # behind them, which is what `git merge-base HEAD origin/<base>` needs. A shallow
          # checkout has no common ancestor with anything and `make proto-check` says so rather
          # than diffing against nothing.
          fetch-depth: 0

      # github_token lets `buf generate` pull the remote plugins (protocolbuffers
      # python/pyi + community ts-proto) without rate-limiting.
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
          # PIN the buf CLI. Every codegen plugin in buf.gen.yaml is already version-pinned,
          # but the well-known types (google/protobuf/*.proto) ship INSIDE the buf binary —
          # so an unpinned CLI regenerates `control/orchestrator/_gen/google/protobuf/descriptor.ts`
          # from a different descriptor.proto than the committed stubs were built from, and
          # the drift check fails on vendored WKT churn that no one authored. 1.70.0 is the
          # version that reproduces the committed stubs byte-for-byte.
          version: 1.70.0

      # protoc-gen-go-temporal is a LOCAL binary plugin (not on the BSR) that buf.gen.yaml
      # invokes for actor_service.proto's Nexus op — install it so `buf generate` succeeds.
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/handler/go.mod

      #
      # RETRIED, BECAUSE THIS STEP'S ONLY FAILURE MODE IS SOMEBODY ELSE'S NETWORK. `go install` of a
      # pinned version verifies each module against sum.golang.org, and a checksum tile read that
      # dies mid-stream fails the whole job with no test having run. OBSERVED 2026-08-27 on
      # `04f1ba7`: `reading https://sum.golang.org/tile/8/0/x020/688: stream error: INTERNAL_ERROR;
      # received from peer`, on a commit whose diff touches no proto, no plugin and no Go module.
      # The pin is unchanged and the sumdb still verifies — this retries the fetch, it does not
      # weaken what is checked (no GOFLAGS, no GONOSUMDB, no GOPRIVATE).
      - name: install protoc-gen-go_temporal (local buf plugin)
        run: |
          for attempt in 1 2 3; do
            go install github.com/cludden/protoc-gen-go-temporal/cmd/protoc-gen-go_temporal@v1.24.0 && break
            if [ "$attempt" = 3 ]; then
              echo "::error::go install failed three times; this is not a transient fetch"
              exit 1
            fi
            echo "attempt $attempt failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ONE GATE, ONE SPELLING. `buf lint` and `buf breaking` used to be two inline steps that
      # existed nowhere else, so the only way to run the contract check was to open a PR and read
      # the log. `make proto-check` (scripts/proto-check.sh) is the same command on a laptop and
      # here, which is the only reason a developer can find out before pushing.
      #
      # The baseline is the FORK POINT, resolved from this clone. On a PR that is the branch the
      # PR targets — what THIS PR can actually break, so a stacked PR is measured against the
      # branch it stacks on and not an unrelated `main`. On a push it is `github.event.before`,
      # the commit main was at BEFORE the push, which is the only way a change that never saw a PR
      # gets checked at all — and it is that rather than HEAD^ because a push can carry several
      # commits, and then HEAD^ is inside the push: a break in its first commit would be on both
      # sides of the diff and read clean, which is the exact hole this baseline exists to close.
      # A push that has no reachable `before` (main created, or force-pushed over) fails the gate
      # loudly instead of comparing against nothing; re-run it with PROTO_BASELINE set.
      #
      # Reading the baseline out of the local clone is also why the `insteadOf` token dance is
      # gone: the old step cloned `https://github.com/<repo>` to get the base branch and, the repo
      # being private, needed credentials to do it. Nothing is fetched now — the refs are already
      # here (fetch-depth: 0), and `git merge-base` resolves them to a sha buf reads from `.git`.
      #
      # NO LONGER ADVISORY, and this is the moment the old comment named. It was `|| echo
      # ::warning::` while ADR 0023's flag day landed — the step purge deleted
      # `kontra/v1/step.proto` and FILE_NO_DELETE reports that as breaking because it IS breaking.
      # main now carries the deletion, so the diff against it is empty and the gate passes
      # strictly; leaving it advisory past that point would silence the next UNINTENDED break,
      # which is the whole reason it exists.
      - name: proto gate (buf lint + buf breaking)
        env:
          PROTO_BASELINE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: make proto-check

      # The generated stubs are committed (sdk/python/kontra/v1 + control/orchestrator/_gen +
      # runtime/handler/_gen); regenerate and fail if anything drifts from what's checked in.
      # `if: !cancelled()` so a FAILING proto gate cannot mask this: the two answer independent
      # questions (is the contract change compatible? vs are the committed stubs in sync?), and an
      # unguarded step would simply never run on the day the gate goes red — which is precisely a
      # day somebody is editing protos, so a real stub drift would ship undetected.
      - name: buf generate (drift check)
        if: ${{ !cancelled() }}
        run: |
          buf generate
          git diff --exit-code -- sdk/python/kontra/v1 control/orchestrator/_gen runtime/handler/_gen \
            || { echo "::error::generated proto stubs are stale — run 'just buf-generate' and commit"; exit 1; }

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # THE PARITY GATE — does the binary replace compose for LOCAL DEVELOPMENT? (ADR 0031 §5, issue 18)
  #
  # Every other job in this file answers a question about source. This one answers a question about
  # a RUNNING SYSTEM, and it is the only one that can: it starts `kontra up` on a throwaway data
  # directory, builds and pushes an actor image to the registry inside that process, runs worker
  # containers against it, dispatches four Batches, and compares the unit and drop counts against
  # known integers.
  #
  # WHY COUNTS AND NOT STATUS. The three failures this exists to catch all reported `completed`: a
  # chained dispatch that isolated every Unit on a fleet while being invisible on one box; a wiped
  # batch that came back clean in seven minutes; a node whose Units all failed reporting success
  # with empty output. `scripts/parity-gate.sh` carries the assertions and the reasoning — this job
  # is the machine that runs it.
  #
  # AND IT RUNS `make test-examples` TWICE, on one commit: the `python` job above runs it with no
  # control plane (the SDK-side contract, `-m 'not e2e'`), and the gate runs it again with
  # `E2E=1` against the appliance. Issue 18 asks for that comparison "on the same commit that runs
  # it against compose"; THE COMPOSE HALF NO LONGER EXISTS — docker-compose.yml lost Temporal, the
  # object store, the KV, the codec, the registry and orchestrator-api to ADR 0031's earlier
  # slices, so there is nothing left there to run a suite against. Two runs of one suite, one
  # control plane apart, is the comparison that is actually available.
  #
  # IT IS THE SLOWEST JOB HERE and it is meant to be: a pnpm install, a vite build, two Go builds
  # and a Docker image. That is the price of a gate that runs something instead of reading it.
  parity:
    name: parity gate (the binary runs the local actor path)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # THE GO TOOLCHAIN BUILDS TWO THINGS HERE, and the second is easy to forget: the CLI, and —
      # through `kontra serve --mode local`, which the e2e leg needs a Worker from — `go run .`
      # inside runtime/handler/. Both modules are under the root go.work.
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/handler/go.mod
          cache-dependency-path: cli/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install the Python SDK and the example actors' test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './sdk/python[dev,seaweed]'
          python -m pip install 'simhash>=2.1,<3'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # THE ORCHESTRATOR FROM THE CHECKOUT, not from a bundle. `kontra up --orchestrator=local`
      # runs `control/orchestrator/dist` directly, which is what makes this job about THIS commit's control
      # plane; `--orchestrator=bundle` would resolve a 330 MB dependency tree and build a
      # content-addressed artifact, which `.github/workflows/appliance.yml` already gates four
      # platforms of. Two different questions, two different jobs.
      # THE SPA IS ANOTHER REPOSITORY NOW, and this step has been broken by every previous move of
      # it — which is the reason for the paragraph rather than a line of yaml.
      #
      # It was `cd web` from inside the orchestrator; the rename to `backend/` + `frontend/` could
      # not see that, because the path this step walks is not SPELLED anywhere, it is ACCUMULATED
      # across two `cd`s. A sweep for `orchestrator/web` matched nothing and the second hop kept
      # pointing at a directory that had stopped existing. `tests/test_workflow_paths.py` resolves
      # these the way the shell does, for exactly that reason.
      #
      # ADR 0038 moved it out of the repository altogether, so the hop is a checkout. That needs
      # `KONTRA_CONSOLE_TOKEN` — a token with read access to kontra-console — for as long as that
      # repository is private; a missing secret fails this step with a 404 on a repository that
      # exists, which is worth knowing before reading it as a typo.
      # NESTED UNDER `_sibling/`, WHICH LOOKS ODD AND IS THE POINT. kontra-console depends on
      # `@kontra/core` as `link:../kontra/core` — an unpublished package resolved through the
      # filesystem — so the console needs a directory literally named `kontra` beside it. This
      # checkout is at the workspace ROOT, so `kontra-console/` alone would put `../kontra` at
      # `$GITHUB_WORKSPACE/kontra`, which does not exist. One level down, with a symlink, both
      # names are where the dependency says they are.
      - name: check out the console (the SPA is another repository since ADR 0038)
        uses: actions/checkout@v4
        with:
          # NO `token:`. `kontra-console` is a public repository, so the default `GITHUB_TOKEN`
          # reads it — and `secrets.KONTRA_CONSOLE_TOKEN`, which used to be here, resolves to the
          # EMPTY STRING once the secret is gone. `actions/checkout` with an empty token does not fall
          # back to the default one; it fails, in seconds, before anything interesting has run.
          # `publish.yml:376-380` checks the same repository out the same way.
          repository: medmahmoudi26/kontra-console
          path: _sibling/kontra-console

      - name: put this checkout where `link:../kontra/shared/core` expects it
        run: ln -sfn "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/_sibling/kontra"

      # `@kontra/core` FIRST, and it is not belt-and-braces: the console links it out of this
      # checkout, so a console built against a stale `core/dist` disagrees with the orchestrator it
      # is about to be served beside.
      - name: build the orchestrator and the SPA
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kontra/core run build
          pnpm --filter @kontra/backend exec tsc
          cd _sibling/kontra-console
          pnpm install --frozen-lockfile
          pnpm run build

      # DOCKER, AND THE ADDRESS A CONTAINER CAN REACH. The appliance binds 127.0.0.1 by default
      # (ADR 0031 §3) and an actor Worker is a container (ADR 0031 §2), whose loopback is its own —
      # so the gate binds docker0's gateway. Asserted rather than assumed, because a runner image
      # that changed its bridge subnet would otherwise fail deep inside a dispatch.
      - name: docker is here and its bridge gateway is a local address
        run: |
          set -euo pipefail
          docker version --format 'engine {{.Server.Version}}'
          gw=$(docker network inspect bridge --format '{{ (index .IPAM.Config 0).Gateway }}')
          echo "bridge gateway: $gw"
          ip -o addr show | grep -q " inet $gw/" \
            || { echo "::error::the daemon's bridge gateway $gw is not an address on this runner"; exit 1; }

      # THE GATE. Its exit code is the job's, and it prints which condition failed and what it
      # measured. Not piped into anything: a pipeline reports its LAST stage's status, which is how
      # a suite that fails gets reported as passing.
      - name: scripts/parity-gate.sh
        env:
          KONTRA_GATE_ORCHESTRATOR: local
        run: bash scripts/parity-gate.sh

  # ══ THE LOCAL CLUSTER INSTALL (ADR 0047) ═══════════════════════════════════════════════════════
  #
  # The README tells a stranger to clone, build images, and `docker compose up -d --wait`. This job
  # is the only thing that can say whether that sentence is true: the same compose files against
  # images built from this commit.
  #
  # `--no-spa` because the console is another repository. This job asserts the API, login, seed,
  # starter Run and loopback publishes — not a browser page.
  docker:
    name: the local docker install
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: cut a release for this platform
        working-directory: cli
        run: |
          go run . release --repo .. --platform linux/amd64 \
            --version 0.0.0-ci --out ../build/release --no-spa

      - name: build cluster images
        run: |
          set -euo pipefail
          tarball=$(ls build/release/kontra_*_linux_amd64.tar.gz)
          echo "==> kontra from $tarball"
          docker build -f control/images/Dockerfile.appliance \
            --build-arg TARBALL="$tarball" -t kontra:ci .
          docker build -f control/images/Dockerfile.orchestrator \
            --build-arg SPA_IMAGE=kontra:ci -t kontra-orchestrator:ci .
          docker build -f control/images/Dockerfile.pyworker -t kontra-host:1 .
          docker build -f control/images/Dockerfile.workerbase -t kontra-worker-base:1 .
          # The log shipper and its parser. It is an image rather than two bind mounts because
          # `tests/test_logline.py` loads the parser BY PATH and it must stay a file — see
          # control/images/Dockerfile.logship. Built here so the compose `up` below has it; without
          # it, `pull_policy: never` fails on a missing image, which is the honest failure.
          docker build -f control/images/Dockerfile.logship -t kontra-logship:ci .
          # PORTER, WHICH IS THE ONE IMAGE HERE NOT BUILT FROM THIS COMMIT — and it is built anyway,
          # for a reason worth stating. `Dockerfile.porter` clones `github.com/TFMV/porter` at a
          # pinned ref, so nothing about this commit changes what comes out; pointing CI at a local
          # build therefore proves nothing the way the other four do. It is here because the
          # alternative is not available: compose starts porter unconditionally (no `profiles:`), its
          # default is `ghcr.io/medmahmoudi26/kontra-porter:dev`, and THAT PACKAGE HAS NEVER BEEN
          # PUBLISHED — publish.yml had no arm for it until 8da3305. So a stranger following the
          # documented install gets
          #   Error response from daemon: No such image: ghcr.io/medmahmoudi26/kontra-porter:dev
          # and this job gets the same thing under `KONTRA_PULL_POLICY=never`. Building it is what
          # lets the eleven assertions below run at all; publishing it is what fixes the quickstart.
          docker build -f control/images/Dockerfile.porter -t kontra-porter:ci .

      # ONE FILE IN THE INSTALL DIRECTORY, AND THE COUNT IS THE ASSERTION.
      #
      # This step used to `cp control/images/postgres-init.sh` in beside the compose file, because
      # compose bind-mounted it. That is the whole reason the install was a clone: a bind-mount source
      # Docker cannot find is not an error, it is a silently-created empty DIRECTORY, so the failure
      # landed on the first Dataset write against a DuckLake catalog that was never created.
      #
      # The mount is gone — `docker-compose.yml` carries the script as a `configs:` entry with inline
      # `content:`, and the log shipper's two scripts moved into `kontra-logship`. So this directory
      # now holds exactly what a stranger's `curl` puts in theirs, and the `find` below FAILS THE BUILD
      # if that stops being true. Without it, somebody adds a mount, CI copies whatever it needs, and
      # the quickstart is broken for everybody except CI.
      - name: a fresh install directory, holding only what a curl would put there
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/install" "$RUNNER_TEMP/workspaces"
          cp docker-compose.quickstart.yml "$RUNNER_TEMP/install/docker-compose.yml"
          cp .env.quickstart "$RUNNER_TEMP/install/.env"

          # THE IMAGES ARE THE ONE THING CI OVERRIDES, and it is not cheating: compose's defaults are
          # `ghcr.io/medmahmoudi26/*:dev`, which is what a stranger pulls. This job builds the images
          # from THIS commit, so it has to point at them or it would be testing the last publish
          # instead of the change in front of it. `publish.yml`'s `anonymous pull` job is what proves
          # the registry half. Everything else here is untouched defaults.
          {
            echo "KONTRA_IMAGE=kontra:ci"
            echo "KONTRA_ORCHESTRATOR_IMAGE=kontra-orchestrator:ci"
            echo "KONTRA_HOST_IMAGE=kontra-host:1"
            echo "KONTRA_LOGSHIP_IMAGE=kontra-logship:ci"
            echo "KONTRA_PORTER_IMAGE=kontra-porter:ci"
            echo "KONTRA_PULL_POLICY=never"
            echo "KONTRA_WORKSPACES=$RUNNER_TEMP/workspaces"
          } >> "$RUNNER_TEMP/install/.env"

          # AND THE LIST ABOVE IS CHECKED AGAINST COMPOSE, because it is hand-written and compose is
          # the thing that decides. `KONTRA_PORTER_IMAGE` was missing from it, so porter alone fell
          # back to a `:dev` tag that has never been published and the `up` below could not start —
          # an omission with no error until the very last step. `publish.yml` already derives its
          # image list from these same `${KONTRA_*_IMAGE:-…}` defaults rather than restating them;
          # this job cannot derive the BUILD commands that way, so it verifies instead.
          missing=()
          while read -r var; do
            grep -q "^${var}=" "$RUNNER_TEMP/install/.env" || missing+=("$var")
          done < <(grep -oE '\$\{KONTRA_[A-Z_]*IMAGE:-' docker-compose.yml | sed 's/^\${//;s/:-$//' | sort -u)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::docker-compose.yml names image override(s) this job does not set: ${missing[*]}"
            echo 'Each one needs a docker build above and a line here, or the service falls back'
            echo 'to a published :dev tag, which under KONTRA_PULL_POLICY=never cannot be pulled.'
            exit 1
          fi

      # THE CHECK IS A SCRIPT AND NOT A STEP, for the same reason `control/images/logline.py` is a
      # file: a multi-line checker embedded in a YAML block scalar is something nothing can run
      # locally and nothing can test. `scripts/install-cluster.macos.sh` runs this same file.
      #
      # It asserts three things — only the curl'd files on disk, no bind mount but the socket and the
      # workspace, and an explicit `mode` on every `configs:` entry. The third one is not about
      # self-containedness and its reason is in the script's own docstring.
      - name: the install directory holds nothing a curl would not have
        run: python3 scripts/assert-install-is-self-contained.py "$RUNNER_TEMP/install"

      - name: docker compose up -d --wait
        working-directory: ${{ runner.temp }}/install
        run: docker compose up -d --wait

      - name: the API answers
        working-directory: ${{ runner.temp }}/install
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8088/api/health | tee /dev/stderr | grep -q '"ok":true'

      - name: first boot printed the console login
        working-directory: ${{ runner.temp }}/install
        run: |
          set -euo pipefail
          docker compose logs --no-color cli > boot.log
          grep -q 'console login' boot.log \
            || { echo "::error title=no console login in the log::"; tail -50 boot.log; exit 1; }
          grep -qE '^\s*password\s+\S{20}' boot.log \
            || { echo "::error title=the login line has no password on it::"; grep -A4 'console login' boot.log; exit 1; }

      - name: that password signs in
        working-directory: ${{ runner.temp }}/install
        run: |
          set -euo pipefail
          pw=$(docker compose logs --no-color cli | grep -m1 -E '^\s*password\s+' | awk '{print $NF}')
          [ -n "$pw" ] || { echo "::error title=no password scraped from the log::"; exit 1; }
          code=$(curl -s -o resp.json -w '%{http_code}' -X POST http://127.0.0.1:8088/api/login \
                   -H 'content-type: application/json' \
                   --data "$(printf '{"user":"admin","password":"%s"}' "$pw")")
          [ "$code" = 200 ] || { echo "::error title=the printed password does not sign in::HTTP $code"; cat resp.json; exit 1; }
          bad=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8088/api/login \
                  -H 'content-type: application/json' -d '{"user":"admin","password":"not-the-password"}')
          [ "$bad" != 200 ] || { echo "::error title=the login route accepted a wrong password::"; exit 1; }
          echo "signed in; a wrong password got $bad"

      - name: workspace seeded once and not overwritten
        working-directory: ${{ runner.temp }}/install
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/workspaces"
          test -f "$root/hello/actors/hello/actor.json"
          test -f "$root/hello/workflows/hello/workflow.py"
          echo marker > "$root/hello/KEEP"
          docker compose exec -T cli kontra workspace seed
          test -f "$root/hello/KEEP"

      - name: discovery registered the starters
        working-directory: ${{ runner.temp }}/install
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            docker compose logs --no-color cli | grep -q 'registered actor' && break
            sleep 5
          done
          docker compose logs --no-color cli | grep -q 'registered actor' \
            || { echo "::error title=actor never registered::"; docker compose logs --no-color cli | tail -80; exit 1; }
          docker compose logs --no-color cli | grep -q 'registered workflow' \
            || { echo "::error title=workflow never registered::"; docker compose logs --no-color cli | tail -80; exit 1; }

      - name: serve and start the starter workflow
        working-directory: ${{ runner.temp }}/install
        run: |
          set -euo pipefail
          docker compose exec -d cli sh -c 'kontra workflow serve "$KONTRA_WORKSPACES/hello/workflows/hello"'
          sleep 15
          docker compose exec -T cli sh -c 'kontra workflow start "$KONTRA_WORKSPACES/hello/workflows/hello" --wait --timeout 15m'

      - name: Dataset contains hello world and the Fleet is gone
        working-directory: ${{ runner.temp }}/install
        run: |
          set -euo pipefail
          docker compose exec -T cli sh -c 'kontra dataset query hello --sql "select message from hello"' | tee ds.out
          grep -q 'hello world' ds.out \
            || { echo "::error title=Dataset missing hello world::"; cat ds.out; exit 1; }
          leftover=$(docker ps -a --format '{{.Names}}' | grep -E '^kf-' || true)
          [ -z "$leftover" ] || { echo "::error title=Warden/actor containers still running::$leftover"; exit 1; }

      - name: recreating does not rotate the credential
        working-directory: ${{ runner.temp }}/install
        run: |
          set -euo pipefail
          docker compose up -d --no-deps --force-recreate workspace-init
          sleep 3
          docker compose logs --no-color --tail=40 workspace-init > second.log
          grep -q 'already set up' second.log \
            || { echo "::error title=second boot re-initialised::"; cat second.log; exit 1; }
          grep -q 'console login' second.log \
            && { echo "::error title=second boot printed a NEW login::"; cat second.log; exit 1; }
          test -f workspace/actors/hello/actor.json
          echo "second boot kept the account and the workspace"

      - name: every published port is bound to loopback
        working-directory: ${{ runner.temp }}/install
        run: python3 "${{ github.workspace }}/scripts/assert-loopback-publish.py"

      - name: teardown
        if: always()
        working-directory: ${{ runner.temp }}/install
        run: docker compose down -v || true
