# The scanners that would have caught what a one-off scan just found.
#
# WHY THIS FILE EXISTS, AND WHAT IT CAUGHT. A manual `govulncheck` run on 2026-10-07 reported nine
# call-graph-confirmed vulnerabilities in `runtime/go` alone — eight in the Go standard library at
# 1.26.4 and one in gRPC — on a repository with no vulnerability scanning of any kind. Eight of the
# nine were one `go` directive away from fixed. Nothing was going to report them, so nothing did.
#
# EVERY JOB HERE RUNS ON PULL REQUESTS AND NIGHTLY, and the split matters: a dependency becomes
# vulnerable while nobody touches it, so a PR-only gate goes quiet exactly when the risk is arriving.
#
# NONE OF THESE NEEDS A SECRET. govulncheck and osv-scanner read a public database; zizmor reads the
# workflow files in the checkout; gitleaks reads the history in it; CodeQL and Scorecard use the
# token GitHub already provides.
#
# WHAT IS A GATE AND WHAT IS A REPORT. govulncheck, zizmor and gitleaks fail the job on a finding,
# and each scanner is pinned to a version so that the verdict moves only when this repository
# changes or a NEW advisory lands, never because a scanner shipped a release overnight: a required
# check that turns red with no change in the tree is how required checks get un-required.
# osv-scanner and Scorecard report into the Security tab and do not gate (osv's section says why).
# CodeQL stays out of the required set until its open high-severity alerts have been triaged.

name: security

on:
  push:
    branches: [dev]
  pull_request:
  schedule:
    # 04:17 UTC — off the hour, because every scanner in the world runs at :00 and the shared runners
    # and the OSV database are busiest then.
    - cron: '17 4 * * *'
  workflow_dispatch:

# READ-ONLY BY DEFAULT, and each job widens only what it needs. zizmor's first finding on most
# repositories is a workflow with write-all because one step needed one write.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── GO: CALL-GRAPH AWARE, SO A FINDING IS A FINDING ──────────────────────────────────────────────
  #
  # `govulncheck` reports only vulnerabilities your code can actually REACH, which is why its output is
  # worth gating on: a vulnerable function nobody calls is noise, and a tool that reports it teaches
  # people to ignore the tool. Five modules, each with its own go.mod.
  #
  # THE DEMO ACTOR IS SCANNED BECAUSE IT LIVES HERE. `workspaces/demo/actors/desync` is a standalone
  # module outside `go.work` with its own dependency set (a third-party HTTP library, the AWS SDK),
  # and it was the one go.mod in the tree no gate read; `tests/test_vulngate.py` now fails if the
  # tracked go.mod files and this matrix disagree in either direction. It runs with `GOWORK=off`:
  # inside the workspace, `govulncheck ./...` there dies with "directory prefix . does not contain
  # modules listed in go.work" — the same error osv-scanner's section below records — and a scan
  # that cannot load the module reports nothing. Standalone it builds, because its replaces point at
  # the sdk and runtime in this checkout.
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [cli, runtime/go, runtime/handler, sdk/go]
        include:
          - module: workspaces/demo/actors/desync
            gowork: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # THE MODULE'S OWN DIRECTIVE, as every other workflow here does it. That is what makes a
          # toolchain bump fix the standard-library findings everywhere at once instead of being
          # reverted by a pinned version in a workflow file.
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # THE JSON IS WHAT THE GATE READS; `scripts/vulngate.py` prints the human-readable half. One
      # scan, not two, because this is the expensive step — measured at ~5 GiB resident over `cli`.
      #
      # THE EXIT CODE IS CLASSIFIED RATHER THAN TRUSTED OR IGNORED. govulncheck exits 3 when it finds
      # something, and 3 is not a verdict here: two of this repository's advisories have no fixed
      # version, so the decision is `.github/vuln-allow.json`'s and the gate's. But a scan that DIED
      # must still fail, and that is not the same thing. An OOM kill exits 137 and leaves a PARTIAL
      # report — symbol analysis never finished, so every finding comes out module-level and the
      # report reads exactly like "nothing is reachable". Measured on this repository: a killed run
      # over `cli` reported 10 advisories, 0 reachable, while CI reported 3 reachable. A bare
      # `|| true` here would have shipped that as a pass.
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        env:
          # Empty for the workspace modules, which is Go's default (find go.work); `off` for desync.
          GOWORK: ${{ matrix.gowork }}
        run: |
          set -euo pipefail
          # PINNED, NOT @latest, for the reason the header gives: the advisory DATABASE is what
          # should move this gate, and it is read fresh on every run regardless of this version.
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          report="$RUNNER_TEMP/govulncheck-$(echo "${{ matrix.module }}" | tr / -).json"
          set +e
          "$(go env GOPATH)/bin/govulncheck" -format json ./... > "$report"
          rc=$?
          set -e
          if [ "$rc" -ge 128 ]; then
            echo "::error::govulncheck was KILLED by signal $((rc - 128)) — the report in $report is partial and every finding in it will look module-level. This is not a pass."
            exit 1
          fi
          case "$rc" in
            0|3) : ;;  # 0 = nothing found, 3 = findings; both are complete reports
            *)   echo "::error::govulncheck exited $rc, which is an error rather than a result"; exit 1 ;;
          esac
          [ -s "$report" ] || { echo "::error::govulncheck exited $rc but wrote no report"; exit 1; }
          python3 "$GITHUB_WORKSPACE/scripts/vulngate.py" \
            --module "${{ matrix.module }}" \
            --allow "$GITHUB_WORKSPACE/.github/vuln-allow.json" \
            < "$report"

  # ── EVERY OTHER LOCKFILE, AS A REPORT AND DELIBERATELY NOT AS A GATE ───────────────────────────
  #
  # osv-scanner covers what govulncheck cannot: pnpm-lock.yaml, uv.lock/requirements, and the Go
  # modules again — but with NO call graph, which is simultaneously its value and the reason it must
  # not gate. This repository resolves 566 npm and ~460 Go transitive packages. A tool with no
  # reachability filter over that is red more or less permanently, and the only two ways to green it
  # are a large ignore file or an unreviewed major-version sweep. Both are worse than the finding.
  #
  # AND A PERMANENTLY-RED GATE IS WORSE THAN NO GATE, because it trains people to scroll past the job
  # above — which IS call-graph aware and whose findings always mean something. This file's own header
  # makes that argument about govulncheck ("a vulnerable function nobody calls is noise, and a tool
  # that reports it teaches people to ignore the tool"); wiring this one as an equal gate contradicted
  # it, and it was wired that way first.
  #
  # `continue-on-error` HERE IS NOT `|| true`, and the difference is where the findings land. Every
  # advisory becomes a code-scanning alert with a severity, a fixed version and a history; it appears
  # on the pull request and in the Security tab, and it stays open until somebody closes it. What
  # RESOLVES them is `renovate.json`, which has `osvVulnerabilityAlerts` enabled and schedules
  # security PRs `at any time` rather than in the Monday window.
  #
  # THE SCANNER FAILING STILL FAILS THIS JOB. Only its FINDINGS are non-blocking; an exit code that
  # means "could not scan" is reported, because a reporter that did not run reports nothing. That is
  # the same distinction the govulncheck step draws for a killed process.
  osv:
    name: osv-scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: osv-scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@e92b5d07338d4f0ba0981dffed17c48976ca4730 # v2.2.3
        with:
          # `--recursive` so a nested manifest is not missed: this repo has five go.mod, several
          # package.json and the runtimes fixtures' uv.lock.
          #
          # `--skip-git` IS NOT A FLAG ANY MORE, and it was never silently ignored: osv-scanner
          # answers `Incorrect Usage: flag provided but not defined: -skip-git` and exits 127, so
          # this job scanned nothing at all on its first run. Scanning a git root is opt-IN now
          # (`--include-git-root`), which is what the old flag asked to avoid.
          #
          # NO GO CALL ANALYSIS, because osv-scanner implements it by running govulncheck — which the
          # jobs above already do properly, per module, with each module's own toolchain. Here it
          # instead dies on `workspaces/demo/actors/desync/go.mod`, a standalone module outside
          # `go.work`: "pattern ./...: directory prefix . does not contain modules listed in
          # go.work". It is also the step that needs ~5 GiB, which is a second reason not to run it
          # twice.
          scan-args: |-
            --recursive
            --no-call-analysis=go
            --format=sarif
            --output=/github/workspace/osv.sarif
            ./

      # A SCAN THAT FOUND NOTHING WRITES NOTHING, and `upload-sarif` fails on a missing file — which
      # would turn a clean result into a red job. An empty run is the honest encoding of "scanned,
      # found nothing".
      - name: a SARIF file exists either way
        run: |
          set -euo pipefail
          if [ ! -s osv.sarif ]; then
            printf '%s' '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > osv.sarif
            echo "osv-scanner produced no SARIF; uploading an empty run"
          fi
          python3 -c 'import json,sys; d=json.load(open("osv.sarif")); print("SARIF runs:", len(d.get("runs", [])), "results:", sum(len(r.get("results") or []) for r in d.get("runs", [])))'

      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: osv.sarif
          category: osv-scanner

  # ── THE WORKFLOWS THEMSELVES ────────────────────────────────────────────────────────────────────
  #
  # Six workflow files existed here with nothing auditing them, and they do privileged things: publish
  # images, sign with cosign, push to a wiki. zizmor finds template-injection via `${{ }}` in `run:`,
  # over-broad permissions, and unpinned Actions.
  #
  # THIS JOB WAS GREEN WITH NINE FINDINGS OPEN, two of them high (an Action pinned by tag in
  # release-please.yml and in wiki.yml). The action's default is `advanced-security: true`, which
  # runs zizmor with `--format=sarif`, and zizmor exits 0 in SARIF mode whatever it finds: the
  # findings went to the Security tab and the job could not fail. So there are two steps now, and
  # they are different things.
  #
  # THE REPORT uploads everything the regular persona finds, low severity included, so the Security
  # tab keeps the full picture and an alert closes when its finding is fixed.
  #
  # THE GATE re-runs the same pinned image without SARIF, at medium and above, and fails on a
  # finding with an annotation on the line. Low stays a report: `self-repository`-style advice is
  # worth reading and not worth blocking a merge on.
  #
  # PINNED TO A ZIZMOR VERSION, NOT `latest`. A new zizmor release adds audits, and with `latest`
  # every open pull request would go red the morning it shipped, for code none of them touched.
  # Since v0.4 the action pulls the image by a digest it ships for each version, so `1.30.1` names
  # one image and not a tag somebody can move. Raising it is a change that is green in its own PR.
  #
  # ONLINE AUDITS STAY ON, because `known-vulnerable-actions` is the half of this that behaves like
  # govulncheck: an advisory against an Action we pin should turn this red at night with nothing
  # changed here. `ref-version-mismatch` is online too, which is why every pin's comment names the
  # EXACT tag (`# v4.4.0`, not `# v4`): a moving major tag would flag every pin at once the day
  # upstream cut a patch release.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: zizmor (report, every severity, to the Security tab)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
      - name: zizmor (gate, medium and above)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
          min-severity: medium

  # ── CODEQL ──────────────────────────────────────────────────────────────────────────────────────
  #
  # Free on a public repository, which this one is (verified 2026-10-07 by an unauthenticated
  # `git ls-remote`). `actions` is in the matrix for the same reason zizmor is above: the workflows are
  # the privileged surface.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: matrix.language == 'go'
        with:
          go-version-file: cli/go.mod
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: /language:${{ matrix.language }}

  # ── SECRETS, AS A SECOND PAIR OF EYES ───────────────────────────────────────────────────────────
  #
  # GITHUB'S SECRET SCANNING AND PUSH PROTECTION ARE THE FIRST, AND THEY ARE ON. Both are repository
  # settings, which no workflow can turn on or even observe, so this comment is the only record of
  # them in the tree, and it has been wrong before: an earlier version said "enabled in repository
  # settings" while the API reported both `disabled`. The owner has since enabled them: on
  # 2026-10-10 `gh api repos/medmahmoudi26/kontra --jq .security_and_analysis` reported
  # `secret_scanning` and `secret_scanning_push_protection` as `enabled`, and that command is how to
  # check it again rather than trusting this paragraph.
  #
  # WHAT GITLEAKS ADDS ON TOP. Push protection refuses a PROVIDER pattern (an AWS key id, a GitHub
  # token) at push time, and secret scanning alerts on those across history after the fact. Neither
  # knows a credential no provider registered (a kontra service token, for instance), and GitHub's
  # generic half, `secret_scanning_non_provider_patterns` (private keys, connection strings, auth
  # headers), is off. gitleaks runs its generic and private-key rules as well as the provider ones,
  # and it is a CHECK on the pull request: a finding blocks the merge instead of opening an alert
  # once the commit is already public.
  #
  # An audit on 2026-10-07 found nothing leaked (`.env` gitignored, no key path ever committed, the
  # `AKIA…`/`dop_v1_…` literals in the tree being documentation examples and sequential fakes). This
  # job is what keeps that true rather than true-as-of-a-date.
  #
  # THE WHOLE HISTORY, ON EVERY EVENT. Everything reachable from dev's head is 231 commits with a
  # patch, which gitleaks read in 9 s on a dev box (the nightly run's 243, with `--all`, took 1.7 s on
  # a runner), so a pull request gets the same verdict as the nightly run rather than a scan of its
  # own commits only. `--log-opts=HEAD`, not gitleaks' default of `--all`: with `fetch-depth: 0` the
  # checkout holds every branch, and `--all` is why the nightly run of 2026-10-09 reported a fixture
  # that exists only on an unmerged branch. A check on dev must not be red for a commit dev does not
  # contain.
  #
  # THE BINARY, NOT gitleaks-action. v2 is a Node 20 action that downloads gitleaks (8.24.3 unless
  # told otherwise) with no checksum, and needs GITHUB_TOKEN in its environment to list a pull
  # request's commits. This is the same pinned release a person runs locally, checked against a
  # sha256 written here; raising the version means changing both lines, and a mismatch fails the
  # step before anything runs.
  #
  # WHAT IT IGNORES lives in two reviewed files: `.gitleaks.toml` (fixture paths only) and
  # `.gitleaksignore` (exact fingerprints for reviewed non-secrets). A finding prints redacted, with
  # the fingerprint to add once someone has confirmed it is not a credential — and rotated it if it is.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history; gitleaks reads every commit's patch, not the tree
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64.tar.gz
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git \
            --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore \
            --log-opts=HEAD \
            --redact --verbose --no-banner --no-color \
            .

  # ── ONE NUMBER THAT TRACKS ALL OF THE ABOVE ─────────────────────────────────────────────────────
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # v2.4.4, NOT v2.4.0: this is a Docker action, and v2.4.0's image is
      # `gcr.io/openssf/scorecard-action`, which now answers `denied: This API method requires
      # billing to be enabled` for OpenSSF's GCR project. The pull fails, so the job fails, and the
      # message is about somebody else's billing. v2.4.4 publishes to `ghcr.io/ossf/scorecard-action`.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: scorecard.sarif
