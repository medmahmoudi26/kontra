name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        postgres: ["16-alpine", "17-alpine"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: { POSTGRES_USER: kontra, POSTGRES_PASSWORD: kontra, POSTGRES_DB: kontra }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kontra" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      KONTRA_TEST_PG: postgres://kontra:kontra@localhost:5432/kontra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.7"
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-16
      - run: make check-specs
      - run: scripts/check_migrations.sh
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - run: make check-go
  # Integration tests (no -short) on Postgres 16 and 17: every package but test/e2e (`make test-integration`).
  # The pinned Temporal CLI (spec/relay.md §0: CLI 1.9.1, Server 1.32.0) is installed for the tests that
  # start a dev server; they read its path from KONTRA_TEMPORAL_CLI. Pebble likewise, KONTRA_TEST_PEBBLE. uv
  # and a2a-samples at the commit run.sh pins (KONTRA_A2A_SAMPLES) are for run.sh's guards
  # (examples/sellers/helloworld), which KONTRA_REQUIRE_HELLOWORLD keeps from skipping.
  integration:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        postgres: ["16-alpine", "17-alpine"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: { POSTGRES_USER: kontra, POSTGRES_PASSWORD: kontra, POSTGRES_DB: kontra }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kontra" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      KONTRA_TEST_PG: postgres://kontra:kontra@localhost:5432/kontra?sslmode=disable
      KONTRA_REQUIRE_HELLOWORLD: "1"
      KONTRA_REQUIRE_NODE24: "1"
      A2A_SAMPLES_PIN: 6603ba3f2c31a7ef33e70b9d8b5b5f8be42ac9a3
      TEMPORAL_CLI_VERSION: "1.9.1"
      TEMPORAL_CLI_ARCHIVE_SHA256: 09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5
      TEMPORAL_CLI_BINARY_SHA256: 712217694cac9f786a72d4b6c876cd15f3dcf1bf31434d9fed6af25242a327a0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      # The integration tests' stock MCP servers (D171): Node 22 for the 1.0.0 releases, Node 24 for
      # server-everything@2.0.0 (TestModernServerEverything).
      # server-everything@2.0.0 needs Node 24 (D171): installed first, its binary recorded as KONTRA_NODE24; then
      # Node 22, which stays on PATH for the 1.0.0 stock servers. KONTRA_REQUIRE_NODE24 fails, rather than skips,
      # the tests that need Node 24 without it, and an npm install that fails fails its test (no KONTRA_E2E_OFFLINE).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
      - name: Record Node 24 for server-everything@2.0.0
        run: |
          node --version | grep -q '^v24\.'
          echo "KONTRA_NODE24=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.7"
          python-version: "3.12"
      # The a2a-samples checkout at the commit examples/sellers/helloworld/run.sh pins (D154). With
      # KONTRA_REQUIRE_HELLOWORLD the helloworld tests fail, instead of skipping, without it, uv or a free
      # 127.0.0.1:9999 (M2 review): hello-world unmodified behind the tunnel is a hard rule of M2.
      - name: Fetch a2a-samples at the pinned commit
        run: |
          dir="$RUNNER_TEMP/a2a-samples"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/a2aproject/a2a-samples "$A2A_SAMPLES_PIN"
          git -C "$dir" -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "$A2A_SAMPLES_PIN"
          echo "KONTRA_A2A_SAMPLES=$dir" >> "$GITHUB_ENV"
      - name: Install the pinned Temporal CLI
        run: |
          archive="temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/$archive"
          echo "${TEMPORAL_CLI_ARCHIVE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/temporal"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/temporal" temporal
          echo "${TEMPORAL_CLI_BINARY_SHA256}  $RUNNER_TEMP/temporal/temporal" | sha256sum -c -
          "$RUNNER_TEMP/temporal/temporal" --version | grep -q 'Server 1\.32\.'
          echo "KONTRA_TEMPORAL_CLI=$RUNNER_TEMP/temporal/temporal" >> "$GITHUB_ENV"
      # The ACME test (internal/edge) issues a certificate from a local Pebble; built from the module
      # proxy at a pinned version (checked against sum.golang.org), its path in KONTRA_TEST_PEBBLE.
      - name: Install the pinned Pebble ACME test server
        run: |
          GOBIN="$RUNNER_TEMP/pebble" go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
          echo "KONTRA_TEST_PEBBLE=$RUNNER_TEMP/pebble/pebble" >> "$GITHUB_ENV"
      - run: make test-integration
  # The race detector over the same packages (make test-race: test-integration with -race), on Postgres 17:
  # the relay, the store, the lifecycle and the push worker are concurrent code.
  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: kontra, POSTGRES_PASSWORD: kontra, POSTGRES_DB: kontra }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kontra" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      KONTRA_TEST_PG: postgres://kontra:kontra@localhost:5432/kontra?sslmode=disable
      KONTRA_REQUIRE_NODE24: "1"
      TEMPORAL_CLI_VERSION: "1.9.1"
      TEMPORAL_CLI_ARCHIVE_SHA256: 09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5
      TEMPORAL_CLI_BINARY_SHA256: 712217694cac9f786a72d4b6c876cd15f3dcf1bf31434d9fed6af25242a327a0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      # As the integration job: Node 22 and Node 24 for the stock MCP servers (D171).
      # server-everything@2.0.0 needs Node 24 (D171): installed first, its binary recorded as KONTRA_NODE24; then
      # Node 22, which stays on PATH for the 1.0.0 stock servers. KONTRA_REQUIRE_NODE24 fails, rather than skips,
      # the tests that need Node 24 without it, and an npm install that fails fails its test (no KONTRA_E2E_OFFLINE).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
      - name: Record Node 24 for server-everything@2.0.0
        run: |
          node --version | grep -q '^v24\.'
          echo "KONTRA_NODE24=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
      - name: Install the pinned Temporal CLI
        run: |
          archive="temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/$archive"
          echo "${TEMPORAL_CLI_ARCHIVE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/temporal"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/temporal" temporal
          echo "${TEMPORAL_CLI_BINARY_SHA256}  $RUNNER_TEMP/temporal/temporal" | sha256sum -c -
          "$RUNNER_TEMP/temporal/temporal" --version | grep -q 'Server 1\.32\.'
          echo "KONTRA_TEMPORAL_CLI=$RUNNER_TEMP/temporal/temporal" >> "$GITHUB_ENV"
      - name: Install the pinned Pebble ACME test server
        run: |
          GOBIN="$RUNNER_TEMP/pebble" go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
          echo "KONTRA_TEST_PEBBLE=$RUNNER_TEMP/pebble/pebble" >> "$GITHUB_ENV"
      - run: make test-race
