# The console in a browser (`make test-browser`, test/browser): a gate in the local development profile, the example
# agents a2ui and ap2-merchant, test/browser/echoagent and server-filesystem@1.0.0 (examples/mcp/fs-stdio's lock)
# behind one `kontra connect` with no credential, a Temporal development server from the pinned CLI and Postgres 17;
# Playwright 1.64.0's Chromium drives the console's page. On every pull request that changes the console, the gate or
# these tests, nightly, and on demand.
name: browser
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "test/browser/**"
      - "examples/sellers/a2ui/**"
      - "examples/sellers/ap2-merchant/**"
      - "examples/mcp/fs-stdio/**"
      - "go.mod"
      - "go.sum"
      - "scripts/test_browser.sh"
      - ".github/workflows/browser.yml"
concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: kontra, POSTGRES_PASSWORD: kontra, POSTGRES_DB: kontra }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kontra" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      KONTRA_TEST_PG: postgres://kontra:kontra@localhost:5432/kontra?sslmode=disable
      TEMPORAL_CLI_VERSION: "1.9.1"
      TEMPORAL_CLI_ARCHIVE_SHA256: 09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5
      TEMPORAL_CLI_BINARY_SHA256: 712217694cac9f786a72d4b6c876cd15f3dcf1bf31434d9fed6af25242a327a0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.10"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.7"
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
      - name: Install the pinned Temporal CLI
        run: |
          archive="temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/$archive"
          echo "${TEMPORAL_CLI_ARCHIVE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/temporal"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/temporal" temporal
          echo "${TEMPORAL_CLI_BINARY_SHA256}  $RUNNER_TEMP/temporal/temporal" | sha256sum -c -
          "$RUNNER_TEMP/temporal/temporal" --version | grep -q 'Server 1\.32\.'
          echo "KONTRA_TEMPORAL_CLI=$RUNNER_TEMP/temporal/temporal" >> "$GITHUB_ENV"
      # Chromium itself comes from Playwright's CDN and is cached; its system packages come from apt, retried, and on a
      # failure the runner's mirror list (azure.archive.ubuntu.com first, which has failed to resolve for an hour at a
      # time) is replaced by Ubuntu's own archive.
      - name: Cache Playwright 1.64.0's Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-1.64.0-chromium-${{ runner.os }}-${{ runner.arch }}
      - name: Install Chromium for Playwright 1.64.0
        run: |
          pw() { uv run --no-project --with playwright==1.64.0 playwright "$@"; }
          pw install chromium
          for attempt in 1 2 3; do
            if pw install-deps chromium; then exit 0; fi
            echo "::warning::Chromium's system packages failed to install (attempt $attempt); using archive.ubuntu.com"
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            sleep $((attempt * 15))
          done
          exit 1
      - run: make test-browser ARGS="-v -rA"
        env:
          KONTRA_BROWSER_DIR: ${{ runner.temp }}/browser
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser
          path: |
            ${{ runner.temp }}/browser/*.log
            ${{ runner.temp }}/browser/*.png
