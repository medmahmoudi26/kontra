name: appliance

# THE FOUR PLATFORM ARTIFACT SETS (ADR 0031 §6, PRD decision 7, issue 17).
#
# The PRD calls this the riskiest work in the appliance and it is right, but not for the reason it
# looks. Nothing here is hard to write. What is hard is that every way of getting it wrong produces
# an artifact that builds cleanly, verifies cleanly against its own manifest, and fails on a
# machine none of us has — a darwin bundle full of linux `.so` files is internally consistent, and
# so is a bundle whose Node runtime is for the other architecture.
#
# So this workflow is arranged around claims that can only be checked by RUNNING something:
#
#   bundle       four native runners build their own platform, and each runs what it built
#   cross        one linux runner builds all four, and the digests must MATCH the native ones
#   clean        a runner with nothing but Go builds a bundle — the "buildable from GitHub" claim
#   reproducible the same commit built twice on one runner must produce one digest
#
# `cross` IS THE ONE WORTH EXPLAINING. It asserts that a bundle for a platform is a function of the
# platform and the commit, and of NOTHING about the machine that built it. That is a stronger claim
# than reproducibility on one host, and it is the one that makes a cross-build trustworthy: if the
# darwin/arm64 bundle a linux runner produced is byte-identical to the one an Apple Silicon runner
# produced, then the cross path is not a second-class path. If it ever stops being identical, the
# diff is a manifest field that has learned to depend on the host — which is exactly the bug that
# would otherwise be discovered by a user.
#
# NOT ON EVERY PUSH. A bundle build resolves a 330 MB dependency tree, compiles the orchestrator
# and writes a 120 MB archive, four times over. Running that on every PR would add half an hour to
# a typo fix and burn macOS runner minutes at ten times the linux rate. It runs when the things it
# is about change, and on demand.

on:
  push:
    branches: [main]
    paths:
      - "cli/appliance/**"
      - "cli/bundlecmd.go"
      - "cli/release.go"
      - "control/orchestrator/package.json"
      - "control/orchestrator/pnpm-lock.yaml"
      - ".github/workflows/appliance.yml"
  pull_request:
    paths:
      - "cli/appliance/**"
      - "cli/bundlecmd.go"
      - "cli/release.go"
      - "control/orchestrator/package.json"
      - "control/orchestrator/pnpm-lock.yaml"
      - ".github/workflows/appliance.yml"
  workflow_dispatch:

concurrency:
  group: appliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # The four, each on the machine it is for.
  #
  # RUNNER AVAILABILITY IS A REAL CONSTRAINT AND IT IS STATED HERE RATHER THAN DISCOVERED.
  # `ubuntu-24.04-arm` is GitHub-hosted arm64; it is free for public repositories and billable for
  # private ones. macOS runners are billable everywhere and cost ten linux minutes per minute. If a
  # runner label in this matrix is not available to this repository, the job fails with "no runner
  # matching the labels" — which is the right failure, because the alternative is a matrix that
  # silently ships three platforms out of four.
  bundle:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: darwin/amd64
            runner: macos-13
          - platform: darwin/arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      # GO AND NOTHING ELSE, DELIBERATELY, even here. No `setup-node`, no `pnpm/action-setup`: the
      # build fetches its own pinned Node and its own pinned pnpm (cli/appliance/bundle/toolchain.go),
      # and a workflow that installed them would be testing a machine no user has.
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/handler/go.mod
          cache-dependency-path: cli/go.sum

      - name: build the bundle for this platform
        working-directory: cli
        run: go run . bundle orchestrator --repo .. --platform ${{ matrix.platform }} --out "$RUNNER_TEMP/bundles"

      # THE SMOKE PATH, WHICH ONLY A NATIVE RUNNER CAN RUN. `bundle verify` re-derives every digest
      # the manifest claims from the archive — that much a cross-build could do anywhere. Unpacking
      # it and asking the carried runtime for its version is the part that needs the architecture:
      # it is the difference between "the bytes are what we recorded" and "these bytes execute".
      - name: verify the bundle against its own manifest
        working-directory: cli
        run: go run . bundle verify "$RUNNER_TEMP"/bundles/kontra-orchestrator-*.tar.gz

      - name: run what was built
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP"/bundles/kontra-orchestrator-*.tar.gz -C "$RUNNER_TEMP/unpacked"
          cd "$RUNNER_TEMP/unpacked"
          echo "carried runtime: $(node/bin/node --version)"
          # The three native addons, loaded by the runtime that will load them in production. A
          # `.node` for the wrong architecture unpacks perfectly and fails HERE, which is the whole
          # reason this step exists rather than trusting the header check the build already did.
          node/bin/node -e '
            const path = require("path");
            const base = path.join(process.cwd(), "orchestrator", "node_modules");
            for (const mod of ["@duckdb/node-api", "@temporalio/core-bridge", "@swc/core"]) {
              require(require.resolve(mod, { paths: [base] }));
              console.log("loaded", mod);
            }
          '

      # The digest, for the `compare` job. Not the 120 MB archive: what `cross` needs to know is
      # whether two builds agree, and that is 64 characters.
      - name: record the digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p digests
          slug=$(echo "${{ matrix.platform }}" | tr / -)
          cat "$RUNNER_TEMP"/bundles/kontra-orchestrator-*.tar.gz.sha256 | cut -d' ' -f1 > "digests/$slug.native"
          cp "$RUNNER_TEMP"/bundles/kontra-orchestrator-*.manifest.json "digests/$slug.manifest.json"
          cat "digests/$slug.native"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-native-${{ strategy.job-index }}
          path: digests/
          retention-days: 5

  # ---------------------------------------------------------------------------------------------
  # All four from one linux runner. The claim: a bundle is a function of its target and its commit.
  cross:
    name: cross-build all four on linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/handler/go.mod
          cache-dependency-path: cli/go.sum

      # SEQUENTIAL, NOT PARALLEL, and the build does it that way on purpose: a staged tree is
      # ~450 MB before compression, so four at once is 1.8 GB of working space plus four archives.
      # A GitHub runner has room for that and a developer's laptop is the machine this has to be
      # safe on.
      - name: build all four
        working-directory: cli
        run: go run . bundle orchestrator --repo .. --platform all --out "$RUNNER_TEMP/bundles"

      - name: every bundle verifies against its own manifest
        working-directory: cli
        run: |
          set -euo pipefail
          for b in "$RUNNER_TEMP"/bundles/kontra-orchestrator-*.tar.gz; do
            go run . bundle verify "$b"
          done

      - name: record the digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p digests
          for f in "$RUNNER_TEMP"/bundles/*.tar.gz.sha256; do
            base=$(basename "$f" .tar.gz.sha256)
            slug=$(echo "$base" | sed -E 's/^kontra-orchestrator-[0-9.]+-//')
            cut -d' ' -f1 "$f" > "digests/$slug.cross"
          done
          ls -la digests
          cat digests/*.cross

      - uses: actions/upload-artifact@v4
        with:
          name: digest-cross
          path: digests/
          retention-days: 5

  # ---------------------------------------------------------------------------------------------
  # THE COMPARISON, and the reason `cross` exists at all.
  compare:
    name: cross-built == natively built
    runs-on: ubuntu-latest
    needs: [bundle, cross]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: the same platform must produce the same bundle wherever it was built
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for native in digests/*.native; do
            slug=$(basename "$native" .native)
            cross="digests/$slug.cross"
            if [ ! -f "$cross" ]; then
              echo "::error::$slug was built natively and not cross-built; the matrix and Platforms() disagree"
              fail=1
              continue
            fi
            a=$(cat "$native"); b=$(cat "$cross")
            if [ "$a" != "$b" ]; then
              echo "::error::$slug differs by where it was built"
              echo "  native $a"
              echo "  cross  $b"
              echo "  A bundle must be a function of its target and its commit. A difference here is a"
              echo "  manifest field that has learned to depend on the build host — compare the two"
              echo "  manifest.json artifacts to find which one."
              fail=1
            else
              echo "$slug $a (native == cross)"
            fi
          done
          exit $fail

  # ---------------------------------------------------------------------------------------------
  # "BUILDABLE FROM GITHUB" AS A TEST RATHER THAN AN ASSERTION.
  #
  # This job is defined by what it does NOT do. No `setup-node`, no `pnpm/action-setup`, no
  # `pnpm install`, no `make`, no cached `node_modules` — nothing but the repository and a Go
  # toolchain, which is exactly what the PRD promises a contributor needs. Every dependency the
  # build has, it fetches and checksums itself.
  #
  # It exists because the promise was FALSE when issue 13 shipped and looked true: the build began
  # with `exec.LookPath("pnpm")` and a `stat` of `control/orchestrator/node_modules/typescript`, both of
  # which are always satisfied on a developer's machine and on any CI job that ran `pnpm install`
  # first. A claim about a clean machine can only be checked on a clean machine.
  clean-checkout:
    name: clean checkout, Go only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/handler/go.mod
          cache-dependency-path: cli/go.sum

      # THE PROOF THAT THE JOB IS WHAT IT SAYS. If a future edit adds a `setup-node` step above,
      # this fails and says so, rather than the job quietly becoming an ordinary build.
      # A HOSTED RUNNER IS A MACHINE WITH EVERYTHING, and the claim is about a machine with
      # nothing. `ubuntu-latest` pre-installs Node, npm and corepack, so a build that quietly fell
      # back to one of them would pass here and fail on a user's laptop — which is precisely the
      # failure this job exists to catch.
      #
      # DELETED, NOT TAKEN OFF PATH, for two reasons measured while writing this. `node` is on a
      # hosted runner in THREE places (`/usr/local/bin`, `/usr/bin`, `/bin`) and `command -v`
      # reports only the first, so a PATH scrub written the obvious way removes one of three and
      # reports success. And removing `/usr/bin` from PATH to catch the rest takes `git` and `tar`
      # with it, breaking later steps that have nothing to do with Node.
      #
      # It does not break the runner itself: `actions/*` steps are Node applications, and they run
      # on the runner's OWN bundled node under `externals/node20`, which was never on PATH. The two
      # `uses:` steps this job has are above this line regardless.
      - name: remove every Node and pnpm on this machine
        shell: bash
        run: |
          set -euo pipefail
          found=$(type -a -P node npm npx pnpm yarn corepack 2>/dev/null | sort -u || true)
          echo "removing:"
          echo "$found" | sed 's/^/  /'
          if [ -n "$found" ]; then
            echo "$found" | xargs -r sudo rm -f
          fi

      - name: there is genuinely no Node on this machine now
        shell: bash
        run: |
          set -euo pipefail
          # `hash -r` because bash CACHES command lookups and answers from that cache before it
          # consults PATH. Without it a scrubbed environment still reports that node is there —
          # measured, while writing this file.
          hash -r
          for tool in node npm pnpm corepack; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is still reachable at $(command -v $tool); this job is no longer testing a clean machine"
              exit 1
            fi
          done
          echo "no JavaScript toolchain on this machine; the build must supply its own"

      - name: build a bundle with nothing but Go
        working-directory: cli
        run: go run . bundle orchestrator --repo .. --out "$RUNNER_TEMP/bundles"

      - name: the binary it produced works
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          go run . bundle verify "$RUNNER_TEMP"/bundles/kontra-orchestrator-*.tar.gz
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP"/bundles/kontra-orchestrator-*.tar.gz -C "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/unpacked/node/bin/node" --version

  # ---------------------------------------------------------------------------------------------
  # Two builds of one commit on one machine. The claim the whole of orchestratorbundle.go is
  # arranged to deliver, and the one a single build cannot check.
  reproducible:
    name: built twice, one digest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/handler/go.mod
          cache-dependency-path: cli/go.sum

      - name: build, then build again
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          go run . bundle orchestrator --repo .. --out "$RUNNER_TEMP/first"
          go run . bundle orchestrator --repo .. --out "$RUNNER_TEMP/second"
          a=$(cut -d' ' -f1 "$RUNNER_TEMP"/first/*.tar.gz.sha256)
          b=$(cut -d' ' -f1 "$RUNNER_TEMP"/second/*.tar.gz.sha256)
          echo "first  $a"
          echo "second $b"
          if [ "$a" != "$b" ]; then
            echo "::error::two builds of the same commit produced different bundles"
            diff <(python3 -m json.tool "$RUNNER_TEMP"/first/*.manifest.json) \
                 <(python3 -m json.tool "$RUNNER_TEMP"/second/*.manifest.json) || true
            exit 1
          fi

  # ---------------------------------------------------------------------------------------------
  # A PIN THAT CANNOT BE HALF-BUMPED, checked rather than trusted.
  #
  # The acceptance criterion is "bumping a pinned version without its digests fails the build", and
  # the unit tests assert it against the table. This asserts it against the BUILD — that the
  # refusal happens before anything is fetched, which is the half of the property a table test
  # cannot see.
  half-bump:
    name: a version bumped without its digests fails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime/handler/go.mod
          cache-dependency-path: cli/go.sum

      - name: bump NodeVersion and nothing else
        run: |
          sed -i 's/const NodeVersion = "[^"]*"/const NodeVersion = "99.9.9"/' cli/appliance/bundle/pins.go
          grep -n 'const NodeVersion' cli/appliance/bundle/pins.go

      - name: the build must refuse, and say what to edit
        working-directory: cli
        shell: bash
        run: |
          set -uo pipefail
          out=$(go run . bundle orchestrator --repo .. --out "$RUNNER_TEMP/nope" 2>&1) && status=0 || status=$?
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::a Node version with no pinned digests built a bundle out of unverified bytes"
            exit 1
          fi
          for want in 99.9.9 nodeDigests SHASUMS256.txt; do
            case "$out" in
              *"$want"*) ;;
              *) echo "::error::the refusal does not mention '$want', so it does not say what to edit"; exit 1 ;;
            esac
          done
