syntax = "proto3";

package kontra.v1;

option go_package = "github.com/medmahmoudi26/kontra/runtime/handler/_gen/kontra/v1;kontrav1";

import "google/protobuf/struct.proto";

// The TWO genuinely cross-language boundary types. Three seams write their own copy: the
// TS orchestrator (control/orchestrator/src/workflows/interpreter.ts), the Python caller SDK
// (sdk/python/actorkit/workflows.py) and the Go handler that decodes them
// (runtime/handler/internal/wire/wire.go). Per ADR 0002 the payload stays JSON on the wire — this
// proto is the single TYPE DEFINITION those seams are checked against, NOT a binary
// converter: TS imports the generated interface, while the Python TypedDict
// (sdk/python/actorkit/contract.py) and the Go struct stay hand-written under
// field-congruence tests — tests/test_workflows_client.py,
// runtime/handler/internal/wire/wire_congruence_test.go, and control/orchestrator/entry.contract.ts,
// which is a compile-time guard rather than a test run.
//
// THIS is the dispatch contract actually in use: an EntryInput is the argument to the one
// Nexus operation every actor serves, kontra.actor:run (ADR 0001), whose backing workflow
// is the handler's RunWorkflow. Contrast run.proto's RunEnvelope — the FUTURE envelope that
// will wrap an EntryInput-equivalent once dispatch goes cross-namespace
// (namespace-per-author); unused today.
//
// Deliberately NOT modeled here (ADR 0002 — the shared proto carries only the real
// cross-language surface): the TS-internal GraphSpec/NodeSpec, which never crosses the wire.

// A bare claim-check ref: {sha256, size, meta}. The content-addressed shape the
// codec/blob layer trades in. Shared by the TS BareRef / ClaimCheckRef /
// NodeResultRef.claimcheck arm and the handler's blob activities — kontra.store_blob
// returns it, kontra.fetch_blob accepts it (runtime/handler/activity.go), and a Python caller
// dereferences a result through the same pair.
message BareRef {
  string sha256 = 1;
  uint64 size = 2;                  // byte length of json.dumps(units)
  map<string, string> meta = 3;     // codec provenance; {} today
}

// Input to the kontra.actor:run operation — the ONE input type the orchestrator and
// both SDKs serialize. The TS interpreter sets exactly these fields, and the Python
// TypedDict is exactly this set (a field-congruence test asserts it). The actor runs
// ONE batch per call (ADR 0012, ADR 0023 §2): the caller splits a large input into
// multiple calls, so no sharding knob rides here — `session_id` names the scope a call
// belongs to, it does not divide one.
message EntryInput {
  // The whole ActorInput batch, inline (the CLI path) — arbitrary JSON values,
  // hence Value. Exactly one of `units` / `input_ref` carries the batch.
  repeated google.protobuf.Value units = 1;
  // The batch as a CAS ref the Python fetch_blob materializes (refs-as-currency).
  BareRef input_ref = 2;
  // Removed (ADR 0012 — actor runs one batch, the dispatcher shards): 3 output_uri,
  // 4 parallel_sessions, 5 chunk_size, 8 tenant. Reserved so the numbers/names never reuse.
  // NB: `parallel_sessions` lives on only as the actor host's cap on concurrent live sessions
  // (KONTRA_MAX_PARALLEL_SESSIONS) — deployment config on the worker, deliberately NOT a
  // dispatch-contract field, so the reservation stands.
  reserved 3, 4, 5, 8;
  reserved "output_uri", "parallel_sessions", "chunk_size", "tenant";
  // When true the actor returns a BareRef instead of a raw list, so the
  // interpreter stays ref-only.
  bool return_ref = 6;
  // Run lineage the orchestrator stamps onto every node's child run (all empty on the
  // CLI/back-compat path). `run_id` + `idempotency_key` are surfaced to the author as
  // `self.run_id` / `self.idempotency_key`. Plain strings — "" means unset.
  string run_id = 7;
  string idempotency_key = 9;
  // Which graph node this actor run serves (mirrors run.proto's node_id lineage). The
  // Nexus dispatch path folds it into the backing workflow id (`act-{name}-{run_id}-{node_id}`)
  // so two nodes of the SAME actor in one graph get distinct, deterministic runs. "" on the
  // DIY/CLI path (single actor, no graph).
  string node_id = 12;
  // Content-pinned actor identity (ADR 0011): the OCI image digest this node was
  // designed against, stamped by the orchestrator from the catalog. The worker
  // serving (name, version) self-verifies its own running digest against this at
  // session start and fails fast (non-retryable) on drift. "" = unpinned (CLI/dev path).
  string expected_digest = 10;
  // Run-wide config the caller sets, reaching the author as `self.params` — and what any
  // param-bound knob the author declares resolves against. Arbitrary JSON object; {} = none.
  google.protobuf.Struct params = 11;
  // Which Method of the actor this dispatch calls (ADR 0023 §5). An actor declares as many
  // Methods as it has jobs and the caller names one; the callee resolves the name per batch,
  // which is what lets ONE loaded session serve several. "" = unnamed, which an actor with a
  // single Method accepts and an actor with several refuses rather than taking declaration
  // order.
  string method = 13;
  // Which Session this dispatch belongs to (ADR 0023 §4, §6). A caller opens a Session, calls
  // its Methods, and closes it; the id is what binds those calls to the ONE activated actor,
  // so it rides EVERY dispatch inside the scope and not only the one that opened it. "" = no
  // scope was opened, the pre-v2 path where each dispatch stands alone.
  string session_id = 14;
}
