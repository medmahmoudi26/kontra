syntax = "proto3";

package kontra.v1;

option go_package = "github.com/medmahmoudi26/kontra/runtime/handler/_gen/kontra/v1;kontrav1";

import "temporal/v1/temporal.proto";
import "kontra/v1/entry.proto"; // EntryInput, BareRef

// The canonical dispatch contract as a Temporal **Nexus** service. Dispatching an actor
// over one batch IS a Nexus workflow-run operation (`kontra.actor:run`) — the ONE op the
// TS orchestrator already calls (control/orchestrator/src/workflows/nexusService.ts). Its typed
// client + worker + Nexus wiring are generated by protoc-gen-go-temporal from this file;
// the backing "run" workflow is hand-written in the Go Nexus handler (it schedules the batch
// as a RunBatch activity on the actor's own task queue and returns a claim-check BareRef).
//
// Wire stays JSON (ADR 0002): EntryInput/BareRef are reused verbatim from entry.proto, so
// the orchestrator dispatches unchanged. The service/op names below MUST match the frozen
// cross-language contract (identity.go / nexusService.ts): service "kontra.actor", op "run".
service ActorService {
  option (temporal.v1.service) = {
    // Placeholder; the real queue is per-actor ({name}-{version}) and is set at worker
    // registration from actor.json identity — the generated client honours whatever queue
    // the worker serves. Kept non-empty because the option requires it.
    task_queue: "kontra-actor"
    nexus: {
      enabled: true
      name: "kontra.actor" // the Nexus SERVICE name the orchestrator's endpoint targets
    }
  };

  // kontra.actor:run — the dispatch op. EntryInput in, BareRef out (return_ref path).
  rpc Run(EntryInput) returns (BareRef) {
    option (temporal.v1.workflow) = {
      // Deterministic backing id per run: idempotency_key, else run_id, else "run".
      //
      // NOT AUTHORITATIVE, and deliberately so. The handler derives the real id itself
      // (handler/nexus.go backingWorkflowID) as `actor-{KONTRA_ACTOR_NAME}-{base}` — it reads
      // the actor name from the environment, which a generated template cannot do. So an id
      // minted from THIS expression is missing the actor-name segment and will not match a
      // workflow the handler started: a caller using the generated ActorServiceClient's
      // GetRun/Cancel/Terminate would silently fail to find it.
      //
      // Nothing calls that client today (the orchestrator dispatches over raw Nexus), which is
      // why this is latent rather than broken. The prefix is kept in step with the handler's
      // anyway, so the ids at least name the same family.
      id: 'actor-${!idempotency_key.or(run_id).or("run")}'
      nexus: {
        name: "run" // the operation name the orchestrator calls (executeOperation('run'))
      }
    };
  }
}
