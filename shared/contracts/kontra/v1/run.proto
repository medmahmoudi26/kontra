syntax = "proto3";

package kontra.v1;

option go_package = "github.com/medmahmoudi26/kontra/runtime/handler/_gen/kontra/v1;kontrav1";

// FUTURE / NOT WIRED — the planned cross-namespace dispatch envelope.
//
// >>> What dispatch ACTUALLY does today: the TS interpreter starts the Python
// >>> EntryWorkflow as a Temporal CHILD WORKFLOW (executeChild('run', [EntryInput]),
// >>> see control/orchestrator/src/workflows/interpreter.ts) passing `EntryInput` (entry.proto).
// >>> There is NO Nexus operation and NO RunEnvelope on any wire. Nothing references
// >>> this message in code.
//
// Why it still exists: child workflows can't cross Temporal namespaces, but the
// namespace-per-author direction (ADR 0001) requires the orchestrator (its own
// namespace) to dispatch into each AUTHOR's namespace — which needs a Nexus
// operation. RunEnvelope is that operation's input: it WRAPS what EntryInput carries
// today and adds the routing/dispatch metadata a cross-namespace call needs. It
// becomes real only when namespace-per-author + Nexus are built; until then it is a
// design target, not a contract in use.
//
// Per-record actor I/O is JSON Schema, carried in the actor descriptor and gated at
// registration (ADR 0027) — so `payload` is OPAQUE bytes, never a typed per-actor
// message. The proto carries the envelope + metadata; the codec offloads large payloads
// transparently below this layer.

message RunEnvelope {
  // Identity / routing. version is IMMUTABLE — a schema change MUST bump it, and
  // build refuses to overwrite an existing (name, version) (ADR 0004, content-
  // pinned identity). Resolves the {name}-{version} queue / Nexus endpoint.
  Actor actor = 1;

  // Lineage. run_id is SERVER-MINTED, immutable, and UNIQUE PER EXECUTION — minted
  // at POST /api/runs, never accepted from the client, and distinct from the user-
  // facing graph label (ADR 0006). It is the lineage key threaded into child
  // workflow ids, codec provenance, and the future Iceberg partition columns.
  string run_id = 2;
  string node_id = 3;   // which graph node produced this dispatch

  // Tenancy. Selects the Temporal namespace (namespace-per-author in prod) and
  // scopes the CAS key. Tenant-free today (cas/<sha[:2]>/<sha>); becomes
  // cas/{tenant}/<sha[:2]>/<sha> under namespace-per-author. Present NOW as
  // "default" so adding real tenants later needs no history migration (ADR 0001).
  string tenant = 4;

  // Idempotency. A stable (run_id, node_id, generation, unit-index) tuple the SDK
  // exposes to the author as self.idempotency_key, so at-least-once retries and the
  // Iceberg append dedup instead of double-firing side effects.
  string idempotency_key = 5;

  // The batch payload: OPAQUE. JSON-encoded units, or a claim-check ref the codec
  // rehydrates transparently. The proto never sees per-actor shape.
  bytes payload = 6;

  // Run-wide config (the params block), JSON-encoded, validated against the params
  // JSON Schema. NON-SECRET only — secrets travel as a {secret_ref} resolved out of
  // band at load time, never inline (params ride Temporal history in plaintext
  // today; this is the split the review flagged).
  bytes params = 7;

  // Dispatch knobs — the dispatcher's concern, not a workflow constant.
  DispatchOptions dispatch = 8;
}

message Actor {
  string name = 1;
  string version = 2;   // immutable; bump on any input/output/params schema change
}

message DispatchOptions {
  uint32 chunk_size = 1;            // units per chunk (one chunk == one session)
  uint32 parallel_sessions = 2;     // max concurrent sessions
  uint64 schedule_to_close_ms = 3;  // the Nexus operation deadline (caller-set; must
                                    // exceed the actor's worst-case run, not a hardcoded constant)
}
