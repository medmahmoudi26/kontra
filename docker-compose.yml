# kontra local cluster (ADR 0047). THIS FILE IS THE WHOLE INSTALL:
#
#   curl -O https://raw.githubusercontent.com/medmahmoudi26/kontra/dev/docker-compose.yml
#   docker compose up -d --wait
#   docker compose logs cli | grep -A4 'console login'
#
# No clone, no build, no binary, and NO `.env` — every `${…:-default}` in here resolves to something
# a stranger's Docker can pull. `.env.quickstart` is the second curl only if you want to move a port,
# change the bind address, or set the admin password to something other than `changeme`.
#
# ── WHAT IT TOOK TO BE ONE FILE, so nobody puts it back ─────────────────────────────────────────
#
# Three host paths used to be bind-mounted in here, and Docker does not fail on a bind-mount source
# that does not exist — it silently creates a DIRECTORY there. So each one was an install that came
# up looking healthy and was broken somewhere it did not mention:
#
#   postgres-init.sh   -> now a compose `configs:` entry with inline `content:` (see the bottom of
#                         this file). Six lines of SQL, nothing imports it.
#   logship.sh         -> now baked into `kontra-logship` (control/images/Dockerfile.logship). It is
#   logline.py            an image and not a `configs:` entry because `tests/test_logline.py` loads
#                         the parser BY PATH, and it is a file in the first place because it used to
#                         be a heredoc where nothing could import it.
#
# `workspaces/` is the one host path left, and it does not need to exist: the `cli` service runs
# `kontra workspace seed` on boot, so an empty directory becomes a seeded one.
#
# YOUR CODE LIVES IN `workspaces/` BESIDE THIS FILE, and that is the whole registration: a folder
# under `<workspace>/actors/` or `<workspace>/workflows/` is served, and nothing else is recorded
# anywhere. Each child of `workspaces/` is one workspace and `.current` picks it; the console's
# top-right selector writes that file.
#
# It is deliberately NOT hidden and NOT a docker volume: you edit this code in your editor, so it
# has to be a directory you can see from the place you ran `docker compose up`.
#
# Postgres, Temporal, SeaweedFS, Redis, the registry, and the kontra processes are separate
# services. The appliance (`kontra up` as one process) is not a supported install path.
#
# ── THE DOCKER SOCKET ──────────────────────────────────────────────────────────────────────────
#
# `orchestrator-infra` and `cli` (workspace watch) mount `/var/run/docker.sock`. A local Fleet's
# Warden containers (created by Pulumi `dockerFleet`) mount it too. That is host-level Docker
# authority: anything with the socket can start privileged containers. Acceptable for a
# single-operator laptop. Not tenant isolation. Do not expose this stack as a shared service.
#
# ── LOOPBACK IS THE SECURITY CONTROL ───────────────────────────────────────────────────────────
#
# Every published port binds `${KONTRA_BIND}`, default `127.0.0.1`. A published Docker port is
# DNATed in PREROUTING and accepted in FORWARD — a host firewall does not protect it. Do not
# change KONTRA_BIND to 0.0.0.0 to "make it work from another machine".

name: ${COMPOSE_PROJECT_NAME:-kontra}

# ${PWD} is where compose was run. Blank KONTRA_WORKSPACES puts the workspace right there, which
# is where somebody who just ran the install commands will look for it.
#
# MOUNTED AT THE SAME PATH INSIDE AND OUT, because the control plane hands paths to the CLI and to
# tmux panes; a workspace at a different path in the container turns every one of those into a
# directory nobody can find.
x-workspaces: &workspaces ${KONTRA_WORKSPACES:-${PWD}/workspaces}

x-orchestrator-env: &orchestrator-env
  KONTRA_HOME: /var/lib/kontra
  KONTRA_ADDRESS: temporal:7233
  KONTRA_NAMESPACE: ${KONTRA_NAMESPACE:-default}
  KONTRA_S3_ENDPOINT: http://seaweed:8333
  KONTRA_S3_BUCKET: kontra
  KONTRA_S3_REGION: us-east-1
  KONTRA_S3_ACCESS_KEY: kontra
  KONTRA_S3_SECRET_KEY: kontra
  KONTRA_REDIS_HOST: redis:6379
  # NOT `127.0.0.1:5000`, AND THE REASON IS WHICH WORKER READS IT.
  #
  # `resolveBundle` — the activity that turns `actor@version` into a layer digest — runs on the
  # `kontra-datasets` queue, which this role serves, NOT on the infra queue that converges the
  # stack. So pointing only orchestrator-infra at a reachable registry fixed nothing: the resolve
  # still ran here, `fetch('http://127.0.0.1:5000/...')` hit this container's own loopback, threw,
  # and the function fell through to its container-image branch and returned `bundleSha: ''`. The
  # converge then died a minute later with `machine actor bundleSha="" is not safe to place on a
  # Machine` — a message about a symptom two hops from the cause. Measured on campaign-1790559287.
  #
  # The VPC address is reachable from every container AND from a Droplet in the Controller's VPC,
  # so one value is correct for both the manifest read here and the blob URL a Machine is handed.
  KONTRA_REGISTRY: ${KONTRA_REGISTRY:-127.0.0.1:${KONTRA_REGISTRY_PORT:-5000}}
  KONTRA_ORCHESTRATOR_URL: http://orchestrator-api:8088
  KONTRA_CONTROLLER: orchestrator-api
  KONTRA_DUCKLAKE_CATALOG: postgres:dbname=kontra_ducklake host=postgres user=kontra password=kontra
  # WHERE OPERATOR SQL IS EXECUTED, now that it is not executed here. The orchestrator still owns
  # the surface — the bearer check, `readonlySql.ts` validation, and the `harden`/`scope`
  # constraints all stay on this side — and hands the validated statement to Porter over the
  # compose network. Unset falls back to the in-process DuckDB, so an install without the Porter
  # service still answers queries, just with the old per-request engine and the 500-row cap.
  KONTRA_PORTER_URL: ${KONTRA_PORTER_URL:-grpc+tcp://porter:32010}
  KONTRA_MATERIALIZATION_DB: postgres://kontra:kontra@postgres:5432/kontra_ducklake
  # DuckDB's ceiling for the MATERIALIZER. The default is 256MB (data/parquet.ts), and a crawl
  # batch carrying full HTTP header JSON does not fit in it:
  #
  #   Out of Memory Error: could not allocate block of size 720.0 KiB (243.9 MiB/244.1 MiB used)
  #
  # observed on `publishBatch` ATTEMPT 55 — the crawl had already succeeded, and it was the
  # publish that could not land. The failure mode is nasty because the run stays RUNNING and the
  # worker goes silent, which reads as a slow crawl rather than a stuck write.
  #
  # 512MB against ~1GB free on this host. Raise with care: the comment on `memoryLimit` is right
  # that this is NOT an RSS cap — the cgroup is — so setting it above what the container can
  # actually get trades a clean DuckDB error for the OOM killer taking the whole API.
  KONTRA_DUCKDB_MEMORY_LIMIT: ${KONTRA_DUCKDB_MEMORY_LIMIT:-512MB}
  # WHERE DUCKDB SPILLS. Without it the `SET temp_directory` in `parquet.ts` is never issued, and
  # "nowhere to spill" does not degrade gracefully — DuckDB fails outright the moment a query needs
  # more than `memory_limit`. `/var/lib/kontra` is mounted read-only here, so this has to be a
  # writable path inside the container; `max_temp_directory_size` still bounds what lands in it.
  KONTRA_DUCKDB_TEMP_DIR: ${KONTRA_DUCKDB_TEMP_DIR:-/tmp/duckdb-spill}
  KONTRA_WORKSPACES: *workspaces
  # ── THE DEFAULTS NAME A REGISTRY, AND THAT IS WHAT MAKES THE INSTALL ONE `curl` ────────────────
  #
  # These used to default to `kontra:latest` and `kontra-host:1` — bare local tags that resolve on
  # exactly one machine: one that has already run `make image` and three hand-typed `docker build`s.
  # For anybody else the failure was `pull access denied for kontra-orchestrator, repository does not
  # exist or may require 'docker login'`, which names neither the real cause nor the fix.
  #
  # Every `${KONTRA_*_IMAGE:-…}` default in this file is therefore a fully-qualified, pullable
  # reference, which means the file works with NO `.env` beside it. `.env.quickstart` is knobs
  # (bind address, ports, password), not a prerequisite.
  #
  # `:dev` FLOATS, AND `publish.yml` SAYS FLOATING TAGS ARE A HAZARD. Both are true and they are
  # about different audiences. That comment — "a floating tag in a registry is a thing an install can
  # resolve by accident, and what this install resolves is a digest" — is about a RELEASE, where
  # `images.env` pins every reference to `repo@sha256:…` and reproducibility is the promise. The
  # quickstart's promise is the opposite one: `docker compose pull && up -d` should get you the
  # current thing. A digest here would mean editing this file to take a fix.
  #
  # AND THE NAME IS WHAT `publish.yml` READS OUT OF THESE LINES, not the tag and not the registry.
  # Its `plan` job greps `${KONTRA_*_IMAGE:-…}` here to learn which images it owns, strips the
  # registry and the tag, and maps the bare name to a Dockerfile. So renaming an image is a change to
  # this line; retagging or re-homing one is not.
  KONTRA_IMAGE: ${KONTRA_IMAGE:-ghcr.io/medmahmoudi26/kontra:dev}
  KONTRA_HOST_IMAGE: ${KONTRA_HOST_IMAGE:-ghcr.io/medmahmoudi26/kontra-host:dev}
  # Both addresses: `127.0.0.1:5000` is how this host's own tooling spells the registry, and the
  # VPC address is how a fleet Machine does. A Bundle trusted under one spelling and fetched under
  # the other is a Bundle that is refused on the Machine, after the provision has been paid for.
  KONTRA_TRUST_REGISTRIES: ${KONTRA_TRUST_REGISTRIES:-127.0.0.1:${KONTRA_REGISTRY_PORT:-5000}}
  KONTRA_TRUST_UNSIGNED: ${KONTRA_TRUST_UNSIGNED:-127.0.0.1:${KONTRA_REGISTRY_PORT:-5000}}
  # THE READ TOKEN FOR THE TWO SURFACES THAT READ A RUN'S CONTENT: the query workbench and the logs
  # proxy (ADR 0050 §1, issue #17). Both are `checkBearer` — FAIL-CLOSED — so with this unset they
  # answer 503 and say which variable turns them on, rather than opening. That is why it is passed
  # through EMPTY by default instead of being omitted: an operator who sets it in `.env` should not
  # also have to discover that no `environment:` block carried it, which is the exact trap
  # `.env.quickstart` records for the five variables that used to sit there reaching nothing.
  KONTRA_EXPLORE_TOKEN: ${KONTRA_EXPLORE_TOKEN:-}
  # Where the logs proxy reads from. In-compose and unpublished by default; a deployment with its
  # own OpenTelemetry-compatible store re-points this one variable (ADR 0050 §1).
  KONTRA_LOGS_URL: ${KONTRA_LOGS_URL:-http://victorialogs:9428}
  # ── WHETHER RETENTION ACTUALLY DELETES ANYTHING ──────────────────────────────────────────────
  #
  # OFF BY DEFAULT, AND THAT DEFAULT FILLS DISKS. `sweepDatasetsWorkflow` (ADR 0029 §5) is armed
  # hourly at boot by `retention.ts`, but a firing with no mode resolves this variable on the worker
  # holding the lake, and `retentionCollects()` treats anything but an affirmative as a DRY RUN —
  # "the failure direction that keeps data". So an installation that never sets it sweeps every
  # hour, reports what it would delete, and deletes nothing, for its whole life.
  #
  # MEASURED, on this box, 2026-09-24: SeaweedFS full at 154 GB. `/vol/status` reported 0.1% of
  # bytes deleted — so a vacuum would reclaim nothing, because NOTHING HAS EVER BEEN COLLECTED. The
  # visible symptom was not a disk alert: actor runs failed with `CancelledError: Activity
  # cancelled`, because `put_subunit` blocked on an object store that could not allocate, missed its
  # heartbeat, and was retried forever. `cli/appliance/bundle/hydrate.go` warns about exactly this
  # shape — "a full disk on this system does not fail loudly".
  #
  # PASSED THROUGH EMPTY RATHER THAN OMITTED, for the reason `KONTRA_EXPLORE_TOKEN` above records:
  # an operator who sets it in `.env` should not then have to discover that no `environment:` block
  # carried it. Setting it to `1`/`true`/`yes`/`on` is what makes the sweep collect — a deliberate
  # act, because it deletes Datasets past their retention.
  KONTRA_RETENTION_COLLECT: ${KONTRA_RETENTION_COLLECT:-}

  # ── HOW LONG A RUN'S RAW UNIT BLOBS ARE KEPT ───────────────────────────────────────────────────
  #
  # `units/` is one object per pushed record — the raw working, not the answer. MEASURED on this box
  # 2026-09-24: 254,801 objects, 7.56 GiB, 99.1% of the entire object store, all of it written in the
  # preceding SIX DAYS, and nothing had ever collected any of it because `sweepUnits` was referenced
  # by four comments and a wiki table and did not exist.
  #
  # THE LIBRARY DEFAULT IS 90 DAYS AND IS WRONG FOR THIS DEPLOYMENT. At ~1.25 GiB/day that is ~112
  # GiB of unit blobs before the first object is ever eligible, on a 154 GB disk. The default stays
  # at the documented number because silently disagreeing with the wiki is worse; the number that
  # applies HERE is set here.
  #
  # SEVEN DAYS is a week of raw evidence for any run somebody wants to re-examine, and it is well
  # past the point where a run's rows are in the lake. A run still materializing keeps its blobs
  # whatever this says — `resolveBatch` reads them on retry, so the sweep will not touch a run whose
  # ledger is not `complete`.
  #
  # ── THIS DRIVES TWO MECHANISMS, AND THE STORE'S IS THE REAL ONE ────────────────────────────────
  #
  #   1. AN S3 LIFECYCLE RULE on `units/`, written idempotently at bucket-ensure
  #      (`codec/objectStore.ts:ensureLifecycle`). This is what actually keeps the prefix bounded,
  #      and it costs no runtime: SeaweedFS turns it into a filer path TTL, segregates those writes
  #      into their own volumes (verified: `ttl:260`), and unlinks each volume WHOLE when it expires.
  #   2. `sweepUnits`, the in-repo backstop, for the objects written BEFORE the rule existed (a filer
  #      TTL is stamped at write time, so the 254,801 already here carry `ttlSec: 0` forever) and for
  #      stores with no lifecycle support.
  #
  # THE STORE'S VERSION IS NOT MERELY CHEAPER, IT IS THE ONE THAT FREES DISK. Deleting objects
  # individually marks them dead inside a volume and the `.dat` file does not shrink — measured here,
  # `deleted_bytes: 4,326,291` against `total size: 8,409,664,672`, 0.05% and never reclaimed.
  # Recovering that needs `volume.vacuum`, which COPIES each volume and therefore needs as much free
  # disk as the volume it rewrites, on the disk that is already full. An expired TTL volume is just
  # unlinked. It is also the only thing that addresses the real amplification on this box: ~1 GiB of
  # live objects sitting in 26 GiB of preallocated volumes that never shrink.
  #
  # DO NOT SET THIS BELOW 1. Sub-day values are refused rather than floored, because S3 expiry is
  # day-granular and `0.5` would floor to 0 — "expire everything now", written by somebody who meant
  # the opposite. The window is also the only thing protecting a materialization retry, which is
  # bounded in HOURS by its Temporal retry policy: days beats hours, and nothing checks the ledger.
  KONTRA_UNITS_RETENTION_DAYS: ${KONTRA_UNITS_RETENTION_DAYS:-7}

# ── THERE IS NO SHARED TMUX SOCKET, AND ITS REMOVAL WAS A SECURITY FIX ─────────────────────────
#
# This used to be `x-tmux-socket`, a volume both orchestrator containers mounted so they could
# speak to ONE tmux server. api started it, infra was a client, and the Monitor needed both halves
# to agree about which sessions existed.
#
# A tmux client can run `tmux new-session -d '<anything>'`, and that command executes inside
# whichever container is running the SERVER. Ownership of the server was decided by a race, not by
# policy: restarting api killed it and left the socket file behind, and the next `new-session` —
# from either container — started a fresh server over it. So the writable rendezvous between the
# HTTP-facing container and the one holding the read-write Docker socket was a cross-container
# code-execution path that nothing enforced the direction of.
#
# The Monitor is gone, so the socket is gone with it. Do not reintroduce a shared writable socket
# between these two containers; the role split below is the privilege boundary.

x-kontra-home: &kontra-home
  - kontra-home:/var/lib/kontra
  - ${KONTRA_WORKSPACES:-${PWD}/workspaces}:${KONTRA_WORKSPACES:-${PWD}/workspaces}

services:
  postgres:
    image: postgres:16-alpine
    container_name: kontra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kontra
      POSTGRES_PASSWORD: kontra
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # A COMPOSE CONFIG, NOT A BIND MOUNT, so this file needs nothing beside it.
    #
    # It used to be `./control/images/postgres-init.sh:…:ro`, and that one line is what made the
    # install a clone. Docker does not fail on a bind-mount source that does not exist — it creates
    # a DIRECTORY there. So a curl'd compose file got an empty directory mounted at
    # `/docker-entrypoint-initdb.d/01-ducklake.sh`, postgres tried to source it, and the DuckLake
    # catalog database was never created. Every Dataset write then failed against a database that
    # did not exist, several services deep from anything that mentioned postgres.
    #
    # The one-shot beside `temporal` already made this argument (see `temporal-dynamicconfig`:
    # "written by a one-shot so the install does not need a host-side config file"). This is the
    # same rule applied to the service that needed it most.
    configs:
      - source: ducklake-init
        target: /docker-entrypoint-initdb.d/01-ducklake.sh
        # THE EXEC BIT IS LOAD-BEARING, AND IT IS NOT ABOUT THIS SCRIPT'S NEEDS.
        #
        # This was 0444 first, on the reasoning that postgres's entrypoint `.`-sources a `*.sh` it
        # cannot execute (`docker-entrypoint.sh:183`, `if [ -x "$f" ]; then "$f"; else . "$f"; fi`),
        # so the exec bit was decoration. Sourcing works. What it also does is run this script's
        # `set -eu` IN THE ENTRYPOINT'S OWN SHELL — and that shell is deliberately `set -Eeo
        # pipefail` with no `-u`, carrying the upstream comment "TODO swap to -Eeuo pipefail above
        # (after handling all potentially-unset variables)".
        #
        # So `-u` leaks past `docker_process_init_files` into `docker_temp_server_stop`, `unset
        # PGPASSWORD` and the rest of first boot. MEASURED both ways with a second always-sourced
        # probe script reading `$-`: at 0444 `-u` is set in the entrypoint shell afterwards, at 0555
        # it is clean. On postgres:16-alpine today neither mode fails — both reach "init process
        # complete" with `kontra_ducklake` present — so this is latent, with two triggers: the bump
        # that upstream TODO promises, and anybody adding a second init script. Both produce a first
        # boot that dies AFTER the cluster exists, which is the worst shape this can take.
        #
        # 0555 also makes the two harnesses take the same branch. `control/pulumi/Pulumi.yaml:513`
        # uploads it `permissions: "0755"` and had already worked this out; compose sourcing while
        # Pulumi executed was two installs running different halves of somebody else's entrypoint.
        mode: 0555
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # `-d postgres`, and the missing word was not cosmetic. `pg_isready -U kontra` with no
      # database asks for one NAMED AFTER THE USER — libpq's default — and there is no `kontra`
      # database here (this server has `postgres` and the `kontra_ducklake` the init script makes).
      # The probe still reported healthy, because a FATAL about a missing database is still proof
      # the server answered, so nothing was broken and nothing said anything. What it cost was the
      # log: one `FATAL: database "kontra" does not exist` every 5s, forever — 1295 of them in the
      # first half day, which is the haystack every real postgres error then has to be found in.
      test: ["CMD-SHELL", "pg_isready -U kontra -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # auto-setup ships an empty docker.yaml. Nexus operations refuse to leave Scheduled
  # while component.nexusoperations.callback.endpoint.template is the default "unset".
  # Written by a one-shot so the install does not need a host-side config file.
  temporal-dynamicconfig:
    image: busybox:1.36
    container_name: kontra-temporal-config
    volumes:
      - temporal-dynamicconfig:/config
    command:
      - /bin/sh
      - -c
      - |
        cat > /config/docker.yaml << 'EOF'
        component.nexusoperations.callback.endpoint.template:
          - value: "http://temporal:7243/namespaces/{{.NamespaceName}}/nexus/callback"
        component.nexusoperations.limit.operation.concurrency:
          - value: 2000
        component.callbacks.allowedAddresses:
          - value:
              - Pattern: "*"
                AllowInsecure: true
        EOF
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: kontra-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal-dynamicconfig:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: kontra
      POSTGRES_PWD: kontra
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    volumes:
      - temporal-dynamicconfig:/etc/temporal/config/dynamicconfig
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_TEMPORAL_PORT:-7233}:7233"
      # VPC ALSO, so a fleet Machine can reach this: temporal — the Worker polls its task queue.
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: kontra-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_KV_PORT:-6379}:6379"
      # VPC ALSO, so a fleet Machine can reach this: redis   — the Session/state store.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  registry:
    image: registry:2
    container_name: kontra-registry
    restart: unless-stopped
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_REGISTRY_PORT:-5000}:5000"
      # VPC ALSO, so a fleet Machine can reach this: registry — where a Machine fetches its Bundle layer.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One process: master + volume + filer + S3 (replaces four Seaweed services).
  seaweed:
    image: chrislusf/seaweedfs:3.80
    container_name: kontra-seaweed
    restart: unless-stopped
    # `-master.volumePreallocate=false` IS NOT A TUNING KNOB HERE, IT IS WHAT KEEPS WRITES WORKING.
    #
    # With the default (true) every new volume is `fallocate`d to its full 1 GiB before it holds a
    # single byte, so a volume file reserves a gibibyte of blocks past EOF and `du --apparent-size`
    # disagrees with `du` by the whole reservation. Measured on this install: 43 GB allocated
    # against 4.1 GB of actual objects — 39 GB reserved and empty.
    #
    # The way it fails is worse than the waste. Once the filesystem is down to less than 1 GiB free
    # the master can no longer create ANY volume — "No more free space left" on volume grow, in a
    # loop — so every S3 PutObject answers 500 InternalError while the store still has room for the
    # object. The symptom lands two layers away, as Actor batches failing on
    #
    #     operation error S3: PutObject … StatusCode: 500 … api error InternalError
    #
    # and retrying for ever: demo-run-3 spent four attempts and fourteen minutes there.
    #
    # Preallocation buys contiguity for a workload this is not: these volumes hold Parquet written
    # once and read whole, on a filesystem that is already extent-based.
    command: "server -dir=/data -ip=seaweed -ip.bind=0.0.0.0 -master.port=9333 -volume.port=8080 -master.volumePreallocate=false -filer -s3 -s3.port=8333"
    volumes:
      - seaweed-data:/data
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_S3_PORT:-8333}:8333"
      # VPC ALSO, so a fleet Machine can reach this: seaweed — the S3 object store units are written to.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/status >/dev/null && wget -q -O- http://127.0.0.1:8333/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ── THE BACKEND THE AGENT HAS BEEN SHIPPING TO SINCE BEFORE IT EXISTED (ADR 0050 §1) ──────────
  #
  # `machine.ts` installs `vmagent` on EVERY Machine, writes its unit, its scrape config and its
  # remote-write target — and until this service, nothing listened. Measured on `kf-webcrawl-01`,
  # every 60 seconds, for the whole life of the Fleet:
  #
  #   couldn't send a block with size 575 bytes to "1:secret-url":
  #     Post "http://<controller>:8428/api/v1/write": dial tcp4 <controller>:8428: connect: connection refused
  #
  # Every fleet metric ever collected was discarded. This is the smallest change that turns a
  # silently-broken pipeline into a working one.
  #
  # THE NAME IS LOAD-BEARING. `panels/metrics.ts` hard-codes `http://victoriametrics:8428` as
  # `DEFAULT_METRICS_URL` and `metrics.test.ts` asserts that exact string, so the service had to be
  # called `victoriametrics` — renaming it to `victoria-metrics` would leave the `loads` chip
  # reporting `unknown` forever, which is the one failure mode that file's header warns about.
  #
  # NO `ports:`, DELIBERATELY. Nothing on the host needs to reach this and a published Docker port
  # is DNATed in PREROUTING — a host firewall does not protect it (see the header). The orchestrator
  # reaches it over the compose network by name. A CLOUD Fleet is the case this does not yet serve:
  # a Droplet resolves `KONTRA_CONTROLLER` to the Controller's VPC address and pushes to `:8428`
  # there, so it needs this published on the VPC address ONLY — loopback + VPC, never `eth0`, which
  # is the shape `7233`/`6379`/`8333` already hold and the shape the 2026-09-12 incident was about.
  # That publish is deliberately not written here, because guessing the VPC address in a file that
  # ships to everyone is how `0.0.0.0` gets typed.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.111.0
    container_name: kontra-victoriametrics
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-metrics-data
      # RETENTION IS SET, NOT INHERITED. The default is one month; a Fleet that ran a campaign three
      # months ago is exactly the one somebody asks about, and silently aging its series out is the
      # same shape of loss as the Terminal scrollback this ADR exists to replace.
      - -retentionPeriod=${KONTRA_METRICS_RETENTION:-6}
      # Loopback would be wrong INSIDE the container: the orchestrator dials it across the compose
      # network. The container is not published, so this listens on the compose network only.
      - -httpListenAddr=:8428
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── WHERE A MACHINE'S LAST WORDS GO (ADR 0050 §1) ─────────────────────────────────────────────
  #
  # Logs had no path off a Machine at all. The only way to see inside a running Worker was a
  # Terminal — `tmux attach -r` over SSH — which is machine-local, unsearchable, and dies with the
  # box. On 2026-09-17 the only evidence that a Worker was grinding an abandoned sweep was
  # `journalctl -u kontra-actor-desync` on `kf-desync-01`; that Machine no longer exists and that
  # evidence is gone.
  #
  # NOT PUBLISHED, AND THIS ONE MATTERS MORE THAN THE METRICS STORE. VictoriaLogs has NO
  # AUTHENTICATION: its multi-tenancy is an `AccountID`/`ProjectID` REQUEST HEADER, which means the
  # header is an authorisation decision made by whoever sets it. Anything that can reach this port
  # can read every tenant's logs by setting a different number. The orchestrator proxies it and
  # stamps the tenant header server-side; the console never talks to it. That proxy is #17 — until
  # it lands, the only thing reaching this is the compose network.
  victorialogs:
    image: victoriametrics/victoria-logs:v1.9.1-victorialogs
    container_name: kontra-victorialogs
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-logs-data
      # Explicit, for the same reason as the metrics store: the Fleet somebody asks about months
      # later is exactly the one whose lines would have aged out without anyone choosing that.
      - -retentionPeriod=${KONTRA_LOGS_RETENTION:-6}
      - -httpListenAddr=:9428
      # A LIVE TAIL HOLDS A SELECT SLOT FOR ITS WHOLE LIFE, and the default pool is sized to
      # GOMAXPROCS — four here. That default is right for point queries, which finish in
      # milliseconds and hand the slot back, and wrong for `/select/logsql/tail`, which by design
      # holds one open until the viewer closes the tab.
      #
      # MEASURED, not theorised: `vl_concurrent_select_capacity 4`, `vl_concurrent_select_current 3`,
      # `vl_concurrent_select_limit_reached_total 8` with three console tabs' worth of tails open.
      # The FOURTH viewer takes the last slot and every `/api/logs/query` then queues past
      # `-search.maxQueueDuration` (10s) and 503s — including the run page's logs rail, which has
      # nothing to do with anyone's tail. VictoriaLogs answers those queries in 0.5s; it simply
      # never gets a slot.
      #
      # Worse, the orchestrator reports that timeout through `unreachable()`, whose sentence sends
      # an operator to `docker compose ps victorialogs` to stare at a perfectly healthy container.
      #
      # 64 because an idle tail costs a blocked goroutine and no CPU, so the pool should be sized
      # to CONCURRENT VIEWERS, not to cores. This does not fix a tail that leaks after its client
      # is gone — it stops one leak from taking the whole logs surface down with it.
      - -search.maxConcurrentRequests=64
    volumes:
      - victorialogs-data:/victoria-logs-data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9428/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # LOCAL WORKERS HAVE NO vlagent, so their stdout reaches the console's logs rail only if
  # something ships it. On a Fleet Machine that job belongs to vlagent; here it belongs to this.
  #
  # A SERVICE AND NOT A `docker exec`, because it had been solved by patching a running container
  # and that fix died the next time one was recreated — leaving an empty rail, which reads exactly
  # like a Run that logged nothing.
  logship:
    # ITS OWN IMAGE, AND THE TWO REASONS ARE DIFFERENT.
    #
    # 1. It carried `./control/images/logship.sh` and `./control/images/logline.py` as bind mounts,
    #    which is two more files a `curl` install does not have. `scripts/install-cluster.macos.sh`
    #    copied only `postgres-init.sh` and not these two, so in that path Docker created empty
    #    DIRECTORIES at both targets; `logship.sh` correctly refused to start without its parser and
    #    said so — and logship has no healthcheck, so `up -d --wait` never looked. That script has
    #    been passing while shipping zero logs. Hence the healthcheck below, which is the half of
    #    this fix that survives the next mount somebody forgets.
    # 2. It ran `apk add --no-cache docker-cli curl` in its ENTRYPOINT, on every single boot. A
    #    quickstart that reaches out to the Alpine mirrors before it can ship a log line fails on a
    #    laptop behind a proxy, and fails at the one moment the operator has nothing to read.
    image: ${KONTRA_LOGSHIP_IMAGE:-ghcr.io/medmahmoudi26/kontra-logship:dev}
    container_name: kontra-logship
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      victorialogs:
        condition: service_healthy
    environment:
      KONTRA_LOGS_URL: ${KONTRA_LOGS_URL:-http://victorialogs:9428}
      KONTRA_NAMESPACE: ${KONTRA_NAMESPACE:-default}
      # KONTRA_LOGSHIP_MATCH IS GONE. It named four containers — `kontra-desync|kontra-webcrawl|
      # kontra-nuclei|kontra-subfinder` — which is an enumeration of an open set: a fifth actor's
      # logs were absent and nothing said so. Selection is now by label (`KONTRA_WORKER`, which the
      # Warden already stamps on every Worker, and `kontra.logs=true` below), so a new actor is
      # covered the day it exists. See control/images/logship.sh.
    volumes:
      # READ-ONLY. This service only ever reads container stdout; it has no reason to be able to
      # start, stop or exec anything, and the socket is the whole host if it can.
      #
      # THE SCRIPT AND THE PARSER USED TO BE MOUNTED HERE. They are in the image now — the parser
      # especially, because it is a file precisely so `tests/test_logline.py` can import it, and
      # inlining it as a compose config would have put a second uncoverable copy of it in this file.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # NO `healthcheck:` HERE, AND ITS ABSENCE IS THE DECISION.
    #
    # `Dockerfile.logship` carries one, so compose, the Pulumi program and a bare `docker run` all
    # inherit the same expression without any of them restating it — and `control/pulumi/parity.py`
    # compares the two harnesses' service definitions, so a healthcheck written into only this file
    # is a difference it would report. What it checks is the poll loop TURNING
    # (`/tmp/logship-alive`, touched every 5s), not the process existing: this service's worst
    # failure was a live process with a dead loop.
    #
    # It matters here because `docker compose up -d --wait` needs something to wait ON. Without a
    # healthcheck anywhere, a crash-looping shipper is briefly "running" and --wait is satisfied,
    # which is how `scripts/install-cluster.macos.sh` has been going green over a shipper that never
    # started.

  # ── PORTER — ARROW FLIGHT SQL OVER THE LAKE, AND WHY IT HAS NO PUBLISHED PORT ─────────────────
  #
  # The read path used to build a whole DuckDB per question. `queryEngine.ts` called
  # `DuckDBInstance.create()` on every request, so `SELECT 1` cost ~1,800 ms before any row was
  # touched, and the answer was capped at `QUERY_DEFAULT_ROWS` (500) with a hard ceiling of
  # `QUERY_MAX_ROWS` (5,000). Measured against this service: the same full-table scan returns
  # 9,159 rows in 58 ms, and the widest table streams 29,825 rows in 316 ms across 160 record
  # batches with the first arriving at 81 ms. The console can paint as rows land instead of waiting
  # for one truncated response.
  #
  # NOT BECAUSE ARROW IS SMALLER — it is not. Arrow buffers measured 198 bytes/row against JSON's
  # 180. The win is completeness and streaming, and roughly 1.8 s of it is simply not rebuilding
  # the engine per query.
  #
  # ── IT CARRIES NO CREDENTIAL, SO THE NETWORK IS THE BOUNDARY ──────────────────────────────────
  #
  # `porter serve` has twelve flags and not one is auth or TLS; inside its container it binds every
  # interface. THIS SERVICE THEREFORE PUBLISHES NO HOST PORT, and adding one would put an
  # unauthenticated arbitrary-SQL engine over every engagement's data on the host's network — the
  # exact thing the header of this file says loopback exists to prevent.
  #
  # `victorialogs` above has the same property and the same answer: no `ports:`, reachable only on
  # this network, with the orchestrator as the authenticated front door. `routes/logs.ts` explains
  # that arrangement at length and every word of it applies here. The orchestrator keeps
  # `readonlySql.ts` validation and the `harden`/`scope` constraints; Porter only executes.
  #
  # DO NOT ADD A `ports:` ENTRY TO THIS SERVICE.
  porter:
    image: ${KONTRA_PORTER_IMAGE:-ghcr.io/medmahmoudi26/kontra-porter:dev}
    container_name: kontra-porter
    hostname: porter
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    restart: unless-stopped
    labels:
      kontra.logs: 'true'
    environment:
      # One set of credentials describes one object store — the entrypoint turns these into a
      # DuckDB persistent secret because Porter has no S3 configuration of its own.
      KONTRA_S3_ENDPOINT: http://seaweed:8333
      KONTRA_S3_BUCKET: kontra
      KONTRA_S3_REGION: us-east-1
      KONTRA_S3_ACCESS_KEY: kontra
      KONTRA_S3_SECRET_KEY: kontra
      # THE `postgres://` FORM, not the `postgres:dbname=…` string the orchestrator uses. DuckDB's
      # ATTACH takes a libpq keyword string; Porter's flag wants a URL. Same database, two
      # spellings, and they are kept as separate variables so neither is silently reformatted into
      # something the other end cannot parse.
      KONTRA_DUCKLAKE_CATALOG_URL: postgres://kontra:kontra@postgres:5432/kontra_ducklake
    depends_on:
      postgres:
        condition: service_healthy
      seaweed:
        condition: service_healthy
    healthcheck:
      # The status server, not the Flight port — gRPC does not answer a plain TCP probe usefully,
      # and a listening socket is not the same fact as an attached catalog.
      test: ["CMD-SHELL", "duckdb -c 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # API + materializer in one process (queues stay distinct). Infra stays separate (Pulumi).
  orchestrator-api:
    image: ${KONTRA_ORCHESTRATOR_IMAGE:-ghcr.io/medmahmoudi26/kontra-orchestrator:dev}
    container_name: kontra-api
    # A STABLE HOSTNAME, BECAUSE A WORKER'S TEMPORAL IDENTITY IS `<pid>@<hostname>`.
    #
    # Served workers run in THIS container, so the pollers on their queues identify as
    # `531@<hostname>`. Left to Docker that is a container id which changes on every recreate, and
    # `panels/local.ts:localHost` deliberately refuses an id-shaped name (it "identifies nothing an
    # operator can act on"). The Monitor's poller chip then could not attribute a poller to the node
    # it was drawing: it reported `poller: none — polled by 2 worker(s) (98291999cb49, …) but none
    # from localhost — its kontra-handler.service is probably down`, in red, about two workers that
    # were up and polling. Exactly the reading ADR 0020 says a tile may never give.
    hostname: kontra-api
    # SHIP THIS CONTAINER'S LOGS. The control plane's own processes were excluded from the shipper
    # by the name list that preceded this, so the components making the authorisation decisions
    # were the ones with no retained logs — the exact inversion an audit asks about.
    labels:
      kontra.logs: 'true'
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      cli:
        condition: service_started
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweed:
        condition: service_healthy
      registry:
        condition: service_healthy
    environment:
      <<: *orchestrator-env
      KONTRA_ORCHESTRATOR_ROLES: api,materializer
      # FIELD THREE OF THE TEMPORAL IDENTITY, for the calls this process MAKES. A Worker's identity
      # names its queue (`workerIdentity.ts`); a client polls nothing, so the role goes there
      # instead — which is what tells a Run's history that `kontra-api` started it and not the
      # infra container sharing the image. Not an address: nothing routes on this.
      KONTRA_WORKER_ROLE: api
      # ON A VOLUME, BECAUSE IT WAS ON THE CONTAINER'S OWN FILESYSTEM. `server.ts` defaults this to
      # `orchestrator.db` relative to its WORKDIR, which in this image is /src/control/orchestrator
      # — an overlay layer. So the actors, workflows, graphs, scratches and SOURCES tables were
      # destroyed by every `up -d` that recreated this container, which is every image upgrade.
      # MEASURED: after one recreate, /api/workflows answered `"registered": []` for a catalog that
      # had just had two workflows in it. Nothing said anything; the console simply drew an empty
      # list. `kontra-home` is the wrong home for it — that volume is the CLI's and is mounted `:ro`
      # here on purpose — so this is its own.
      KONTRA_ORCHESTRATOR_DB: /var/lib/kontra-db/orchestrator.db
      KONTRA_SECRETS_DIR: /var/lib/kontra-secrets
      # WHERE THE CHECKPOINTS ARE — and this role READS them, it never converges one.
      #
      # THE WHOLE `/api/infra/*` READ SURFACE WAS ANSWERING "NO STACKS". `registerInfraRoutes` is
      # registered HERE (`server.ts`), and `infra/state.ts` reads `<stateDir>/.pulumi/stacks/…` off
      # local disk — its header assumes "this host's disk", which is true on an appliance where one
      # process is every role and false in this compose file, where `pulumi-state` was mounted on
      # `orchestrator-infra` alone. So `listStacks()` hit a path that does not exist in this
      # container and returned `[]`, which the surface renders as "nothing has ever been converged".
      # MEASURED 2026-09-29 with thirteen converged Fleets on the volume: `GET /api/infra/stacks`
      # answered `{"stacks":[]}`. That is the empty-list-as-an-answer failure this repository keeps
      # finding — `infra/state.ts` degrades to `[]` for a never-converged backend on purpose, and
      # with the volume missing there is no way to tell that apart from a misconfigured one.
      KONTRA_PULUMI_STATE_DIR: /data/pulumi-state
    volumes:
      - kontra-home:/var/lib/kontra:ro
      - secrets-store:/var/lib/kontra-secrets
      - orchestrator-db:/var/lib/kontra-db
      # READ-ONLY, AND THAT IS THE POINT OF MOUNTING IT HERE AT ALL. Exactly one process may write a
      # checkpoint — `orchestrator-infra`, whose workflow id IS the stack fqn, which is what makes a
      # second concurrent writer structurally impossible (ADR 0019). `:ro` keeps that true at the
      # filesystem: this role can render the estate and cannot corrupt it, and no engine, no cloud
      # credential and no lock is added to the API's process by giving it the bytes to read.
      - pulumi-state:/data:ro
      - ${KONTRA_WORKSPACES:-${PWD}/workspaces}:${KONTRA_WORKSPACES:-${PWD}/workspaces}
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_API_PORT:-8088}:8088"
      # VPC ALSO, so a fleet Machine can reach this: api     — the Controller a Machine registers with.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8088/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  orchestrator-infra:
    image: ${KONTRA_ORCHESTRATOR_IMAGE:-ghcr.io/medmahmoudi26/kontra-orchestrator:dev}
    container_name: kontra-infra
    # See the api's. This is the role that holds the cloud credential.
    labels:
      kontra.logs: 'true'
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      cli:
        condition: service_started
    environment:
      <<: *orchestrator-env
      KONTRA_ORCHESTRATOR_ROLES: infra
      # See the api's. This is the role that holds the cloud credential, so it is the one whose
      # name on a history event an auditor will be reading.
      KONTRA_WORKER_ROLE: infra
      KONTRA_INFRA_QUEUE: kontra-infra
      KONTRA_PULUMI_STATE_DIR: /data/pulumi-state
      KONTRA_PULUMI_WORK_DIR: /data/pulumi
      # Local-only default. A value you set in .env wins. `down -v` destroys this state.
      PULUMI_CONFIG_PASSPHRASE: ${PULUMI_CONFIG_PASSPHRASE:-local-dev}
      DIGITALOCEAN_TOKEN: ${DIGITALOCEAN_TOKEN:-}
      KONTRA_CLOUD_CREDENTIAL: ${KONTRA_CLOUD_CREDENTIAL:-}
      KONTRA_SECRETS_DIR: /var/lib/kontra-secrets
      # THE FLEET SSH KEY, AND THE FAILURE IT EXISTS TO STOP.
      #
      # `programs/fleet.ts:privateKey()` reads `KONTRA_SSH_KEY ?? '/root/.ssh/id_rsa'` AT CONVERGE
      # TIME — deliberately, because a private key baked into config is a private key in every
      # backup of the Pulumi state. Neither the variable nor the file existed in this container,
      # and the way that fails is the expensive way: a machines-only converge needs no SSH and
      # SUCCEEDS, so four Droplets come up; the placement converge then needs to run the install
      # over SSH, dies with ENOENT, and `place()` raises with four Machines up and nothing on them.
      # Measured on campaign-1790558895 — provisioned, billed, destroyed, having run nothing.
      #
      # The path below is a MOUNT POINT, not the host path, and the key is bind-mounted read-only
      # beneath. It must be the private half of a key DigitalOcean has, because the Droplets are
      # created with `sshKeyIds` and only those keys can log in — see KONTRA_FLEET_SSH_KEY_IDS,
      # whose default is the account's `macbook-pro` and `axiom_rsa` ids.
      KONTRA_SSH_KEY: ${KONTRA_SSH_KEY:-/var/lib/kontra-ssh/fleet_key}
      # THE ADDRESSES A MACHINE IS TOLD TO CALL HOME ON — and they are this role's alone.
      #
      # The shared env block sets `KONTRA_CONTROLLER: orchestrator-api` and
      # `KONTRA_REGISTRY: 127.0.0.1:5000`. Both are correct INSIDE the compose network and both are
      # nonsense on a Droplet: `orchestrator-api` resolves nowhere, and `127.0.0.1:5000` is the
      # Droplet's own loopback, where nothing is listening. `activities/fleet.ts` builds the
      # Bundle's blob URL and the registration address from exactly these two variables, so a
      # Machine provisioned with them fetches nothing and registers nothing — it comes up clean and
      # idle, and the run burns `ready()`'s full ten-minute timeout before raising FleetNotReady.
      #
      # The VPC address is the one a Droplet in the Controller's own VPC can route to, and the
      # services are published there alongside loopback (see each `ports:` block). NOT the public
      # address: a published Docker port is DNATed in PREROUTING, so eth0 would put Temporal, Redis
      # and the object store on the internet.
      # The Bundle is unsigned and served from the Controller's own registry, so the Machine has to
      # be told that address is trusted — under the name it will actually see it by.
    volumes:
      - kontra-home:/var/lib/kontra:ro
      - secrets-store:/var/lib/kontra-secrets
      - pulumi-state:/data
      # READ-ONLY, and only on this role. `orchestrator-infra` is the only process that converges a
      # stack, which is the same reason it is the only one holding the cloud credential.
      # THE WORKSPACE, READ-ONLY — because `serve` runs HERE now and could not see the code.
      #
      # `serveDevWorkflow` moved the serve verb off the API and onto this role, since starting a
      # Worker means starting a CONTAINER and the socket is here (ADR 0036). What moved with it was
      # the need to RESOLVE the folder: `SourceStore.get` is a directory read — ADR 0049 made the
      # filesystem the registry, so there is no stored path to look up — and this container had the
      # `KONTRA_WORKSPACES` variable without the mount it names. Every serve failed with
      # `no registered source "at:/root/oss/kontra/workspaces/default/workflows/canary"`: the id the
      # API minted from a folder it can see, handed to a role that cannot.
      #
      # THE SAME PATH ON BOTH SIDES, exactly as the API mounts it. A Source id is `at:<absolute
      # path>`, so the two roles must agree on what that path means or the id is not portable
      # between them — which is what the hop across the queue makes it.
      #
      # READ-ONLY, unlike the API's. Nothing here writes a caller's code: this role resolves the
      # folder and then asks Docker to bind-mount it into the Worker, and THAT mount is resolved by
      # the daemon against the HOST filesystem, not through this container's view. So `:ro` costs
      # the serve path nothing and keeps the socket-holding container off the write path for source.
      - ${KONTRA_WORKSPACES:-${PWD}/workspaces}:${KONTRA_WORKSPACES:-${PWD}/workspaces}:ro
      # Host-level Docker authority — see the file header.
      - /var/run/docker.sock:/var/run/docker.sock
    # NO PUBLISHED PORT, AND THAT IS THE POINT. This container held 8090 for the Dashboard
    # streamer, whose own comment admitted it "carries no credential of its own beyond the panel
    # ticket" — the least-authenticated listener in the stack, in the one container with the
    # read-write Docker socket and the cloud credential. The Monitor is gone, so the port is gone,
    # and this role is now reachable only over the Compose network. Do not publish a port here.
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5
  orchestrator-probe:
    image: ${KONTRA_HOST_IMAGE:-ghcr.io/medmahmoudi26/kontra-host:dev}
    container_name: kontra-probe
    labels:
      kontra.logs: 'true'
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      seaweed:
        condition: service_healthy
      orchestrator-api:
        condition: service_healthy
    environment:
      KONTRA_ADDRESS: temporal:7233
      KONTRA_S3_ENDPOINT: http://seaweed:8333
      KONTRA_S3_BUCKET: kontra
      KONTRA_ORCHESTRATOR_URL: http://orchestrator-api:8088
      KONTRA_PROBE_QUEUE: ${KONTRA_PROBE_QUEUE:-kontra-probe}
      # See the api's. `internals/workerid.py` reads it.
      KONTRA_WORKER_ROLE: probe
      # STRUCTURED, because nothing reads this container's stdout with its eyes. `logs.py` has
      # shipped identity-stamped JSON since ADR 0050 §1 and no deployment had ever asked for it,
      # which is why the shipper was recovering a run id from the message text with a regex.
      KONTRA_LOG_FORMAT: json
    command: ["python3", "-m", "kontra.probe"]
    healthcheck:
      test: ["CMD", "python3", "-c", "raise SystemExit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5

  # First boot prints the console login, seeds hello/, then watches the current workspace.
  # `docker compose exec cli …` still works while watch is PID 1.
  cli:
    image: ${KONTRA_IMAGE:-ghcr.io/medmahmoudi26/kontra:dev}
    container_name: kontra-cli
    pull_policy: ${KONTRA_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweed:
        condition: service_healthy
      temporal:
        condition: service_healthy
      registry:
        condition: service_healthy
    environment:
      <<: *orchestrator-env
      KONTRA_SDK_ROOT: /opt/kontra
      KONTRA_ADDRESS: temporal:7233
      KONTRA_ORCHESTRATOR_URL: http://orchestrator-api:8088
    # WHERE THE PROCESS STARTS IS PART OF THE GO ACTOR BUILD'S INPUT, so it is stated rather than
    # inherited. `FindRepoRoot("")` (cli/internal/cliutil) walks UP FROM CWD looking for
    # docker-compose.yml; with no `working_dir` the process starts at `/` and the walk fails even
    # with the repo mounted below. Mounting the root is necessary and NOT sufficient — measured:
    # `docker exec kontra-cli kontra deploy --actor …` still failed after the mount, and the same
    # command under `-w /root/oss/kontra` built and pushed desync@1.3.3.
    working_dir: ${KONTRA_REPO:-${PWD}}
    volumes:
      - kontra-home:/var/lib/kontra
      - ${KONTRA_WORKSPACES:-${PWD}/workspaces}:${KONTRA_WORKSPACES:-${PWD}/workspaces}
      # THE REPO ROOT, READ-ONLY, BECAUSE A GO ACTOR CANNOT BE BUILT WITHOUT IT.
      #
      # `buildGoActor` (cli/deploy.go) uses the REPO ROOT as the Docker build context, not the actor
      # dir, because a Go actor's go.mod `replace`s point outside itself — `=> ../../../sdk/go` and
      # `=> ../../../runtime/go` — so the whole module tree has to be in the context. It finds that
      # root with `FindRepoRoot("")`, which walks up from CWD looking for docker-compose.yml.
      #
      # With only `workspaces/` mounted, that walk ends at a directory that does not exist in this
      # container and the build fails with `no docker-compose.yml found walking up from CWD`. The
      # image cannot supply it either: `kontra:dev` ships /opt/kontra/{sdk,runtime}/python and NO Go
      # tree at all. So the Go actor path was structurally impossible here, and `workspace watch`
      # retried it forever — desync, dnsfacts, linkfind, nscheck, nuclei and subfinder, every loop.
      #
      # THE VISIBLE COST WAS NOT A BUILD ERROR, which is why it survived: the actors kept running,
      # on whichever bundle was published last. desync sat on 1.3.2 while two fixes to its source
      # went nowhere — 8,680 of 8,700 split vectors shipped with a blank explanation because the
      # `foldNote` rebuild never happened. A deploy pipeline that cannot deploy but leaves the old
      # version serving reads exactly like one that has nothing to do.
      #
      # `:ro` because building is a read of the tree and nothing in this container should ever write
      # to the checkout.
      - ${KONTRA_REPO:-${PWD}}:${KONTRA_REPO:-${PWD}}:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - /bin/sh
      - -c
      - |
        set -e
        python3 - <<'PY'
        import time, urllib.error, urllib.request
        req = urllib.request.Request("http://seaweed:8333/kontra", method="PUT")
        for attempt in range(30):
            try:
                urllib.request.urlopen(req, timeout=10)
                print("seaweed: created bucket kontra")
                break
            except urllib.error.HTTPError as e:
                if e.code in (409, 500):
                    print("seaweed: bucket kontra already present")
                    break
                if attempt == 29:
                    raise
                time.sleep(1)
            except Exception:
                if attempt == 29:
                    raise
                time.sleep(1)
        PY
        kontra workspace seed
        python3 - <<'PY'
        import time, urllib.request
        for attempt in range(120):
            try:
                urllib.request.urlopen("http://orchestrator-api:8088/api/health", timeout=2)
                break
            except Exception:
                if attempt == 119:
                    raise SystemExit("cli: timed out waiting for orchestrator-api")
                time.sleep(1)
        PY
        exec kontra workspace watch

networks:
  default:
    name: kontra

# ── EVERY FILE THIS INSTALL NEEDS IS IN THIS FILE ────────────────────────────────────────────────
#
# `content:` inlines a config instead of reading it from the host, which is what lets the whole
# install be `curl` + `docker compose up -d`. It needs Compose v2.23+; `x-compose-min` above says so
# and the quickstart CI job asserts the runner has it.
#
# WHAT DOES *NOT* BELONG HERE: anything with a test. `control/images/logline.py` is loaded by path in
# `tests/test_logline.py`, and the comment on its old mount records why it is a file at all — a
# syntax error in a heredoc read as "this run logged nothing". Inlining it here would put a second
# copy of a parser in a place nothing can import, so it goes in an image instead (see `logship`).
# Six lines of SQL with no test is the case `content:` is for.
configs:
  ducklake-init:
    content: |
      #!/bin/sh
      set -eu
      # CREATE DATABASE IF NOT EXISTS is not valid in Postgres; ignore "already exists".
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<'SQL'
      SELECT 'CREATE DATABASE kontra_ducklake' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'kontra_ducklake')\gexec
      SQL

volumes:
  postgres-data:
  redis-data:
  registry-data:
  seaweed-data:
  victoriametrics-data:
  victorialogs-data:
  kontra-home:
  orchestrator-db:
  # THE SECRET STORE NEEDS A WRITABLE HOME, AND `kontra-home` IS NOT ONE HERE.
  #
  # `secrets/keyring.ts` defaults the store to `${KONTRA_HOME}/secrets`, which lands inside
  # `kontra-home` — mounted `:ro` into both orchestrator processes ON PURPOSE (see the note on the
  # api service: "that volume is the CLI's"). So every `PUT /api/secrets/:name` failed with
  #
  #     ENOENT: no such file or directory, mkdir '/var/lib/kontra/secrets'
  #
  # which reads as a missing directory and is actually a read-only filesystem. The fleet then
  # refused every run with "needs the cloud credential do-token and there is no secret by that
  # name", and no amount of writing the secret could fix it.
  #
  # SHARED BY BOTH PROCESSES, because they are two halves of one flow: the api WRITES the secret
  # and orchestrator-infra RESOLVES it at the last hop when a fleet comes up. A store only one of
  # them can see is a credential that saves and then cannot be found.
  secrets-store:
  temporal-dynamicconfig:
  pulumi-state:
    # `docker compose down` keeps this. `down -v` destroys Pulumi dockerFleet state AND Datasets.
    # Named so an operator has to type the destructive flag.
