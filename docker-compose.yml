# Development compose — the same cluster as docker-compose.quickstart.yml (ADR 0047).
#
# From a checkout (see README Install):
#
#   make image
#   docker build -f control/images/Dockerfile.orchestrator -t kontra-orchestrator:latest .
#   docker build -f control/images/Dockerfile.pyworker -t kontra-host:1 .
#   docker build -f control/images/Dockerfile.workerbase -t kontra-worker-base:1 .
#   mkdir -p workspaces.kontra
#   docker compose --env-file .env.quickstart up -d --wait
#
# DigitalOcean fleets still use orchestrator-infra in that file. Export DIGITALOCEAN_TOKEN
# (or put the name in the secret store) when you need `do_fleet`.
#
# THE APPLIANCE IS NOT HERE. `kontra up` remains in the binary for migration, and is not a
# supported install path.

include:
  - path: docker-compose.quickstart.yml
