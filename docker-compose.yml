# kontra local cluster (ADR 0047). From a clone after building images (see README Install):
#
#   (from the parent of this checkout) mkdir -p workspaces.kontra
#   docker compose --env-file .env.quickstart up -d --wait
#   docker compose logs cli | grep -A4 'console login'
#
# Named workspaces live beside kontra/ and kontra-console/ as workspaces.kontra/
# (default ${PWD}/../workspaces.kontra). Each child is a workspace; .current picks one.
#
# Postgres, Temporal, SeaweedFS, Redis, the registry, and the kontra processes are separate
# services. The appliance (`kontra up` as one process) is not a supported install path.
#
# ── THE DOCKER SOCKET ──────────────────────────────────────────────────────────────────────────
#
# `orchestrator-infra` and `cli` (workspace watch) mount `/var/run/docker.sock`. A local Fleet's
# Warden containers (created by Pulumi `dockerFleet`) mount it too. That is host-level Docker
# authority: anything with the socket can start privileged containers. Acceptable for a
# single-operator laptop. Not tenant isolation. Do not expose this stack as a shared service.
#
# ── LOOPBACK IS THE SECURITY CONTROL ───────────────────────────────────────────────────────────
#
# Every published port binds `${KONTRA_BIND}`, default `127.0.0.1`. A published Docker port is
# DNATed in PREROUTING and accepted in FORWARD — a host firewall does not protect it. Do not
# change KONTRA_BIND to 0.0.0.0 to "make it work from another machine".

name: ${COMPOSE_PROJECT_NAME:-kontra}

# ${PWD} is absolute (kontra checkout). Blank KONTRA_WORKSPACES defaults to the sibling
# ../workspaces.kontra so user code stays outside both repos.
x-workspaces: &workspaces ${KONTRA_WORKSPACES:-${PWD}/../workspaces.kontra}

x-orchestrator-env: &orchestrator-env
  KONTRA_HOME: /var/lib/kontra
  KONTRA_ADDRESS: temporal:7233
  KONTRA_NAMESPACE: ${KONTRA_NAMESPACE:-default}
  KONTRA_S3_ENDPOINT: http://seaweed:8333
  KONTRA_S3_BUCKET: kontra
  KONTRA_S3_REGION: us-east-1
  KONTRA_S3_ACCESS_KEY: kontra
  KONTRA_S3_SECRET_KEY: kontra
  KONTRA_REDIS_HOST: redis:6379
  KONTRA_REGISTRY: ${KONTRA_REGISTRY:-127.0.0.1:5000}
  KONTRA_ORCHESTRATOR_URL: http://orchestrator-api:8088
  KONTRA_CONTROLLER: orchestrator-api
  KONTRA_DUCKLAKE_CATALOG: postgres:dbname=kontra_ducklake host=postgres user=kontra password=kontra
  KONTRA_MATERIALIZATION_DB: postgres://kontra:kontra@postgres:5432/kontra_ducklake
  KONTRA_WORKSPACES: *workspaces
  KONTRA_IMAGE: ${KONTRA_IMAGE:-kontra:latest}
  KONTRA_HOST_IMAGE: ${KONTRA_HOST_IMAGE:-kontra-host:1}
  KONTRA_TRUST_REGISTRIES: ${KONTRA_TRUST_REGISTRIES:-127.0.0.1:5000}
  KONTRA_TRUST_UNSIGNED: ${KONTRA_TRUST_UNSIGNED:-127.0.0.1:5000}

# ── ONE TMUX SERVER, TWO CONTAINERS ────────────────────────────────────────────────────────────
#
# `serve` creates a tmux session in orchestrator-api (that is where the CLI, python3 and the SDK
# are). The Dashboard's `local` mode runs `list-panes` from the PANELS STREAMER, which is a forked
# child of orchestrator-infra. Two containers, two tmux servers, and the Monitor was therefore
# empty for every worker the Serve button had just started — a wall that reports nothing is
# indistinguishable from a worker that failed to boot, which is the one thing ADR 0020 says a tile
# may never do.
#
# TMUX_TMPDIR moves the socket onto a shared volume, so both containers speak to the SAME server.
# api starts it (it is the only one that creates sessions) and infra is a read-only client.
# Restarting api kills that server and leaves a stale socket; MEASURED — tmux answers
# `list-sessions` with exit 1 (which local.ts already reads as "no sessions") and the next
# `new-session` starts a fresh server over it.
x-tmux-socket: &tmux-socket /run/kontra-tmux

x-kontra-home: &kontra-home
  - kontra-home:/var/lib/kontra
  - ${KONTRA_WORKSPACES:-${PWD}/../workspaces.kontra}:${KONTRA_WORKSPACES:-${PWD}/../workspaces.kontra}

services:
  postgres:
    image: postgres:16-alpine
    container_name: kontra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kontra
      POSTGRES_PASSWORD: kontra
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./control/images/postgres-init.sh:/docker-entrypoint-initdb.d/01-ducklake.sh:ro
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # `-d postgres`, and the missing word was not cosmetic. `pg_isready -U kontra` with no
      # database asks for one NAMED AFTER THE USER — libpq's default — and there is no `kontra`
      # database here (this server has `postgres` and the `kontra_ducklake` the init script makes).
      # The probe still reported healthy, because a FATAL about a missing database is still proof
      # the server answered, so nothing was broken and nothing said anything. What it cost was the
      # log: one `FATAL: database "kontra" does not exist` every 5s, forever — 1295 of them in the
      # first half day, which is the haystack every real postgres error then has to be found in.
      test: ["CMD-SHELL", "pg_isready -U kontra -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # auto-setup ships an empty docker.yaml. Nexus operations refuse to leave Scheduled
  # while component.nexusoperations.callback.endpoint.template is the default "unset".
  # Written by a one-shot so the install does not need a host-side config file.
  temporal-dynamicconfig:
    image: busybox:1.36
    container_name: kontra-temporal-config
    volumes:
      - temporal-dynamicconfig:/config
    command:
      - /bin/sh
      - -c
      - |
        cat > /config/docker.yaml << 'EOF'
        component.nexusoperations.callback.endpoint.template:
          - value: "http://temporal:7243/namespaces/{{.NamespaceName}}/nexus/callback"
        component.nexusoperations.limit.operation.concurrency:
          - value: 2000
        component.callbacks.allowedAddresses:
          - value:
              - Pattern: "*"
                AllowInsecure: true
        EOF
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.27.2
    container_name: kontra-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal-dynamicconfig:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: kontra
      POSTGRES_PWD: kontra
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    volumes:
      - temporal-dynamicconfig:/etc/temporal/config/dynamicconfig
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: kontra-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis-data:/data
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_KV_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  registry:
    image: registry:2
    container_name: kontra-registry
    restart: unless-stopped
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_REGISTRY_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One process: master + volume + filer + S3 (replaces four Seaweed services).
  seaweed:
    image: chrislusf/seaweedfs:3.80
    container_name: kontra-seaweed
    restart: unless-stopped
    command: "server -dir=/data -ip=seaweed -ip.bind=0.0.0.0 -master.port=9333 -volume.port=8080 -filer -s3 -s3.port=8333"
    volumes:
      - seaweed-data:/data
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/status >/dev/null && wget -q -O- http://127.0.0.1:8333/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # API + materializer in one process (queues stay distinct). Infra stays separate (Pulumi).
  orchestrator-api:
    image: ${KONTRA_ORCHESTRATOR_IMAGE:-kontra-orchestrator:latest}
    container_name: kontra-api
    # A STABLE HOSTNAME, BECAUSE A WORKER'S TEMPORAL IDENTITY IS `<pid>@<hostname>`.
    #
    # Served workers run in THIS container, so the pollers on their queues identify as
    # `531@<hostname>`. Left to Docker that is a container id which changes on every recreate, and
    # `panels/local.ts:localHost` deliberately refuses an id-shaped name (it "identifies nothing an
    # operator can act on"). The Monitor's poller chip then could not attribute a poller to the node
    # it was drawing: it reported `poller: none — polled by 2 worker(s) (98291999cb49, …) but none
    # from localhost — its kontra-handler.service is probably down`, in red, about two workers that
    # were up and polling. Exactly the reading ADR 0020 says a tile may never give.
    hostname: kontra-api
    pull_policy: ${KONTRA_PULL_POLICY:-never}
    restart: unless-stopped
    depends_on:
      cli:
        condition: service_started
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweed:
        condition: service_healthy
      registry:
        condition: service_healthy
    environment:
      <<: *orchestrator-env
      KONTRA_ORCHESTRATOR_ROLES: api,materializer
      # `serve` starts the tmux server here; see x-tmux-socket.
      TMUX_TMPDIR: *tmux-socket
      # ON A VOLUME, BECAUSE IT WAS ON THE CONTAINER'S OWN FILESYSTEM. `server.ts` defaults this to
      # `orchestrator.db` relative to its WORKDIR, which in this image is /src/control/orchestrator
      # — an overlay layer. So the actors, workflows, graphs, scratches and SOURCES tables were
      # destroyed by every `up -d` that recreated this container, which is every image upgrade.
      # MEASURED: after one recreate, /api/workflows answered `"registered": []` for a catalog that
      # had just had two workflows in it. Nothing said anything; the console simply drew an empty
      # list. `kontra-home` is the wrong home for it — that volume is the CLI's and is mounted `:ro`
      # here on purpose — so this is its own.
      KONTRA_ORCHESTRATOR_DB: /var/lib/kontra-db/orchestrator.db
    volumes:
      - kontra-home:/var/lib/kontra:ro
      - orchestrator-db:/var/lib/kontra-db
      - tmux-sock:/run/kontra-tmux
      - ${KONTRA_WORKSPACES:-${PWD}/../workspaces.kontra}:${KONTRA_WORKSPACES:-${PWD}/../workspaces.kontra}
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_API_PORT:-8088}:8088"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8088/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  orchestrator-infra:
    image: ${KONTRA_ORCHESTRATOR_IMAGE:-kontra-orchestrator:latest}
    container_name: kontra-infra
    pull_policy: ${KONTRA_PULL_POLICY:-never}
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      cli:
        condition: service_started
    environment:
      <<: *orchestrator-env
      KONTRA_ORCHESTRATOR_ROLES: infra
      # The panels streamer is a child of THIS container and reads the server api started.
      TMUX_TMPDIR: *tmux-socket
      # ...so "the local node" is orchestrator-api, NOT this container. The streamer would otherwise
      # label local Terminals with its own `os.hostname()` and match pollers against it — the wrong
      # box, since every local session lives in api. See the `hostname:` note on orchestrator-api.
      KONTRA_PANEL_LOCAL_HOST: kontra-api
      # BOTH SPELLINGS OF THE SAME ORIGIN, because the browser's is whichever the operator typed.
      #
      # `panels.ts:DEFAULT_ORIGIN` is `http://localhost:8088` alone, and the console reaches the
      # streamer DIRECTLY on 8090 (`panelsClient.ts:22`) rather than through the API — deliberately,
      # to keep panel bytes off the event loop serving DuckDB queries. That makes this a genuine
      # cross-origin request, so the allow-list decides it. Open the console on `127.0.0.1:8088`
      # instead of `localhost:8088` — the same server, and the address the compose port mapping
      # actually names — and the default refuses the socket while every other page works.
      KONTRA_PANEL_ORIGIN: >-
        http://localhost:${KONTRA_API_PORT:-8088},http://127.0.0.1:${KONTRA_API_PORT:-8088}
      KONTRA_INFRA_QUEUE: kontra-infra
      KONTRA_PULUMI_STATE_DIR: /data/pulumi-state
      KONTRA_PULUMI_WORK_DIR: /data/pulumi
      # Local-only default. A value you set in .env wins. `down -v` destroys this state.
      PULUMI_CONFIG_PASSPHRASE: ${PULUMI_CONFIG_PASSPHRASE:-local-dev}
      DIGITALOCEAN_TOKEN: ${DIGITALOCEAN_TOKEN:-}
      KONTRA_CLOUD_CREDENTIAL: ${KONTRA_CLOUD_CREDENTIAL:-}
    volumes:
      - kontra-home:/var/lib/kontra:ro
      - tmux-sock:/run/kontra-tmux
      - pulumi-state:/data
      # Host-level Docker authority — see the file header.
      - /var/run/docker.sock:/var/run/docker.sock
    # THE DASHBOARD'S OWN PORT, AND ITS ABSENCE WAS THE WHOLE BUG.
    #
    # The console does NOT reach the Monitor through the API. `panelsClient.ts:22` opens
    # `ws://<host>:8090/api/panels/ws` straight at the streamer, deliberately — panel frames are a
    # firehose and routing them through 8088 would put them on the event loop that serves the CLI's
    # DuckDB queries. So the browser needs 8090 reachable from the HOST, and nothing published it.
    #
    # `control/orchestrator/src/routes/panels.ts:78` already asserted this mapping existed —
    # "docker-compose.yml publishes 127.0.0.1:8090:8090" — and it did not. A comment describing a
    # line that was never written is worse than no comment: it is where someone debugging stops
    # looking. The observable failure was the Monitor alone refusing to connect, with every other
    # page healthy: `the Dashboard socket failed (http://localhost:8090)`.
    #
    # MEASURED before this line: `curl http://localhost:8090/` from the host answered 000
    # (unreachable), while the streamer inside the container binds 0.0.0.0 (`panels/server.ts:307`)
    # and was listening the whole time. Same loopback default as every other published port here —
    # the streamer carries no credential of its own beyond the panel ticket, so it must not be on a
    # routable address by accident.
    ports:
      - "${KONTRA_BIND:-127.0.0.1}:${KONTRA_PANEL_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5

  orchestrator-probe:
    image: ${KONTRA_HOST_IMAGE:-kontra-host:1}
    container_name: kontra-probe
    pull_policy: ${KONTRA_PULL_POLICY:-never}
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      seaweed:
        condition: service_healthy
      orchestrator-api:
        condition: service_healthy
    environment:
      KONTRA_ADDRESS: temporal:7233
      KONTRA_S3_ENDPOINT: http://seaweed:8333
      KONTRA_S3_BUCKET: kontra
      KONTRA_ORCHESTRATOR_URL: http://orchestrator-api:8088
      KONTRA_PROBE_QUEUE: ${KONTRA_PROBE_QUEUE:-kontra-probe}
    command: ["python3", "-m", "kontra.probe"]
    healthcheck:
      test: ["CMD", "python3", "-c", "raise SystemExit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5

  # First boot prints the console login, seeds hello/, then watches the current workspace.
  # `docker compose exec cli …` still works while watch is PID 1.
  cli:
    image: ${KONTRA_IMAGE:-kontra:latest}
    container_name: kontra-cli
    pull_policy: ${KONTRA_PULL_POLICY:-never}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweed:
        condition: service_healthy
      temporal:
        condition: service_healthy
      registry:
        condition: service_healthy
    environment:
      <<: *orchestrator-env
      KONTRA_SDK_ROOT: /opt/kontra
      KONTRA_ADDRESS: temporal:7233
      KONTRA_ORCHESTRATOR_URL: http://orchestrator-api:8088
    volumes:
      - kontra-home:/var/lib/kontra
      - ${KONTRA_WORKSPACES:-${PWD}/../workspaces.kontra}:${KONTRA_WORKSPACES:-${PWD}/../workspaces.kontra}
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - /bin/sh
      - -c
      - |
        set -e
        python3 - <<'PY'
        import time, urllib.error, urllib.request
        req = urllib.request.Request("http://seaweed:8333/kontra", method="PUT")
        for attempt in range(30):
            try:
                urllib.request.urlopen(req, timeout=10)
                print("seaweed: created bucket kontra")
                break
            except urllib.error.HTTPError as e:
                if e.code in (409, 500):
                    print("seaweed: bucket kontra already present")
                    break
                if attempt == 29:
                    raise
                time.sleep(1)
            except Exception:
                if attempt == 29:
                    raise
                time.sleep(1)
        PY
        kontra workspace seed
        python3 - <<'PY'
        import time, urllib.request
        for attempt in range(120):
            try:
                urllib.request.urlopen("http://orchestrator-api:8088/api/health", timeout=2)
                break
            except Exception:
                if attempt == 119:
                    raise SystemExit("cli: timed out waiting for orchestrator-api")
                time.sleep(1)
        PY
        exec kontra workspace watch

networks:
  default:
    name: kontra

volumes:
  postgres-data:
  redis-data:
  registry-data:
  seaweed-data:
  kontra-home:
  orchestrator-db:
  tmux-sock:
  temporal-dynamicconfig:
  pulumi-state:
    # `docker compose down` keeps this. `down -v` destroys Pulumi dockerFleet state AND Datasets.
    # Named so an operator has to type the destructive flag.
