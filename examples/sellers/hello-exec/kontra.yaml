# A team gate on one machine, for the hello-exec seller as a direct backend (M1). Plaintext is allowed only
# because public_url is a localhost origin (PRD §11).
listen: 127.0.0.1:8080
public_url: http://localhost:8080
postgres: postgres://kontra:kontra@localhost:5432/kontra
temporal: { address: localhost:7233, namespace: kontra }
auth: { api_keys: true }

services:
  hello:
    kind: a2a
    backend: { a2a: { url: "http://127.0.0.1:9999", allow_private: true } }
    allow: ["org:default"]           # every API key of this gate's one tenant
    task: { timeout: 10m, retries: 2 }
