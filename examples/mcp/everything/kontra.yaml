# A team gate on one machine, for server-everything@1.0.0 (streamableHttp) hosted through the tunnel (M3): `kontra
# connect`, next to the server, forwards the gate's MCP exchanges to its endpoint and nowhere else. Postgres and
# Temporal are the repository's compose.dev.yaml, as for the sellers.
listen: 127.0.0.1:8080
public_url: http://localhost:8080 # a node's --gate must be this origin (spec/tunnel.md §4: bad_origin otherwise)
postgres: postgres://kontra:kontra@localhost:5432/kontra
temporal: { address: localhost:7233, namespace: kontra }
auth: { api_keys: true }

services:
  everything:
    kind: mcp
    backend: { tunnel: {} }          # hosted by the nodes enrolled for it; the node holds the server's URL
    allow: ["org:default"]           # every API key of this gate's one tenant
    # get-env returns the server's whole environment; gzip-file-as-resource fetches URLs (D185).
    tools: { deny: ["get-env", "gzip-file-as-resource"] }
