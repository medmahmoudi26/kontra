# The TCK's gate for the nightly auth run (M4 plan audit, confirmedConflicts 10; DM4-12): the direct backend behind
# test/tck/front-auth.Caddyfile, a loopback front that adds `Authorization: Bearer <key>` to every request, the key
# minted by `kontra-gate enroll --api-key tck --prefix tck`. The TCK then runs as that key's principal, so the
# gate's ListTasks and push configs and deliveries, which the anonymous principal is refused (D20), run through the
# TCK too. A template that scripts/tck.sh fills (@LISTEN@, @PUBLIC_URL@, @POSTGRES@, @TEMPORAL@, @SELLER@):
# `make tck VARIANT=auth`. public_url is the front's (plaintext on loopback): the served card names it.
#
# `tck` admits the tck keys only, not anonymous. push.allow_private as in gate-direct.yaml (D67).
listen: "@LISTEN@"
public_url: "@PUBLIC_URL@"
postgres: "@POSTGRES@"
temporal: { address: "@TEMPORAL@", namespace: kontra }
metrics: { listen: "127.0.0.1:0" }
auth: { api_keys: true }
drain_timeout: 2s
push: { allow_private: true }

services:
  tck:
    kind: a2a
    backend: { a2a: { url: "@SELLER@", allow_private: true } }
    allow: ["key:kk_tck_*"]
    task: { timeout: 10m, retries: 2 }
