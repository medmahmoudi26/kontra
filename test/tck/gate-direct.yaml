# The TCK's gate, direct backend: tck_jsonrpc and tck_rest (spec/relay.md §16; D18, D279). A template that
# scripts/tck.sh fills (@LISTEN@, @PUBLIC_URL@, @POSTGRES@, @TEMPORAL@, @SELLER@) and runs from a fresh database:
# `make tck VARIANT=direct`. The TCK calls the gate itself, in plaintext on loopback (a localhost public_url).
#
# The pinned TCK sends no credential (a2a-tck#163), so `tck` admits the anonymous principal (D18, D20), which is
# refused ListTasks and push configs (spec/relay.md §2.3); the TCK's webhook receiver listens on loopback in
# plaintext, so push.allow_private (D67). The seller (examples/sellers/tck) declares no required extension: the TCK
# never sends A2A-Extensions (a2a-tck#193).
listen: "@LISTEN@"
public_url: "@PUBLIC_URL@"
postgres: "@POSTGRES@"
temporal: { address: "@TEMPORAL@", namespace: kontra }
metrics: { listen: "127.0.0.1:0" }
drain_timeout: 2s
push: { allow_private: true }

services:
  tck:
    kind: a2a
    backend: { a2a: { url: "@SELLER@", allow_private: true } }
    allow: [anonymous]
    task: { timeout: 10m, retries: 2 }
