#cloud-config
# The throwaway droplet of scripts/team-gate-vps.sh (D281, D298; the M4 plan's gate run C): Ubuntu 24.04 with
# Docker, Compose v2 and buildx from Ubuntu's own packages, and nothing else. The script ships the repository and runs
# compose.yaml with deploy/compose/kontra.vps.yaml over ssh.
#
# ASCII only (test/vps checks it): a non-ASCII byte in user data has broken cloud-init's parsing of a whole fleet's
# boot before (the Windmill fleet), and the failure shows only as a droplet without Docker.
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - docker-buildx
runcmd:
  - [systemctl, enable, --now, docker.service]
