<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Kontra console: chat prototype</title>
<!--
  Prototype for docs/console-chat.md. One file, no build step, no network: open it in a browser.
  Every agent, task, artifact, node and MCP server in it is mock data, and every reply is a scripted stream.
  Add ?theme=light for the light theme. The console's own tokens (web/static/console.css) are copied below.
-->
<style>
html,body{height:100%}
#app{height:100%}
body{margin:0}
a{color:#0b7fa4}a:hover{color:#075c78}
.kc{--paper:#eef1f6;--surface:#ffffff;--surface-2:#e7eaf1;--surface-3:#dde1ec;--ink:#0e131b;--ink-2:#434b5e;--ink-3:#5d6579;--line:#d6dbe6;--line-2:#c1c8d7;--brand:#0b7fa4;--brand-ink:#075c78;--brand-soft:#e1f4fa;--brand-line:#b4e4f0;--ok:#136f43;--ok-soft:#ddefe5;--warn:#8a5d07;--warn-soft:#f7ecd3;--bad:#a52419;--bad-soft:#f9e2df;--on-brand:#ffffff}
.kc.dark{--paper:#090b10;--surface:#11141c;--surface-2:#181c26;--surface-3:#222734;--ink:#eaecf3;--ink-2:#a9afc1;--ink-3:#8b93a7;--line:#242a36;--line-2:#333a4b;--brand:#67e3f9;--brand-ink:#a6eeff;--brand-soft:#0b2c37;--brand-line:#15576b;--ok:#49cc8b;--ok-soft:#0f251b;--warn:#e0b14a;--warn-soft:#291f11;--bad:#ff7568;--bad-soft:#2d1513;--on-brand:#04222b}
.kc button{font:inherit;cursor:pointer}
.kc :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.kc button:disabled{opacity:.5;cursor:not-allowed}
.kc .caret{display:inline-block;width:7px;height:1em;margin-left:2px;vertical-align:text-bottom;background:var(--brand);animation:kcblink 1s steps(2,start) infinite}
.kc .pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;animation:kcpulse 1.2s ease-in-out infinite}
@keyframes kcblink{to{visibility:hidden}}
@keyframes kcpulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.kc .caret,.kc .pulse{animation:none}}
.kc a{color:var(--brand-ink)}
.kc .rail{max-height:100%}
.kc .side{flex:0 1 420px;min-width:0;max-height:100%}
@media (max-width:1300px){.kc .side{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);max-height:none;z-index:5;box-shadow:-18px 0 40px -24px rgba(0,0,0,.7)}}
@media (max-width:720px){.kc .rail{max-height:236px}.kc .crumbs{display:none}}
</style>
</head>
<body>
<noscript><p>This prototype needs JavaScript.</p></noscript>
<div id="app"></div>

<template id="tpl">
<div class="kc {{themeClass}}" style="height: 100vh; min-height: 640px; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; line-height: 1.45">

  <header style="flex: 0 0 auto; min-height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <a href="#top" aria-label="Kontra home" style="display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none">
      <svg viewBox="0 0 40 48" width="20" height="24" aria-hidden="true"><path opacity="0.5" d="M0 14.5265V33.4739L17.8947 21.2301V2.28271L0 14.5265Z" fill="#67E3F9"/><path opacity="0.5" d="M0 33.4738V14.5264L17.8947 26.7702V45.7175L0 33.4738Z" fill="#088AB2"/><path opacity="0.5" d="M40 14.5262V33.4736L22.1053 21.2298V2.28247L40 14.5262Z" fill="#67E3F9"/><path opacity="0.5" d="M40 33.4738V14.5264L22.1053 26.7702V45.7175L40 33.4738Z" fill="#088AB2"/></svg>
      <b style="font-size: 17px; font-weight: 700; letter-spacing: -0.03em">kontra</b>
    </a>
    <nav aria-label="Sections" style="display: flex; align-items: center; gap: 4px; min-width: 0; overflow-x: auto">
      <sc-for list="{{navs}}" as="nv" hint-placeholder-count="8"><button type="button" aria-current="{{nv.current}}" onClick="{{nv.pick}}" style="min-height: 44px; border: 0; border-radius: 7px; padding: 0 11px; font-size: 13px; white-space: nowrap; background: {{nv.bg}}; color: {{nv.fg}}; font-weight: {{nv.weight}}">{{nv.label}}</button></sc-for>
    </nav>
  </header>

  <div id="top" style="display: {{d.chat}}; flex: 1 1 auto; min-height: 0; flex-wrap: wrap; align-content: stretch; position: relative">

    <aside class="rail" aria-label="Conversations" style="flex: 1 1 290px; min-width: 0; min-height: 0; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
      <button type="button" onClick="{{newChat}}" style="display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; min-height: 44px; background: var(--brand); border: 1px solid var(--brand); border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--on-brand)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>

      <div style="display: flex; flex-direction: column; gap: 9px">
        <h2 style="margin: 0; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 0 4px">Conversations</h2>
        <div role="group" aria-label="Show" style="display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="flex: 1 1 0; min-height: 38px; border: 0; border-radius: 7px; padding: 6px 8px; font-size: 12px; white-space: nowrap; background: {{f.bg}}; color: {{f.fg}}; font-weight: {{f.weight}}">{{f.label}}</button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{convs}}" as="c" hint-placeholder-count="5">
          <button type="button" aria-pressed="{{c.selected}}" onClick="{{c.pick}}" style="text-align: left; width: 100%; display: flex; flex-direction: column; gap: 6px; padding: 10px 10px; border-radius: 10px; border: 1px solid {{c.rowLine}}; background: {{c.rowBg}}; color: var(--ink); min-width: 0">
            <span style="display: flex; align-items: center; gap: 6px; min-width: 0; width: 100%">
              <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">{{c.caller}}</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; color: var(--ink-3)"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">{{c.callee}}</span>
              <span style="margin-left: auto; flex: 0 0 auto; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; color: var(--ink-3)">{{c.ago}}</span>
            </span>
            <span style="font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%">{{c.preview}}</span>
            <span style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
              <sc-if value="{{c.hasState}}" hint-placeholder-val="{{true}}"><span style="font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: {{c.stateBg}}; color: {{c.stateFg}}">{{c.state}}</span></sc-if>
              <span style="font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line-2); color: var(--ink-2)">{{c.kindLabel}}</span>
              <sc-if value="{{c.sealed}}" hint-placeholder-val="{{false}}">
                <span style="font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 5px; background: var(--warn-soft); color: var(--warn)">sealed</span>
              </sc-if>
            </span>
          </button>
        </sc-for>
      </div>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; min-height: 0; max-height: 100%; display: flex; flex-direction: column; background: var(--paper)">

      <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 22px; background: var(--surface); border-bottom: 1px solid var(--line)">
        <div style="display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap">
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: {{cur.callerAvBg}}; color: {{cur.callerAvFg}}">{{cur.callerAv}}</span>
          <h1 style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere">{{cur.caller}}</h1>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="to" style="color: var(--ink-3)"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--ok-soft); color: var(--ok)">{{cur.calleeAv}}</span>
          <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere">{{cur.callee}}</span>
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-left: auto">
          <sc-if value="{{cur.hasState}}" hint-placeholder-val="{{true}}"><span style="display: inline-flex; align-items: baseline; gap: 6px; background: {{cur.stateBg}}; color: {{cur.stateFg}}; border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 600">{{cur.state}}</span></sc-if>
          <span style="display: inline-flex; align-items: baseline; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; font-size: 11.5px"><b style="color: var(--ink-3); font-weight: 500; font-size: 10px; letter-spacing: 0.03em; text-transform: uppercase">context</b><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace">{{cur.contextId}}</span></span>
          <sc-for list="{{cur.tabs}}" as="tb" hint-placeholder-count="2"><button type="button" aria-pressed="{{tb.pressed}}" onClick="{{tb.pick}}" style="min-height: 36px; border: 1px solid {{tb.line}}; background: {{tb.bg}}; color: {{tb.fg}}; border-radius: 7px; padding: 4px 11px; font-size: 12px; font-weight: 600; white-space: nowrap">{{tb.label}}</button></sc-for>
        </div>
      </div>

      <div id="kc-scroll" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 22px 22px 32px">
        <div style="max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px">

          <sc-if value="{{cur.observed}}" hint-placeholder-val="{{false}}">
            <div style="background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; font-size: 12.5px; color: var(--ink-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <span>{{cur.observedText}}</span>
            </div>
          </sc-if>

          <sc-if value="{{cur.sealed}}" hint-placeholder-val="{{false}}">
            <div style="background: var(--warn-soft); border-radius: 10px; padding: 11px 13px; font-size: 12.5px; color: var(--warn); display: flex; gap: 10px; align-items: flex-start">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <span>{{cur.sealedText}}</span>
            </div>
          </sc-if>

<sc-if value="{{cur.empty}}" hint-placeholder-val="{{false}}">
  <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.02em">New chat</h2>
    <div role="group" aria-label="Agent" style="display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; max-width: 100%; overflow-x: auto">
  <sc-for list="{{cur.agentChoices}}" as="ag" hint-placeholder-count="2">
    <button type="button" aria-pressed="{{ag.pressed}}" onClick="{{ag.pick}}" style="flex: 1 0 auto; min-height: 38px; border: 0; border-radius: 7px; padding: 6px 12px; font-size: 12px; white-space: nowrap; background: {{ag.bg}}; color: {{ag.fg}}; font-weight: {{ag.weight}}">{{ag.label}}</button>
  </sc-for>
</div>
    <p style="margin: 0; font-size: 13px; color: var(--ink-2)">{{cur.description}}</p>
    <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3)">Examples from the agent's card</span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{cur.examples}}" as="ex" hint-placeholder-count="3">
        <button type="button" onClick="{{ex.pick}}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; color: var(--ink); font-size: 13px">
          <span style="flex: 0 0 auto; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--line-2); color: var(--ink-2)">{{ex.tag}}</span>
          <span style="min-width: 0; overflow-wrap: anywhere">{{ex.label}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</sc-if>
<sc-for list="{{cur.items}}" as="it" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column">

  <sc-if value="{{it.isMsg}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-direction: column; gap: 6px; max-width: 86%; min-width: 0; align-self: {{it.align}}; align-items: {{it.align}}">
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--ink-3)">
        <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 9px; font-weight: 700; background: {{it.avBg}}; color: {{it.avFg}}">{{it.av}}</span>
        <b style="color: var(--ink-2); font-weight: 600; font-size: 11.5px">{{it.who}}</b>
        <sc-if value="{{it.showKind}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--line-2); color: var(--ink-2)">Message</span>
        </sc-if>
        <time style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px">{{it.time}}</time>
        <sc-if value="{{it.canRaw}}" hint-placeholder-val="{{true}}">
          <button type="button" aria-pressed="{{it.rawOpen}}" onClick="{{it.toggleRaw}}" style="min-height: 36px; background: transparent; border: 1px solid var(--line-2); border-radius: 7px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap">{{it.rawLabel}}</button>
        </sc-if>
      </div>
      <sc-for list="{{it.parts}}" as="p" hint-placeholder-count="1">
        <div style="display: flex; flex-direction: column; min-width: 0; max-width: 100%">
          <sc-if value="{{p.isText}}" hint-placeholder-val="{{true}}">
            <div style="background: {{p.bubbleBg}}; border: 1px solid {{p.bubbleLine}}; border-radius: {{p.radius}}; padding: 10px 14px; font-size: 13.5px; color: var(--ink); white-space: pre-line; overflow-wrap: anywhere">{{p.text}}<sc-if value="{{p.streaming}}" hint-placeholder-val="{{false}}"><span class="caret" aria-hidden="true"></span></sc-if></div>
          </sc-if>
          <sc-if value="{{p.isData}}" hint-placeholder-val="{{false}}">
            <div style="background: {{p.bubbleBg}}; border: 1px solid {{p.bubbleLine}}; border-radius: {{p.radius}}; padding: 10px 12px; min-width: min(420px, 100%); box-sizing: border-box"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; width: 100%">
  <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-3)">{{p.json.label}}</span>
    <button type="button" onClick="{{p.json.expandAll}}" style="margin-left: auto; min-height: 36px; background: transparent; border: 1px solid var(--line-2); border-radius: 7px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap">Expand all</button>
    <button type="button" onClick="{{p.json.collapseAll}}" style="min-height: 36px; background: transparent; border: 1px solid var(--line-2); border-radius: 7px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap">Collapse all</button>
  </div>
  <div style="display: flex; flex-direction: column; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; overflow-x: auto">
    <sc-for list="{{p.json.rows}}" as="r" hint-placeholder-count="3">
      <div style="padding-left: {{r.pad}}">
        <sc-if value="{{r.expandable}}" hint-placeholder-val="{{false}}">
          <button type="button" aria-expanded="{{r.open}}" onClick="{{r.toggle}}" style="display: flex; align-items: flex-start; gap: 4px; width: 100%; text-align: left; background: none; border: 0; padding: 4px 0; min-height: 28px; color: var(--ink); font-family: inherit; font-size: inherit">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 3px; color: var(--ink-3); transform: {{r.rot}}"><path d="M9 6l6 6-6 6"/></svg>
            <span style="min-width: 0; overflow-wrap: anywhere"><span style="color: var(--ink-2)">{{r.key}}</span><span>{{r.text}}</span><span style="color: var(--ink-3)">{{r.summary}}</span></span>
          </button>
        </sc-if>
        <sc-if value="{{r.leaf}}" hint-placeholder-val="{{true}}">
          <div style="padding: 2px 0 2px 16px; min-width: 0; overflow-wrap: anywhere"><span style="color: var(--ink-2)">{{r.key}}</span><span style="color: {{r.color}}">{{r.text}}</span></div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div></div>
          </sc-if>
          <sc-if value="{{p.isFile}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--ink-3)"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.9-8.9a3.7 3.7 0 0 1 5.2 5.2l-8.8 8.8a1.8 1.8 0 0 1-2.6-2.6l8-8"/></svg>
              <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; overflow-wrap: anywhere">{{p.name}}</span>
              <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; color: var(--ink-3)">{{p.mediaType}}</span>
            </div>
          </sc-if>
          <sc-if value="{{p.isSealed}}" hint-placeholder-val="{{false}}">
            <div style="border: 1px dashed var(--line-2); border-radius: {{p.radius}}; padding: 9px 14px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: var(--ink-2)">{{p.text}}</div>
          </sc-if>
        </div>
      </sc-for>
      <sc-if value="{{it.rawOpen}}" hint-placeholder-val="{{false}}">
  <div style="width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; box-sizing: border-box"><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; width: 100%">
  <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-3)">{{it.raw.label}}</span>
    <button type="button" onClick="{{it.raw.expandAll}}" style="margin-left: auto; min-height: 36px; background: transparent; border: 1px solid var(--line-2); border-radius: 7px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap">Expand all</button>
    <button type="button" onClick="{{it.raw.collapseAll}}" style="min-height: 36px; background: transparent; border: 1px solid var(--line-2); border-radius: 7px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap">Collapse all</button>
  </div>
  <div style="display: flex; flex-direction: column; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.5; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; overflow-x: auto">
    <sc-for list="{{it.raw.rows}}" as="rr" hint-placeholder-count="3">
      <div style="padding-left: {{rr.pad}}">
        <sc-if value="{{rr.expandable}}" hint-placeholder-val="{{false}}">

      pNodes = self.nodesData().map(function (n) {
        var chip = chipFor(n.online);
        var services = self.agents.filter(function (a) { return a.node === n.name; }).map(function (a) { return { kind: 'A2A', svc: a.svc, state: 'online', color: 'var(--ok)' }; })
          .concat(self.mcps.filter(function (m) { return m.node === n.name; }).map(function (m) { return { kind: 'MCP', svc: m.svc, state: m.online ? 'online' : 'offline', color: m.online ? 'var(--ok)' : 'var(--bad)' }; }));
        return { name: n.name, owner: n.owner, since: n.since, statusText: chip.text, statusBg: chip.bg, statusFg: chip.fg, services: services };
      });
    }

    return {
      themeClass: (this.props.dark ?? true) ? 'dark' : '',
      navs: navs, d: d,
      filters: filters,
      convs: shown.map(row),
      cur: {
        caller: cur.a, callee: cur.b, callerAv: self.initials(cur.a), calleeAv: self.initials(cur.b),
        callerAvBg: yours ? 'var(--ink)' : 'var(--brand-soft)', callerAvFg: yours ? 'var(--paper)' : 'var(--brand-ink)',
        state: s, hasState: !!s, stateBg: sc[0], stateFg: sc[1], contextId: cur.contextId, tabs: tabs,
        observed: !yours, observedText: cur.observedText || '', sealed: !!cur.sealed,
        sealedText: 'Sealed end to end: only the two nodes can open it. The gate relays ciphertext, so the console is given each event\'s kind and time, never its content, and nothing here can be answered.',
        openTraffic: function () { self.setState({ view: 'traffic', trafficCtx: cur.contextId }); },
        empty: isEmpty, examples: examples, agentChoices: agentChoices, description: card.description,
        canReply: yours, readOnly: !yours, canReplay: !!cur.live, busy: !!cur.busy,
        placeholder: json ? '{ "target": "example.com" }' : 'Message ' + cur.b,
        items: isChat ? cur.items.map(function (it) { return self.viewItem(cur, it); }) : [],
        replay: function () { self.replay(cur); }
      },
      side: side, pTasks: pTasks, pArts: pArts, pAgents: pAgents, pMcp: pMcp, pNodes: pNodes, pTraffic: self.trafficView(seg),
      playSvc: st.playSvc || '', backToAgents: function () { self.setState({ view: 'agents' }); },
      draft: st.draft, modes: modes, hint: hint, hintColor: parsed.error ? 'var(--bad)' : parsed.data !== undefined ? 'var(--ok)' : 'var(--ink-3)',
      rows: json ? 5 : 2, draftFont: json ? "'IBM Plex Mono', ui-monospace, monospace" : 'inherit', draftSize: json ? '12.5px' : '14px',
      sendDisabled: !!cur.busy || !!parsed.empty || !!parsed.error, sendLabel: cur.busy ? 'Streaming…' : 'Send',
      onDraft: function (e) { self.setState({ draft: e.target.value }); },
      onKey: function (e) { if (e.key === 'Enter' && !e.shiftKey && (st.mode === 'text' || e.metaKey || e.ctrlKey)) send(e); },
      send: send,
      newChat: function () { self.startChat('redteam/recon'); }
    };
  }
  startChat(svc) {
    var id = this.nid('n');
    this.convs.unshift({ id: id, kind: 'you', a: 'acme', b: svc, ago: 'now', contextId: 'new context', items: [] });
    this.setState({ view: 'chat', sel: id, filter: this.state.filter === 'agents' ? 'all' : this.state.filter, draft: '', mode: 'text' });
  }
}
DCLogic.mount(Component, document.getElementById('app'), document.getElementById('tpl'));
</script>
</body>
</html>
