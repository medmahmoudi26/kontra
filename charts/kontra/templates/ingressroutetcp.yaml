{{- if .Values.ingressRouteTCP.enabled }}
# TLS passthrough by SNI: Traefik never terminates the gate's TLS (the tunnel's channel binding and built-in
# ACME's TLS-ALPN-01 need the gate's own, D69, D82). With proxyProtocol, the gate reads the client address
# from the PROXY header (kontra.yaml edge.client_ip.from: proxy_protocol, trusting the Traefik pods).
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "kontra.gate" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kontra.labels" (dict "ctx" . "component" "gate") | nindent 4 }}
  {{- with .Values.ingressRouteTCP.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRouteTCP.entryPoints | nindent 4 }}
  routes:
    {{- $sni := list }}
    {{- range .Values.ingressRouteTCP.hosts }}
    {{- $sni = append $sni (printf "HostSNI(`%s`)" .) }}
    {{- end }}
    - match: {{ join " || " $sni | quote }}
      services:
        - name: {{ include "kontra.gate" . }}
          port: {{ .Values.gate.port }}
          {{- if .Values.ingressRouteTCP.proxyProtocol.enabled }}
          proxyProtocol:
            version: {{ .Values.ingressRouteTCP.proxyProtocol.version }}
          {{- end }}
  tls:
    passthrough: true
{{- end }}
