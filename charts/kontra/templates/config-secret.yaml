{{- if not .Values.config.existingSecret }}
# kontra.yaml, from config.kontraYaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kontra.configSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kontra.labels" (dict "ctx" . "component" "gate") | nindent 4 }}
type: Opaque
data:
  kontra.yaml: {{ .Values.config.kontraYaml | b64enc | quote }}
{{- end }}
