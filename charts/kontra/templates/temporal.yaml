{{- if .Values.temporal.enabled }}
{{- $name := include "kontra.temporal" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kontra.labels" (dict "ctx" . "component" "temporal") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "kontra.selectorLabels" (dict "ctx" . "component" "temporal") | nindent 4 }}
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
      protocol: TCP
---
# The Temporal CLI's development server for a small deployment: one process, SQLite in its volume, the
# gate's namespace registered at start, no UI (--headless). Its frontend has no authorizer (spec §14.4):
# the NetworkPolicy admits the gate alone.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kontra.labels" (dict "ctx" . "component" "temporal") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "kontra.selectorLabels" (dict "ctx" . "component" "temporal") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kontra.selectorLabels" (dict "ctx" . "component" "temporal") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "kontra.podSecurityContext" .Values.temporal.runAsUser | nindent 8 }}
      {{- with include "kontra.scheduling" . }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: temporal
          image: "{{ .Values.temporal.image.repository }}:{{ .Values.temporal.image.tag }}"
          imagePullPolicy: {{ .Values.temporal.image.pullPolicy }}
          args:
            - server
            - start-dev
            - --headless
            - --ip
            - 0.0.0.0
            - --port
            - "7233"
            - --namespace
            - {{ .Values.temporal.namespace | quote }}
            - --db-filename
            - /data/temporal.db
            {{- range $key, $value := .Values.temporal.dynamicConfig }}
            - --dynamic-config-value
            - {{ printf "%s=%v" $key $value | quote }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: 7233
              protocol: TCP
          readinessProbe:
            exec:
              command: [temporal, operator, namespace, describe, --namespace, {{ .Values.temporal.namespace | quote }}, --address, "127.0.0.1:7233"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            {{- include "kontra.containerSecurityContext" .Values.temporal.runAsUser | nindent 12 }}
          {{- with .Values.temporal.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "kontra.selectorLabels" (dict "ctx" . "component" "temporal") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.temporal.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.temporal.persistence.size }}
{{- end }}
