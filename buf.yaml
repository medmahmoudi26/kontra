version: v2
modules:
  - path: shared/contracts
deps:
  # protoc-gen-go-temporal annotation options (temporal/v1/temporal.proto) — the Go Nexus
  # handler's workflow/activity/nexus code is generated from actor_service.proto.
  - buf.build/cludden/protoc-gen-go-temporal
lint:
  use:
    - BASIC
  except:
    # The generated Temporal service is a plain RPC surface; kontra's wire stays JSON
    # (ADR 0002), so the RPC-response/enum-zero lint rules don't apply to actor_service.proto.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
