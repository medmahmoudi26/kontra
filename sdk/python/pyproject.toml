[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kontra-sdk"
version = "0.0.0"
description = "Kontra Python SDK seam: the @actor authoring surface, the meta-workflow skeleton, and the claim-check codec."
requires-python = ">=3.10"
dependencies = [
    # SimplePlugin / temporalio.plugin requires a recent SDK; Nexus serve needs >=1.28.
    "temporalio>=1.28",
    "jsonschema>=4.0",
    # Per-actor I/O schemas are derived from the typed @actor.defn class (kontra.schema).
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Actor dependencies (Playwright/Chromium, etc.) are NOT framework extras — they
# live in the actor's own image (examples/python/<actor>/Dockerfile). The SDK declares none.
# PyYAML is not the SDK's — it is `tests/test_workflow_paths.py`'s, which parses `.github/workflows`
# to check that every directory a CI job walks into exists. `dev` is what CI installs to run the
# repo-root suite, so a test-only import belongs here; it was already present on every machine by
# accident, which is exactly how a guard gets added and then fails to collect on the one runner
# that matters.
dev = ["pytest>=8.0", "PyYAML>=6.0"]
# Claim-check offload to an S3 store (SeaweedFS S3 gateway locally, S3 in cloud).
seaweed = ["boto3>=1.28"]
# WHAT AN ACTOR IMAGE NEEDS BEYOND THE AUTHORING SURFACE, and it is an extra rather than a base
# dependency because the two imports are LAZY and the comments at them say so:
# `internals/casstore.py` does `import boto3  # actor-image / [seaweed] extra dep, not a base SDK
# requirement` and `internals/redis_kv.py` does `import redis.asyncio`. Something authoring an actor,
# or deriving its schemas, needs neither.
#
# IT EXISTS BECAUSE THE IMAGE THAT USED TO SUPPLY THEM IS GONE. The deleted worker base ran
# `pip3 install temporalio redis boto3 pydantic`, so every actor image had them and nothing had to
# say so. Under buildpacks an image gets exactly what the actor's requirements name, and the first
# thing that happened was `ModuleNotFoundError: No module named 'boto3'` from inside `actor.serve()`
# — the handler half serving happily beside it, so the worker looked half alive and the Warden
# reported only `hello@0.1.0 is missing`. `cli/packstage.go` requests this extra.
actor = ["boto3>=1.28", "redis>=5.0", "pyyaml>=6.0"]

# No console script: a Python actor is run by `python3 actor.py` (actor.serve()), and
# DISPATCH is the orchestrator's job. Kontra ships no dispatch CLI — a DIY trigger is a
# few lines on the SDK (see examples/python/wordcount/{dispatch,webhook}.py).
#
# ONE DISTRIBUTION, TWO SEAMS, AND THAT IS DELIBERATE. `kontra` is the author surface and lives
# beside this file; `internals` is the runtime and lives under `runtime/python/`, reached here by a
# relative package-dir. They ship together because an actor process needs both — the author's
# `actor.serve()` hands control to the runtime, and a wheel that carried only half of that would
# import and then fail to run. What the split buys is the ARROW, not two installs: `runtime/`
# imports `sdk/`, never the reverse, asserted by tests/test_sdk_arrow.py.
#
# THE DIRECTORY IS NAMED AFTER THE PACKAGE on both sides (`sdk/python/actorkit`,
# `runtime/python/internals`), and that is load-bearing rather than tidy. setuptools' editable
# install APPENDS its finder to sys.meta_path, i.e. AFTER the ordinary path finder — so any
# directory on sys.path whose name matches the package wins over the install. The old layout put
# the package files in `actorkit/python/lib/` under a seam directory called `actorkit/`, which is
# exactly such a directory, so a checkout resolved `import kontra` to the SEAM DIR and got a
# package with no modules in it. The fix was a hand-written `actorkit/__init__.py` at the repo root
# that re-pointed `__path__` at `python/lib` and re-declared every export — a second copy of the
# package header, kept in sync by a test.
#
# Naming the directory after the package removes the collision instead of compensating for it:
# there is no `kontra/` inside the checkout to shadow anything, `sdk/python/kontra/` is a real
# package directory that both the path finder and the editable finder resolve to, and the Temporal
# workflow sandbox — which re-imports fresh and path-scans — finds the same files either way. The
# shim and its duplicate __init__ are gone.
#
# ADR 0044 REOPENS THAT HAZARD ONE LEVEL UP, and it is recorded here because this file is where the
# last one was paid for. The REPOSITORY is called `kontra`, so a `sys.path` containing the PARENT of
# the checkouts resolves `import kontra` to the repo directory as an implicit namespace package:
#
#     $ cd /root/oss && python3 -c "import sys; sys.path.insert(0,'.'); import kontra; print(kontra.__path__)"
#     _NamespacePath(['/root/oss/kontra'])
#
# `actorkit` could not collide because nothing was named that. The parent of a checkout is not how
# anyone runs one, and every project whose package matches its repository has this — but when it does
# bite, `import kontra` SUCCEEDS and the failure arrives later as a missing attribute, so it is
# written down rather than left to be rediscovered.
#
# `actorkit` IS STILL A PACKAGE, and must stay listed: it is the deprecation alias (ADR 0044), it is
# what every already-written Actor imports, and a wheel that dropped it would break them at load()
# on a Machine rather than at install.
#
# `internals.temporal` IS LISTED. It was not, which no editable install ever noticed (the finder
# maps a directory, so subpackages came along); a built wheel dropped the actor host on the floor.
[tool.setuptools]
# `kontra` WAS LISTED TWICE AND `actorkit` NOT AT ALL, which is the failure the comment above warns
# about, arriving one step earlier than predicted: not a wheel that drops the alias, an EDITABLE
# install that never had it. Both halves of one bad edit — see the `package-dir` note below for the
# other half, which pointed the alias at the wrong directory and would have hidden this one.
packages = ["kontra", "actorkit", "internals", "internals.temporal"]

[tool.setuptools.package-dir]
# `actorkit = "kontra"` STOOD HERE AND WAS STALE. It pointed the alias package at the author
# package's directory, so `import actorkit` loaded `kontra/__init__.py` — no deprecation warning, no
# `sys.modules` aliasing, none of what `actorkit/__init__.py` exists to do. It is a leftover from
# when the shim lived at the repository root; `sdk/python/actorkit/` is a real directory now, and
# with no mapping setuptools resolves both packages to their same-named directories, which is what
# the comment above means by the directory being named after the package.
internals = "../../runtime/python/internals"
